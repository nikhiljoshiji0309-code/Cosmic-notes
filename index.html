<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Notes</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000">
<link rel="icon" href="icon-192.png">

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #000;
  color: #fff;
}
.app { max-width: 420px; margin: auto; min-height: 100vh; }
.center { text-align: center; padding: 20px; }
input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #6c63ff;
  color: #fff;
  cursor: pointer;
}
.note {
  background: #111;
  padding: 12px;
  border-radius: 12px;
  margin: 10px;
}
.note .user {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 5px;
}
.note .user img {
  width: 30px;
  height: 30px;
  border-radius: 50%;
}
.note .user span {
  cursor: pointer;
  font-weight: bold;
}
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 1px solid #222;
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="login" class="app center">
  <h2>🌌 Cosmic Notes</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <input id="displayName" placeholder="Your Name">
  <button onclick="emailLogin()">Login / Signup</button>
  <button onclick="googleLogin()" style="background:#db4437">Continue with Google</button>
</div>

<!-- APP SCREEN -->
<div id="app" class="app" style="display:none;">
  <div class="topbar">
    <span>🌌 Cosmic Notes</span>
    <button onclick="logout()" style="width:auto;">Logout</button>
  </div>

  <div id="feed"></div>

  <div class="center">
    <input id="noteInput" placeholder="Write something cosmic...">
    <button onclick="postNote()">Post</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
  authDomain: "cosmic-notes-f7648.firebaseapp.com",
  projectId: "cosmic-notes-f7648",
  messagingSenderId: "70656136344",
  appId: "1:70656136344:web:640193b83f63cac569aced"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const loginDiv = document.getElementById("login");
const appDiv = document.getElementById("app");
const feed = document.getElementById("feed");

auth.onAuthStateChanged(user => {
  if (user) {
    // Save user info in Firestore
    if (!user.displayName) user.updateProfile({ displayName: document.getElementById('displayName').value || 'Cosmic User' });
    
    db.collection("users").doc(user.uid).set({
      displayName: user.displayName || document.getElementById('displayName').value || 'Cosmic User',
      photoURL: user.photoURL || "https://i.pravatar.cc/150?img=3", // default avatar
      bio: "Hello! I'm cosmic.",
    }, { merge: true });

    loginDiv.style.display = "none";
    appDiv.style.display = "block";
    loadNotes();
  } else {
    loginDiv.style.display = "block";
    appDiv.style.display = "none";
  }
});

function emailLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const displayName = document.getElementById('displayName').value || 'Cosmic User';

  auth.signInWithEmailAndPassword(email, password)
    .catch(() => {
      auth.createUserWithEmailAndPassword(email, password).then(cred => {
        cred.user.updateProfile({ displayName });
      });
    });
}

function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

function logout() {
  auth.signOut();
}

function postNote() {
  const text = document.getElementById('noteInput').value;
  if (!text) return;

  db.collection("notes").add({
    text,
    uid: auth.currentUser.uid,
    time: Date.now()
  });

  document.getElementById('noteInput').value = "";
}

function loadNotes() {
  db.collection("notes").orderBy("time","desc")
    .onSnapshot(async snapshot => {
      feed.innerHTML = "";
      for (let doc of snapshot.docs) {
        const data = doc.data();
        const userDoc = await db.collection("users").doc(data.uid).get();
        const userData = userDoc.data();

        const div = document.createElement("div");
        div.className = "note";

        div.innerHTML = `
          <div class="user">
            <img src="${userData.photoURL}" alt="avatar">
            <span onclick="goToProfile('${data.uid}')">${userData.displayName}</span>
          </div>
          <div>${data.text}</div>
        `;
        feed.appendChild(div);
      }
    });
}

function goToProfile(uid) {
  window.location.href = `profile.html?uid=${uid}`;
}
</script>
</body>
</html>
