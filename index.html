<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexus Gram</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#03030b">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js"></script>

<style>
body{margin:0;background:#03030b;color:white;font-family:sans-serif}
.hidden{display:none}
.post{background:#0a0a12;margin:10px;padding:10px;border-radius:10px}
</style>
</head>

<body>

<div id="auth">
  <h1>NEXUS GRAM</h1>
  <button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
  <button onclick="logout()">Logout</button>
  <button onclick="openPost()">➕ Post</button>
  <div id="feed"></div>
</div>

<div id="postBox" class="hidden">
  <textarea id="caption"></textarea>
  <input type="file" id="image">
  <button onclick="publish()">Publish</button>
</div>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
  apiKey: "YOUR_API_KEY",
  authDomain: "cosmic-notes-f7648.firebaseapp.com",
  projectId: "cosmic-notes-f7648",
  storageBucket: "cosmic-notes-f7648.appspot.com",
  messagingSenderId: "70656136344",
  appId: "YOUR_APP_ID"
});

const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();
const messaging=firebase.messaging();

let user=null;

/* 🔐 AUTH */
function login(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}
function logout(){ auth.signOut(); }

auth.onAuthStateChanged(u=>{
  if(u){
    user=u;
    authUI(true);
    loadFeed();
    initPush();
    syncOfflinePosts();
  }else authUI(false);
});

function authUI(state){
  document.getElementById("auth").style.display=state?"none":"block";
  document.getElementById("app").classList.toggle("hidden",!state);
}

/* 📰 FEED */
function loadFeed(){
  db.collection("posts").orderBy("time","desc")
  .onSnapshot(snap=>{
    feed.innerHTML="";
    snap.forEach(d=>{
      const p=d.data();
      feed.innerHTML+=`
        <div class="post">
          <b>${p.user}</b>
          ${p.image?`<img src="${p.image}" width="100%">`:""}
          <p>${p.text}</p>
        </div>`;
    });
  });
}

/* ➕ POST */
function openPost(){
  postBox.classList.toggle("hidden");
}

async function publish(){
  if(!navigator.onLine){
    saveOfflinePost();
    alert("Saved offline. Will upload later.");
    return;
  }
  await uploadPost();
}

async function uploadPost(post=null){
  const text=post?.text||caption.value;
  const file=post?.file||image.files[0];
  let img=null;

  if(file){
    const ref=storage.ref("posts/"+Date.now());
    await ref.put(file);
    img=await ref.getDownloadURL();
  }

  await db.collection("posts").add({
    user:user.displayName,
    userId:user.uid,
    text,image:img,
    time:firebase.firestore.FieldValue.serverTimestamp()
  });

  postBox.classList.add("hidden");
}

/* 📦 OFFLINE QUEUE (IndexedDB) */
function saveOfflinePost(){
  const req=indexedDB.open("offlineDB",1);
  req.onupgradeneeded=e=>{
    e.target.result.createObjectStore("posts",{autoIncrement:true});
  };
  req.onsuccess=e=>{
    const dbx=e.target.result;
    const tx=dbx.transaction("posts","readwrite");
    tx.objectStore("posts").add({
      text:caption.value,
      file:image.files[0]
    });
  };
}

function syncOfflinePosts(){
  if(!navigator.onLine) return;
  const req=indexedDB.open("offlineDB",1);
  req.onsuccess=e=>{
    const dbx=e.target.result;
    const tx=dbx.transaction("posts","readwrite");
    const store=tx.objectStore("posts");
    store.getAll().onsuccess=async ev=>{
      for(const p of ev.target.result){
        await uploadPost(p);
      }
      store.clear();
    };
  };
}

window.addEventListener("online",syncOfflinePosts);

/* 🔔 PUSH NOTIFICATIONS */
async function initPush(){
  try{
    const token=await messaging.getToken({
      vapidKey:"YOUR_PUBLIC_VAPID_KEY"
    });
    if(token){
      await db.collection("tokens").doc(user.uid).set({token});
    }
  }catch(e){console.log("Push denied");}
}

messaging.onMessage(payload=>{
  alert(payload.notification.title);
});

/* ♻️ APP UPDATE SYSTEM */
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js")
  .then(reg=>{
    reg.onupdatefound=()=>{
      const sw=reg.installing;
      sw.onstatechange=()=>{
        if(sw.state==="installed"&&navigator.serviceWorker.controller){
          location.reload();
        }
      };
    };
  });
}
</script>
</body>
</html>
