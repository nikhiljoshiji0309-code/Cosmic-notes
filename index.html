<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Gram | Cosmic Social Network</title>
  
    <!-- Firebase Scripts (CDN - Simple Approach) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>
   
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <style>
        /* Root Variables */
        :root {
            --theme-bg: #03030b;
            --theme-panel: rgba(10, 10, 18, 0.98);
            --theme-text: #f0f0f0;
            --theme-text-dim: #a0a0a0;
            --theme-border: rgba(0, 210, 255, 0.15);
            --theme-accent: #00d2ff;
            --theme-accent-dark: #00b2df;
            --theme-accent-glow: rgba(0, 210, 255, 0.4);
            --theme-wa-sent: #005c4b;
            --theme-wa-received: #202c33;
            --theme-danger: #ff3b3b;
            --theme-online: #00ff88;
            --theme-away: #ffbb00;
            --theme-offline: #555;
            --theme-like: #ff4081;
            --theme-comment: #2196f3;
            --theme-share: #4caf50;
            --theme-story-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --theme-shadow: 0 4px 12px rgba(0,0,0,0.1);
        }
       
        .light-theme {
            --theme-bg: #f8f9fa;
            --theme-panel: #ffffff;
            --theme-text: #111111;
            --theme-text-dim: #666666;
            --theme-border: rgba(0, 150, 255, 0.2);
            --theme-accent: #0077cc;
            --theme-accent-dark: #005fa3;
            --theme-accent-glow: rgba(0, 119, 204, 0.3);
            --theme-wa-sent: #dcf8c6;
            --theme-wa-received: #ffffff;
        }
       
        * {
            box-sizing: border-box;
            outline: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
       
        body, html {
            background: var(--theme-bg);
            color: var(--theme-text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: background 0.3s ease;
        }
       
        #star-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .light-theme #star-canvas { display: none; }
       
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
       
        #auth-gate {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: var(--theme-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
       
        .gate-logo {
            font-size: 3rem;
            font-weight: 900;
            color: var(--theme-accent);
            letter-spacing: 20px;
            text-shadow: 0 0 30px var(--theme-accent);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
       
        #identity-lock {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
       
        .lock-box {
            background: var(--theme-panel);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--theme-border);
            max-width: 500px;
            width: 100%;
            box-shadow: var(--theme-shadow);
            animation: slideUp 0.5s ease;
        }
       
        .nexus-wrapper {
            display: none;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
            flex-direction: column;
            animation: fadeIn 1s ease;
        }
       
        .app-header {
            height: 60px;
            background: var(--theme-panel);
            border-bottom: 1px solid var(--theme-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: var(--theme-shadow);
        }
       
        .header-logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--theme-accent);
        }
       
        .header-icons {
            display: flex;
            gap: 16px;
        }
       
        .header-icon {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
       
        .header-icon:hover, .header-icon.active {
            color: var(--theme-accent);
            transform: scale(1.1);
        }
       
        .bottom-nav {
            height: 60px;
            background: var(--theme-panel);
            border-top: 1px solid var(--theme-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
       
        .nav-icon {
            font-size: 1.4rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
       
        .nav-icon.active {
            color: var(--theme-accent);
            transform: scale(1.1);
        }
       
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-top: 60px;
            padding-bottom: 60px;
            max-width: 935px;
            margin: 0 auto;
            width: 100%;
        }
       
        .content-view { display: none; }
        .content-view.active { display: flex; flex-direction: column; }
       
        .stories-bar {
            display: flex;
            overflow-x: auto;
            padding: 16px 0;
            gap: 8px;
            border-bottom: 1px solid var(--theme-border);
        }
       
        .story-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--theme-story-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
       
        .story-circle:hover {
            transform: scale(1.05);
        }
       
        .story-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--theme-panel);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
       
        .story-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
       
        .feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
       
        .post-card {
            background: var(--theme-panel);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
            animation: scaleIn 0.3s ease;
        }
       
        .post-header {
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 8px;
        }
       
        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
        }
       
        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
       
        .post-username {
            font-weight: bold;
            color: var(--theme-accent);
        }
       
        .post-time {
            font-size: 0.875rem;
            color: var(--theme-text-dim);
            margin-left: auto;
        }
       
        .post-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
        }
       
        .post-actions {
            display: flex;
            gap: 16px;
            padding: 8px 16px;
        }
       
        .action-btn {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: all 0.2s;
            background: none;
            border: none;
        }
       
        .action-btn:hover, .action-btn.liked {
            color: var(--theme-accent);
            transform: scale(1.1);
        }
       
        .action-btn.liked {
            color: var(--theme-like);
        }
       
        .post-caption {
            padding: 0 16px 16px;
            font-size: 0.875rem;
        }
       
        .post-comments {
            padding: 0 16px 16px;
            border-top: 1px solid var(--theme-border);
            margin-top: 8px;
        }
       
        .comment {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
       
        .comment-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            overflow: hidden;
        }
       
        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
       
        .comment-content {
            flex: 1;
        }
       
        .comment-username {
            font-weight: bold;
            color: var(--theme-comment);
            margin-right: 5px;
        }
       
        .comment-text {
            font-size: 0.875rem;
        }
       
        .comment-input {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
       
        .comment-input input {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 20px;
            padding: 8px 12px;
            color: var(--theme-text);
            font-size: 0.875rem;
        }
       
        .comment-send {
            color: var(--theme-accent);
            cursor: pointer;
            font-size: 1.2rem;
            background: none;
            border: none;
        }
       
        #publish-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
       
        .publish-box {
            background: var(--theme-panel);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--theme-border);
            max-width: 600px;
            width: 90%;
            animation: slideUp 0.3s ease;
        }
       
        .publish-header {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--theme-accent);
        }
       
        .publish-textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            padding: 16px;
            color: var(--theme-text);
            resize: vertical;
            margin-bottom: 16px;
            font-family: inherit;
        }
       
        .publish-image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
        }
       
        .publish-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            align-items: center;
        }
       
        .publish-btn {
            background: var(--theme-accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
       
        .publish-btn:hover {
            background: var(--theme-accent-dark);
            transform: translateY(-2px);
        }
       
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--theme-border);
        }
       
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 16px;
            overflow: hidden;
        }
       
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
       
        .profile-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--theme-accent);
        }
       
        .profile-bio {
            font-size: 0.875rem;
            color: var(--theme-text-dim);
            text-align: center;
            margin: 8px 0;
        }
       
        .profile-stats {
            display: flex;
            gap: 24px;
            margin-top: 8px;
        }
       
        .stat {
            text-align: center;
        }
       
        .stat-number {
            font-weight: bold;
            font-size: 1.25rem;
        }
       
        .stat-label {
            font-size: 0.875rem;
            color: var(--theme-text-dim);
        }
       
        .profile-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            padding: 8px;
        }
       
        .profile-post-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
       
        .profile-post-img:hover {
            transform: scale(1.05);
        }
       
        .messages-list {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
        }
       
        .message-thread {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--theme-border);
            cursor: pointer;
            transition: background 0.2s;
        }
       
        .message-thread:hover {
            background: var(--theme-accent-glow);
        }
       
        .message-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 16px;
        }
       
        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
       
        .message-info {
            flex: 1;
        }
       
        .message-username {
            font-weight: bold;
            font-size: 0.875rem;
        }
       
        .message-preview {
            font-size: 0.875rem;
            color: var(--theme-text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
       
        .message-view {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
        }
       
        .message-header {
            padding: 16px;
            border-bottom: 1px solid var(--theme-border);
            display: flex;
            align-items: center;
            gap: 16px;
        }
       
        .message-back {
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }
       
        .message-back:hover {
            color: var(--theme-accent);
        }
       
        .message-title {
            font-weight: bold;
        }
       
        .message-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
       
        .msg-bubble {
            max-width: 70%;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
        }
       
        .msg-received {
            background: var(--theme-wa-received);
            align-self: flex-start;
        }
       
        .msg-sent {
            background: var(--theme-wa-sent);
            align-self: flex-end;
            color: #fff;
        }
       
        .message-input {
            display: flex;
            padding: 16px;
            border-top: 1px solid var(--theme-border);
            gap: 8px;
        }
       
        .message-input input {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 25px;
            padding: 8px 16px;
            color: var(--theme-text);
        }
       
        .message-send {
            color: var(--theme-accent);
            cursor: pointer;
            font-size: 1.2rem;
            background: none;
            border: none;
        }
       
        .search-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 25px;
            margin: 16px 0;
            color: var(--theme-text);
        }
       
        .search-results {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
       
        .search-user {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
       
        .search-user:hover {
            background: var(--theme-accent-glow);
        }
       
        .search-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 16px;
        }
       
        .search-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
       
        .search-name {
            font-weight: bold;
            font-size: 0.875rem;
        }
       
        .search-bio {
            font-size: 0.875rem;
            color: var(--theme-text-dim);
            margin-left: 8px;
        }
       
        .follow-btn {
            margin-left: auto;
            background: var(--theme-accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            margin-right: 8px;
        }
       
        .follow-btn:hover {
            background: var(--theme-accent-dark);
        }
       
        .loading-spinner {
            border: 4px solid var(--theme-border);
            border-top: 4px solid var(--theme-accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 24px auto;
        }
       
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
       
        .hidden { display: none !important; }
       
        .btn-primary {
            background: var(--theme-accent);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            width: 100%;
            max-width: 250px;
        }
       
        .btn-primary:hover {
            background: var(--theme-accent-dark);
            transform: translateY(-2px);
        }
       
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            color: var(--theme-text);
            font-size: 1rem;
            font-family: inherit;
        }
       
        textarea {
            resize: vertical;
            min-height: 80px;
        }
       
        @media (min-width: 768px) {
            .app-header { display: none; }
            .bottom-nav { display: none; }
            .sidebar {
                width: 72px;
                background: var(--theme-panel);
                border-right: 1px solid var(--theme-border);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 24px 0;
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                transition: width 0.3s;
            }
            .sidebar:hover { width: 240px; }
            .sidebar-icon {
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 16px 0;
                border-radius: 50%;
                cursor: pointer;
                font-size: 1.5rem;
                color: var(--theme-text-dim);
                transition: all 0.2s;
            }
            .sidebar-icon:hover, .sidebar-icon.active {
                background: var(--theme-accent-glow);
                color: var(--theme-accent);
            }
            .sidebar-label {
                display: none;
            }
            .sidebar:hover .sidebar-label {
                display: inline;
                margin-left: 16px;
                font-size: 1rem;
            }
            .main-content {
                margin-left: 72px;
                padding-top: 0;
                padding-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <canvas id="star-canvas"></canvas>
   
    <!-- Auth Screen -->
    <div id="auth-gate">
        <div class="gate-logo">NEXUS GRAM</div>
        <p style="color:var(--theme-text-dim); margin-bottom:30px; letter-spacing:2px;">COSMIC SOCIAL PROTOCOL</p>
        <button class="btn-primary" onclick="handleLogin()">INITIALIZE SYNC</button>
    </div>
   
    <!-- Setup Screen -->
    <div id="identity-lock">
        <div class="lock-box">
            <h2 style="color:var(--theme-accent); margin:0 0 10px 0;">PILOT CREDENTIALS</h2>
            <p style="color:var(--theme-text-dim); font-size:0.85rem; margin-bottom:20px;">Set up your cosmic identity.</p>
           
            <label style="font-size:0.75rem; color:var(--theme-accent);">CALLSIGN</label>
            <input type="text" id="pilot-name" placeholder="e.g. CosmicExplorer">
           
            <label style="font-size:0.75rem; color:var(--theme-accent); margin-top:12px; display:block;">STATUS</label>
            <select id="pilot-status">
                <option value="online">🟢 Online</option>
                <option value="away">🟡 Away</option>
                <option value="offline">⚪ Offline</option>
            </select>
           
            <label style="font-size:0.75rem; color:var(--theme-accent); margin-top:12px; display:block;">BIO</label>
            <textarea id="pilot-bio" maxlength="160" placeholder="Your cosmic journey..."></textarea>
           
            <button class="btn-primary" onclick="submitIdentity()">LAUNCH PROFILE</button>
        </div>
    </div>
   
    <!-- Main App -->
    <div class="nexus-wrapper" id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-logo">Nexus Gram</div>
            <div class="header-icons">
                <i class="fas fa-home header-icon" onclick="navigate('home')"></i>
                <i class="fas fa-search header-icon" onclick="navigate('search')"></i>
                <i class="fas fa-plus-square header-icon" onclick="openPublishModal()"></i>
                <i class="fas fa-comment-dots header-icon" onclick="navigate('messages')"></i>
                <i class="fas fa-user header-icon" onclick="navigate('profile')"></i>
            </div>
        </header>
       
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-icon" onclick="navigate('home')"><i class="fas fa-home"></i><span class="sidebar-label">Home</span></div>
            <div class="sidebar-icon" onclick="navigate('search')"><i class="fas fa-search"></i><span class="sidebar-label">Search</span></div>
            <div class="sidebar-icon" onclick="openPublishModal()"><i class="fas fa-plus-square"></i><span class="sidebar-label">Post</span></div>
            <div class="sidebar-icon" onclick="navigate('messages')"><i class="fas fa-comment-dots"></i><span class="sidebar-label">Messages</span></div>
            <div class="sidebar-icon" onclick="navigate('profile')"><i class="fas fa-user"></i><span class="sidebar-label">Profile</span></div>
            <div style="margin-top:auto;">
                <div class="sidebar-icon" onclick="toggleTheme()"><i class="fas fa-moon"></i><span class="sidebar-label">Theme</span></div>
                <div class="sidebar-icon" onclick="handleLogout()" style="color:var(--theme-danger);"><i class="fas fa-sign-out-alt"></i><span class="sidebar-label">Logout</span></div>
            </div>
        </aside>
       
        <!-- Main Content -->
        <main class="main-content">
            <!-- Home -->
            <div id="home-view" class="content-view active">
                <div class="stories-bar" id="stories-bar"></div>
                <div class="feed" id="feed"></div>
            </div>
           
            <!-- Search -->
            <div id="search-view" class="content-view">
                <input type="text" class="search-input" id="search-input" placeholder="Search users...">
                <div class="search-results" id="search-results"></div>
            </div>
           
            <!-- Messages -->
            <div id="messages-view" class="content-view" style="flex-direction: row;">
                <div class="messages-list" id="messages-list"></div>
                <div class="message-view hidden" id="message-view">
                    <div class="message-header">
                        <i class="fas fa-arrow-left message-back" onclick="backToMessagesList()"></i>
                        <span class="message-title" id="message-title"></span>
                    </div>
                    <div class="message-viewport" id="message-viewport"></div>
                    <div class="message-input">
                        <input type="text" id="message-input-text" placeholder="Type message...">
                        <button class="message-send" onclick="sendMessage()" style="background:none; border:none; padding:0;"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
           
            <!-- Profile -->
            <div id="profile-view" class="content-view">
                <div class="profile-header" id="profile-header"></div>
                <div class="profile-posts" id="profile-posts"></div>
            </div>
        </main>
       
        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <i class="fas fa-home nav-icon active" onclick="navigate('home')"></i>
            <i class="fas fa-search nav-icon" onclick="navigate('search')"></i>
            <i class="fas fa-plus-square nav-icon" onclick="openPublishModal()"></i>
            <i class="fas fa-comment-dots nav-icon" onclick="navigate('messages')"></i>
            <i class="fas fa-user nav-icon" onclick="navigate('profile')"></i>
        </nav>
    </div>
   
    <!-- Post Modal -->
    <div id="publish-modal">
        <div class="publish-box">
            <div class="publish-header">Create Post</div>
            <textarea class="publish-textarea" id="post-caption" placeholder="What's on your mind?"></textarea>
            <img id="post-image-preview" class="publish-image-preview">
            <div class="publish-actions">
                <label for="post-image-upload" style="cursor:pointer; color:var(--theme-accent);"><i class="fas fa-image"></i> Image</label>
                <input type="file" id="post-image-upload" accept="image/*" style="display:none" onchange="previewPostImage(this)">
                <button class="publish-btn" onclick="publishPost()">Post</button>
            </div>
        </div>
    </div>
   
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
            authDomain: "cosmic-notes-f7648.firebaseapp.com",
            projectId: "cosmic-notes-f7648",
            storageBucket: "cosmic-notes-f7648.appspot.com",
            messagingSenderId: "70656136344",
            appId: "1:70656136344:web:640193b83f63cac569aced"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentUser = null;
        let activeView = 'home';
        let activeMessageThread = null;
        let userCache = new Map();
        let posts = [];

        // Toggle Theme
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');

        // Auth
        async function handleLogin() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                currentUser = result.user;
            } catch (error) {
                alert('Login error: ' + error.message);
            }
        }

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                db.collection('users').doc(user.uid).get().then(doc => {
                    if (!doc.exists || !doc.data().name) {
                        document.getElementById('auth-gate').style.display = 'none';
                        document.getElementById('identity-lock').style.display = 'flex';
                    } else {
                        document.getElementById('auth-gate').style.display = 'none';
                        document.getElementById('identity-lock').style.display = 'none';
                        document.getElementById('app').style.display = 'flex';
                        loadApp();
                    }
                });
            } else {
                document.getElementById('auth-gate').style.display = 'flex';
                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').style.display = 'none';
            }
        });

        async function submitIdentity() {
            const name = document.getElementById('pilot-name').value.trim();
            const status = document.getElementById('pilot-status').value;
            const bio = document.getElementById('pilot-bio').value.trim() || 'No bio';

            if (name.length < 3) return alert('Name too short');

            try {
                await db.collection('users').doc(currentUser.uid).set({
                    name, status, bio,
                    avatar: currentUser.photoURL || 'https://via.placeholder.com/100',
                    followers: [], following: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                loadApp();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function handleLogout() {
            auth.signOut();
        }

        // Navigation
        function navigate(view) {
            activeView = view;
            document.querySelectorAll('.content-view').forEach(el => el.classList.remove('active'));
            document.getElementById(view + '-view').classList.add('active');

            document.querySelectorAll('.nav-icon, .sidebar-icon').forEach(el => el.classList.remove('active'));
            const selector = view === 'home' ? '[onclick*="navigate(\'home\')"]' :
                           view === 'search' ? '[onclick*="navigate(\'search\')"]' :
                           view === 'messages' ? '[onclick*="navigate(\'messages\')"]' :
                           '[onclick*="navigate(\'profile\')"]';
            document.querySelectorAll(selector).forEach(el => el.classList.add('active'));

            if (view === 'search') loadSearch();
            if (view === 'messages') loadMessages();
            if (view === 'profile') loadProfile();
        }

        // Get User
        async function getUser(uid) {
            if (userCache.has(uid)) return userCache.get(uid);
            const doc = await db.collection('users').doc(uid).get();
            if (doc.exists) {
                userCache.set(uid, doc.data());
                return doc.data();
            }
            return null;
        }

        // Stories
        async function loadStories() {
            const bar = document.getElementById('stories-bar');
            bar.innerHTML = '';
            const myStory = document.createElement('div');
            myStory.className = 'story-circle';
            myStory.innerHTML = '<i class="fas fa-plus" style="font-size:1.5rem;"></i>';
            myStory.onclick = () => alert('Add story coming soon');
            bar.appendChild(myStory);

            const user = await getUser(currentUser.uid);
            if (user && user.following) {
                for (let uid of user.following.slice(0, 10)) {
                    const u = await getUser(uid);
                    if (u) {
                        const story = document.createElement('div');
                        story.className = 'story-circle';
                        story.innerHTML = `<div class="story-avatar"><img src="${u.avatar}"></div>`;
                        bar.appendChild(story);
                    }
                }
            }
        }

        // Feed
        async function loadFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '<div class="loading-spinner"></div>';

            db.collection('posts').orderBy('createdAt', 'desc').limit(20).onSnapshot(snapshot => {
                posts = [];
                snapshot.forEach(doc => {
                    posts.push({ ...doc.data(), id: doc.id });
                });
                renderFeed();
            });
        }

        async function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            for (let post of posts) {
                const user = await getUser(post.userId);
                if (!user) continue;

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-avatar"><img src="${user.avatar}"></div>
                        <span class="post-username">${user.name}</span>
                        <span class="post-time">${post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString() : 'now'}</span>
                    </div>
                    ${post.image ? `<img class="post-image" src="${post.image}">` : ''}
                    <div class="post-actions">
                        <button class="action-btn ${post.likes?.includes(currentUser.uid) ? 'liked' : ''}" onclick="toggleLike('${post.id}')"><i class="fas fa-heart"></i></button>
                        <button class="action-btn" onclick="focusComment('${post.id}')"><i class="fas fa-comment"></i></button>
                        <button class="action-btn" onclick="alert('Share coming soon')"><i class="fas fa-share"></i></button>
                    </div>
                    <div class="post-caption">${post.caption}</div>
                    <div class="post-comments" id="comments-${post.id}"></div>
                    <div class="comment-input">
                        <input type="text" id="comment-input-${post.id}" placeholder="Add comment...">
                        <button class="comment-send" onclick="addComment('${post.id}')" style="background:none; border:none; padding:0;"><i class="fas fa-paper-plane"></i></button>
                    </div>
                `;
                feed.appendChild(card);

                // Load comments
                if (post.comments) {
                    const commentsDiv = document.getElementById(`comments-${post.id}`);
                    for (let comment of post.comments) {
                        const commentUser = await getUser(comment.userId);
                        const commentEl = document.createElement('div');
                        commentEl.className = 'comment';
                        commentEl.innerHTML = `
                            <div class="comment-avatar"><img src="${commentUser?.avatar || 'https://via.placeholder.com/30'}"></div>
                            <div class="comment-content">
                                <span class="comment-username">${commentUser?.name || 'User'}</span>
                                <span class="comment-text">${comment.text}</span>
                            </div>
                        `;
                        commentsDiv.appendChild(commentEl);
                    }
                }
            }
        }

        async function toggleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            let likes = post.likes || [];
            if (likes.includes(currentUser.uid)) {
                likes = likes.filter(id => id !== currentUser.uid);
            } else {
                likes.push(currentUser.uid);
            }

            await db.collection('posts').doc(postId).update({ likes });
        }

        async function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const post = posts.find(p => p.id === postId);
            let comments = post.comments || [];
            comments.push({
                userId: currentUser.uid,
                text,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            await db.collection('posts').doc(postId).update({ comments });
            input.value = '';
        }

        function focusComment(postId) {
            document.getElementById(`comment-input-${postId}`).focus();
        }

        // Post Modal
        function openPublishModal() {
            document.getElementById('post-caption').value = '';
            document.getElementById('post-image-preview').style.display = 'none';
            document.getElementById('publish-modal').style.display = 'flex';
        }

        function previewPostImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('post-image-preview').src = e.target.result;
                    document.getElementById('post-image-preview').style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function publishPost() {
            const caption = document.getElementById('post-caption').value.trim();
            const file = document.getElementById('post-image-upload').files[0];

            if (!caption && !file) return alert('Add content');

            document.getElementById('publish-modal').style.display = 'none';

            let image = null;
            if (file) {
                const ref = storage.ref(`posts/${currentUser.uid}/${Date.now()}`);
                await ref.put(file);
                image = await ref.getDownloadURL();
            }

            await db.collection('posts').add({
                userId: currentUser.uid,
                caption, image,
                likes: [], comments: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            loadFeed();
        }

        // Search
        async function loadSearch() {
            const input = document.getElementById('search-input');
            input.addEventListener('input', debounce(async () => {
                const query = input.value.toLowerCase().trim();
                const results = document.getElementById('search-results');
                if (!query) { results.innerHTML = ''; return; }

                const snapshot = await db.collection('users').get();
                results.innerHTML = '';

                snapshot.forEach(doc => {
                    const user = doc.data();
                    if (doc.id !== currentUser.uid && user.name.toLowerCase().includes(query)) {
                        const card = document.createElement('div');
                        card.className = 'search-user';
                        card.innerHTML = `
                            <div class="search-avatar"><img src="${user.avatar}"></div>
                            <span class="search-name">${user.name}</span>
                            <span class="search-bio">${user.bio}</span>
                            <button class="follow-btn" onclick="toggleFollow('${doc.id}')">${user.followers?.includes(currentUser.uid) ? 'Following' : 'Follow'}</button>
                            <i class="fas fa-message" onclick="startMessage('${doc.id}')" style="cursor:pointer; color:var(--theme-comment);"></i>
                        `;
                        results.appendChild(card);
                    }
                });
            }, 300));
        }

        async function toggleFollow(uid) {
            const userRef = db.collection('users').doc(currentUser.uid);
            const otherRef = db.collection('users').doc(uid);

            const user = await userRef.get();
            const other = await otherRef.get();

            let following = user.data().following || [];
            let followers = other.data().followers || [];

            if (following.includes(uid)) {
                following = following.filter(id => id !== uid);
                followers = followers.filter(id => id !== currentUser.uid);
            } else {
                following.push(uid);
                followers.push(currentUser.uid);
            }

            await userRef.update({ following });
            await otherRef.update({ followers });
            userCache.clear();
        }

        // Messages
        async function loadMessages() {
            const list = document.getElementById('messages-list');
            list.innerHTML = '<div class="loading-spinner"></div>';

            db.collection('conversations')
                .where('participants', 'array-contains', currentUser.uid)
                .orderBy('lastMessageTime', 'desc')
                .onSnapshot(snapshot => {
                    list.innerHTML = '';
                    snapshot.forEach(doc => {
                        const conv = doc.data();
                        const otherUid = conv.participants.find(id => id !== currentUser.uid);
                        getUser(otherUid).then(user => {
                            if (user) {
                                const thread = document.createElement('div');
                                thread.className = 'message-thread';
                                thread.innerHTML = `
                                    <div class="message-avatar"><img src="${user.avatar}"></div>
                                    <div class="message-info">
                                        <span class="message-username">${user.name}</span>
                                        <span class="message-preview">${conv.lastMessage}</span>
                                    </div>
                                `;
                                thread.onclick = () => openMessageThread(doc.id, user);
                                list.appendChild(thread);
                            }
                        });
                    });
                });
        }

        function openMessageThread(convId, user) {
            activeMessageThread = convId;
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('message-view').classList.remove('hidden');
            document.getElementById('message-title').textContent = user.name;

            db.collection('conversations').doc(convId).collection('messages')
                .orderBy('createdAt', 'asc')
                .onSnapshot(snapshot => {
                    const viewport = document.getElementById('message-viewport');
                    const isScrolledToBottom = viewport.scrollHeight - viewport.clientHeight <= viewport.scrollTop + 1;

                    snapshot.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            const msg = change.doc.data();
                            const bubble = document.createElement('div');
                            bubble.className = `msg-bubble ${msg.userId === currentUser.uid ? 'msg-sent' : 'msg-received'}`;
                            bubble.textContent = msg.text;
                            viewport.appendChild(bubble);

                            if (isScrolledToBottom) viewport.scrollTop = viewport.scrollHeight;
                        }
                    });
                });
        }

        function backToMessagesList() {
            document.getElementById('messages-list').classList.remove('hidden');
            document.getElementById('message-view').classList.add('hidden');
            activeMessageThread = null;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input-text');
            const text = input.value.trim();
            if (!text || !activeMessageThread) return;

            const convRef = db.collection('conversations').doc(activeMessageThread);
            await convRef.collection('messages').add({
                userId: currentUser.uid,
                text,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            await convRef.update({
                lastMessage: text,
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            });

            input.value = '';
        }

        async function startMessage(uid) {
            const participants = [currentUser.uid, uid].sort();
            const convId = participants.join('-');

            const convRef = db.collection('conversations').doc(convId);
            const convDoc = await convRef.get();

            if (!convDoc.exists) {
                await convRef.set({
                    participants,
                    lastMessage: '',
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            const user = await getUser(uid);
            openMessageThread(convId, user);
        }

        // Profile
        async function loadProfile() {
            const user = await getUser(currentUser.uid);
            const postCount = (await db.collection('posts').where('userId', '==', currentUser.uid).get()).size;

            const header = document.getElementById('profile-header');
            header.innerHTML = `
                <div class="profile-avatar"><img src="${user.avatar}"></div>
                <span class="profile-name">${user.name}</span>
                <span class="profile-bio">${user.bio}</span>
                <div class="profile-stats">
                    <div class="stat"><span class="stat-number">${(user.followers || []).length}</span><span class="stat-label">Followers</span></div>
                    <div class="stat"><span class="stat-number">${(user.following || []).length}</span><span class="stat-label">Following</span></div>
                    <div class="stat"><span class="stat-number">${postCount}</span><span class="stat-label">Posts</span></div>
                </div>
            `;

            const postsDiv = document.getElementById('profile-posts');
            postsDiv.innerHTML = '';
            const snapshot = await db.collection('posts').where('userId', '==', currentUser.uid).orderBy('createdAt', 'desc').get();
            snapshot.forEach(doc => {
                const post = doc.data();
                if (post.image) {
                    const img = document.createElement('img');
                    img.className = 'profile-post-img';
                    img.src = post.image;
                    postsDiv.appendChild(img);
                }
            });
        }

        // Star Canvas
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = Array.from({ length: 100 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                opacity: Math.random() * 0.5 + 0.5
            }));
        }
        function renderStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(renderStars);
        }
        window.addEventListener('resize', initStars);
        initStars();
        renderStars();

        // Modal
        document.getElementById('publish-modal').addEventListener('click', e => {
            if (e.target.id === 'publish-modal') document.getElementById('publish-modal').style.display = 'none';
        });

        // Debounce
        function debounce(func, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => func(...args), delay);
            };
        }

        // Init
        function loadApp() {
            loadStories();
            loadFeed();
        }
    </script>
</body>
</html>
