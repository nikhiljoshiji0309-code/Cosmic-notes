<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nexus Gram | Cosmic Social Network</title>

    <!-- Firebase Scripts (v10 modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, query, where, orderBy, limit, runTransaction, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        window.firebaseModules = { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, query, where, orderBy, limit, runTransaction, serverTimestamp, getDocs, getStorage, ref, uploadBytes, getDownloadURL };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* (styles unchanged for brevity) */
        :root { --theme-bg:#03030b; --theme-panel:rgba(10,10,18,0.98); --theme-text:#f0f0f0; --theme-text-dim:#a0a0a0; --theme-border:rgba(0,210,255,0.15); --theme-accent:#00d2ff; --theme-accent-dark:#00b2df; --theme-accent-glow:rgba(0,210,255,0.4); --theme-shadow:0 4px 12px rgba(0,0,0,0.1); --theme-font-size-base:16px; --theme-spacing-medium:16px; --theme-spacing-large:24px; }
        /* rest of CSS kept same as original (omitted here to focus on JS fixes) */
        /* ... */
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <canvas id="star-canvas" aria-hidden="true"></canvas>

    <!-- Auth Gate -->
    <div id="auth-gate">
        <div class="gate-logo">NEXUS GRAM</div>
        <p style="color:var(--theme-text-dim); margin-bottom:30px; letter-spacing:2px;">COSMIC SOCIAL PROTOCOL</p>
        <button class="btn-primary" onclick="handleLogin()">INITIALIZE SYNC</button>
    </div>

    <!-- Identity Lock -->
    <div id="identity-lock">
        <div class="lock-box">
            <h2 style="color:var(--theme-accent); margin:0 0 10px 0;">PILOT CREDENTIALS</h2>
            <p style="color:var(--theme-text-dim); font-size:0.85rem; margin-bottom:20px;">Set up your cosmic identity.</p>

            <label style="font-size:0.75rem; color:var(--theme-accent);">CALLSIGN</label>
            <input type="text" id="pilot-name" placeholder="e.g. CosmicExplorer">

            <label style="font-size:0.75rem; color:var(--theme-accent); margin-top:12px; display:block;">STATUS</label>
            <select id="pilot-status">
                <option value="online">🟢 Online</option>
                <option value="away">🟡 Away</option>
                <option value="offline">⚪ Offline</option>
            </select>

            <label style="font-size:0.75rem; color:var(--theme-accent); margin-top:12px; display:block;">BIO</label>
            <textarea id="pilot-bio" maxlength="160" placeholder="Your cosmic journey..."></textarea>

            <button class="btn-primary" onclick="submitIdentity()">LAUNCH PROFILE</button>
        </div>
    </div>

    <!-- App -->
    <div class="nexus-wrapper" id="app">
        <header class="app-header">
            <div class="header-logo">Nexus Gram</div>
            <div class="header-icons">
                <i class="fas fa-home header-icon" onclick="navigate('home')" data-view="home"></i>
                <i class="fas fa-search header-icon" onclick="navigate('search')" data-view="search"></i>
                <i class="fas fa-plus-square header-icon" onclick="openPublishModal()"></i>
                <i class="fas fa-comment-dots header-icon" onclick="navigate('messages')" data-view="messages"></i>
                <i class="fas fa-user header-icon" onclick="navigate('profile')" data-view="profile"></i>
            </div>
        </header>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-icon" onclick="navigate('home')" data-view="home"><i class="fas fa-home"></i> <span class="sidebar-label">Home</span></div>
            <div class="sidebar-icon" onclick="navigate('search')" data-view="search"><i class="fas fa-search"></i> <span class="sidebar-label">Search</span></div>
            <div class="sidebar-icon" onclick="openPublishModal()"><i class="fas fa-plus-square"></i> <span class="sidebar-label">Post</span></div>
            <div class="sidebar-icon" onclick="navigate('messages')" data-view="messages"><i class="fas fa-comment-dots"></i> <span class="sidebar-label">Messages</span></div>
            <div class="sidebar-icon" onclick="navigate('profile')" data-view="profile"><i class="fas fa-user"></i> <span class="sidebar-label">Profile</span></div>
            <div style="margin-top:auto;">
                <div class="sidebar-icon" onclick="toggleTheme()"><i class="fas fa-moon"></i> <span class="sidebar-label">Theme</span></div>
                <div class="sidebar-icon" onclick="handleLogout()" style="color:var(--theme-danger);"><i class="fas fa-sign-out-alt"></i> <span class="sidebar-label">Logout</span></div>
            </div>
        </aside>

        <main class="main-content">
            <div id="home-view" class="content-view active">
                <div class="stories-bar" id="stories-bar"></div>
                <div id="feed" class="feed"></div>
            </div>

            <div id="search-view" class="content-view">
                <input type="text" class="search-input" id="search-input" placeholder="Search users...">
                <div id="search-results" class="search-results"></div>
            </div>

            <div id="messages-view" class="content-view">
                <div id="messages-list" class="messages-list"></div>
                <div id="message-view" class="message-view hidden">
                    <div class="message-header">
                        <i class="fas fa-arrow-left message-back" onclick="backToMessagesList()"></i>
                        <div class="message-title" id="message-title"></div>
                    </div>
                    <div class="message-viewport" id="message-viewport"></div>
                    <div class="message-input">
                        <input type="text" id="message-input-text" placeholder="Type a message...">
                        <i class="fas fa-paper-plane message-send" onclick="sendMessage()"></i>
                    </div>
                </div>
            </div>

            <div id="profile-view" class="content-view">
                <div class="profile-header" id="profile-header"></div>
                <div class="profile-posts" id="profile-posts"></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <i class="fas fa-home nav-icon" onclick="navigate('home')" data-view="home"></i>
            <i class="fas fa-search nav-icon" onclick="navigate('search')" data-view="search"></i>
            <i class="fas fa-plus-square nav-icon" onclick="openPublishModal()"></i>
            <i class="fas fa-comment-dots nav-icon" onclick="navigate('messages')" data-view="messages"></i>
            <i class="fas fa-user nav-icon" onclick="navigate('profile')" data-view="profile"></i>
        </nav>
    </div>

    <!-- Publish Modal -->
    <div id="publish-modal">
        <div class="publish-box">
            <div class="publish-header">Create Post</div>
            <textarea class="publish-textarea" id="post-caption" placeholder="What's on your mind?"></textarea>
            <img id="post-image-preview" class="publish-image-preview" alt="Post preview">
            <div class="publish-actions">
                <label for="post-image-upload" class="action-icon"><i class="fas fa-image"></i></label>
                <input type="file" id="post-image-upload" accept="image/*" style="display:none" onchange="previewPostImage(this)">
                <button class="publish-btn" onclick="publishPost()">Post</button>
            </div>
        </div>
    </div>

    <script type="module">
        const { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } = window.firebaseModules;
        const { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, query, where, orderBy, limit, runTransaction, serverTimestamp, getDocs } = window.firebaseModules;
        const { getStorage, ref: storageRef, uploadBytes, getDownloadURL } = window.firebaseModules;

        const firebaseConfig = {
            apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
            authDomain: "cosmic-notes-f7648.firebaseapp.com",
            projectId: "cosmic-notes-f7648",
            storageBucket: "cosmic-notes-f7648.appspot.com",
            messagingSenderId: "70656136344",
            appId: "1:70656136344:web:640193b83f63cac569aced"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        let currentUser = null;
        let activeView = 'home';
        let activeMessageThread = null;
        let unsubscribers = {};
        let userCache = new Map();
        let posts = [];

        // Theme
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');

        // Auth
        async function handleLogin() {
            const btn = document.querySelector('#auth-gate .btn-primary');
            if (btn) { btn.innerHTML = 'CONNECTING...'; btn.disabled = true; }
            try {
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await signInWithPopup(auth, provider);
                console.log("Login success:", result.user.email);
            } catch (err) {
                let msg = "Login failed";
                if (err.code === 'auth/popup-blocked') msg = "Popup blocked - allow popups!";
                else if (err.code === 'auth/unauthorized-domain') msg = "Domain not authorized - add your domain in Firebase Console!";
                else if (err.code) msg += `: ${err.code} - ${err.message}`;
                else msg += `: ${err.message}`;
                alert(msg);
                console.error(err);
            } finally {
                if (btn) { btn.innerHTML = 'INITIALIZE SYNC'; btn.disabled = false; }
            }
        }

        onAuthStateChanged(auth, async user => {
            if (user) {
                currentUser = user;
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (!userDoc.exists() || !userDoc.data().name) {
                        document.getElementById('auth-gate').style.display = 'none';
                        document.getElementById('identity-lock').style.display = 'flex';
                        document.getElementById('app').style.display = 'none';
                    } else {
                        document.getElementById('auth-gate').style.display = 'none';
                        document.getElementById('identity-lock').style.display = 'none';
                        document.getElementById('app').style.display = 'flex';
                        loadApp();
                    }
                } catch (err) {
                    console.error("Failed fetching user doc:", err);
                }
            } else {
                currentUser = null;
                document.getElementById('auth-gate').style.display = 'flex';
                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').style.display = 'none';
            }
        });

        async function submitIdentity() {
            if (!currentUser) return alert("Not signed in");
            const name = document.getElementById('pilot-name').value.trim();
            const status = document.getElementById('pilot-status').value;
            const bio = document.getElementById('pilot-bio').value.trim() || 'No bio yet';
            if (name.length < 3) return alert("Callsign too short.");
            try {
                await setDoc(doc(db, 'users', currentUser.uid), {
                    uid: currentUser.uid,
                    name,
                    status,
                    bio,
                    avatarUrl: currentUser.photoURL || null,
                    followers: [],
                    following: [],
                    lastSeen: serverTimestamp()
                }, { merge: true });
                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                loadApp();
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        function handleLogout() {
            signOut(auth).catch(err => console.error("Sign out error:", err));
        }

        // Load app
        function loadApp() {
            loadStories();
            loadFeed();
            loadMessagesList();
            loadProfile();
            navigate('home');
        }

        // Navigation using data-view attributes
        function navigate(view) {
            activeView = view;
            document.querySelectorAll('.content-view').forEach(el => el.classList.remove('active'));
            const viewEl = document.getElementById(`${view}-view`);
            if (viewEl) viewEl.classList.add('active');

            // clear active icons then set by data-view
            document.querySelectorAll('.nav-icon, .sidebar-icon, .header-icon').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`[data-view="${view}"]`).forEach(el => el.classList.add('active'));

            if (view === 'search') loadSearchResults();
            if (view === 'messages') backToMessagesList();
            if (view === 'profile') loadProfile();
        }

        // debounce utility
        function debounce(func, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => func(...args), delay);
            };
        }

        // user cache with uid property
        async function getUserData(uid) {
            if (!uid) return null;
            if (userCache.has(uid)) return userCache.get(uid);
            try {
                const userDoc = await getDoc(doc(db, 'users', uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    data.uid = uid;
                    userCache.set(uid, data);
                    return data;
                }
            } catch (err) {
                console.error("getUserData error:", err);
            }
            return null;
        }

        // Stories
        async function loadStories() {
            if (!currentUser) return;
            try {
                const bar = document.getElementById('stories-bar');
                if (!bar) return;
                bar.innerHTML = '';
                const myStory = document.createElement('div');
                myStory.className = 'story-circle';
                myStory.innerHTML = `<div class="story-avatar"><i class="fas fa-plus"></i></div>`;
                myStory.onclick = () => alert('Add story coming soon');
                bar.appendChild(myStory);
                const user = await getUserData(currentUser.uid);
                const following = user?.following || [];
                for (let uid of following) {
                    const f = await getUserData(uid);
                    if (!f) continue;
                    const story = document.createElement('div');
                    story.className = 'story-circle';
                    story.innerHTML = `<div class="story-avatar"><img src="${f.avatarUrl || 'https://via.placeholder.com/54'}" alt="${f.name || 'avatar'}"></div>`;
                    story.onclick = () => alert('View story coming soon');
                    bar.appendChild(story);
                }
            } catch (err) {
                console.error("loadStories error:", err);
            }
        }

        // Feed
        function loadFeed() {
            if (!currentUser) return;
            const feed = document.getElementById('feed');
            if (!feed) return;
            feed.innerHTML = '<div class="loading-spinner"></div>';
            if (unsubscribers['feed']) unsubscribers['feed']();
            const q = query(collection(db, 'posts'), orderBy('timestamp', 'desc'), limit(20));
            unsubscribers['feed'] = onSnapshot(q, snapshot => {
                // rebuild ordered posts array to avoid duplicates / ordering issues
                posts = snapshot.docs.map(d => ({ ...(d.data()), id: d.id }));
                renderAllPosts();
            }, err => {
                console.error("Feed snapshot error:", err);
            });
        }

        async function renderAllPosts() {
            const feed = document.getElementById('feed');
            if (!feed) return;
            feed.innerHTML = '';
            // render sequentially to preserve order
            for (const p of posts) {
                await renderPost(p);
            }
        }

        async function renderPost(post) {
            try {
                const user = await getUserData(post.userId);
                if (!user) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                const timeStr = post.timestamp && post.timestamp.toDate ? new Date(post.timestamp.toDate()).toLocaleString() : 'Just now';
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-avatar"><img src="${user.avatarUrl || 'https://via.placeholder.com/40'}" alt="${user.name || 'avatar'}"></div>
                        <span class="post-username">${user.name}</span>
                        <span class="post-time">${timeStr}</span>
                    </div>
                    ${post.imageUrl ? `<img class="post-image" src="${post.imageUrl}" alt="post image">` : ''}
                    <div class="post-actions">
                        <i class="fas fa-heart action-btn ${post.likes?.includes(currentUser?.uid) ? 'liked' : ''}" onclick="toggleLike('${post.id}')"></i>
                        <i class="fas fa-comment action-btn" onclick="focusComment('${post.id}')"></i>
                        <i class="fas fa-share action-btn" onclick="sharePost('${post.id}')"></i>
                    </div>
                    <div class="post-caption">${(post.caption || '')}</div>
                    <div class="post-comments" id="comments-${post.id}"></div>
                    <div class="comment-input">
                        <input type="text" placeholder="Add a comment..." id="comment-input-${post.id}">
                        <i class="fas fa-paper-plane comment-send" onclick="addComment('${post.id}')"></i>
                    </div>
                `;
                const feed = document.getElementById('feed');
                if (feed) feed.appendChild(card);

                // comments
                const commentsContainer = document.getElementById(`comments-${post.id}`);
                if (!commentsContainer) return;
                commentsContainer.innerHTML = '';
                for (const c of post.comments || []) {
                    const commentUser = await getUserData(c.userId);
                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'comment';
                    commentDiv.innerHTML = `
                        <div class="comment-avatar"><img src="${commentUser?.avatarUrl || 'https://via.placeholder.com/30'}" alt="${commentUser?.name || 'avatar'}"></div>
                        <div class="comment-content">
                            <span class="comment-username">${commentUser?.name || 'Anonymous'}</span>
                            <span class="comment-text">${c.text}</span>
                        </div>
                    `;
                    commentsContainer.appendChild(commentDiv);
                }
            } catch (err) {
                console.error("renderPost error:", err);
            }
        }

        async function toggleLike(postId) {
            if (!currentUser) return alert("Not signed in");
            const postRef = doc(db, 'posts', postId);
            try {
                await runTransaction(db, async (transaction) => {
                    const postDoc = await transaction.get(postRef);
                    if (!postDoc.exists()) throw new Error("Post does not exist");
                    let likes = postDoc.data().likes || [];
                    if (likes.includes(currentUser.uid)) likes = likes.filter(id => id !== currentUser.uid);
                    else likes.push(currentUser.uid);
                    transaction.update(postRef, { likes });
                });
            } catch (err) {
                console.error("toggleLike error:", err);
            }
        }

        async function addComment(postId) {
            if (!currentUser) return alert("Not signed in");
            const input = document.getElementById(`comment-input-${postId}`);
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            try {
                await updateDoc(doc(db, 'posts', postId), {
                    comments: arrayUnion({
                        userId: currentUser.uid,
                        text,
                        timestamp: serverTimestamp()
                    })
                });
            } catch (err) {
                console.error("addComment error:", err);
            }
        }

        function focusComment(postId) {
            const el = document.getElementById(`comment-input-${postId}`);
            if (el) el.focus();
        }

        function sharePost(postId) { alert('Share coming soon'); }

        // Publish
        function openPublishModal() {
            const caption = document.getElementById('post-caption');
            const preview = document.getElementById('post-image-preview');
            if (caption) caption.value = '';
            if (preview) { preview.style.display = 'none'; preview.src = ''; }
            const modal = document.getElementById('publish-modal');
            if (modal) modal.style.display = 'flex';
        }

        function previewPostImage(input) {
            if (input?.files?.[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('post-image-preview');
                    if (img) { img.src = e.target.result; img.style.display = 'block'; }
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function publishPost() {
            if (!currentUser) return alert('Not signed in');
            const caption = document.getElementById('post-caption')?.value.trim() || '';
            const fileInput = document.getElementById('post-image-upload');
            const file = fileInput?.files?.[0];
            if (!caption && !file) return alert('Add caption or image');
            const modal = document.getElementById('publish-modal');
            if (modal) modal.style.display = 'none';
            let imageUrl = null;
            try {
                if (file) {
                    const storageReference = storageRef(storage, `posts/${currentUser.uid}/${Date.now()}`);
                    await uploadBytes(storageReference, file);
                    imageUrl = await getDownloadURL(storageReference);
                    if (fileInput) fileInput.value = '';
                }
                await addDoc(collection(db, 'posts'), {
                    userId: currentUser.uid,
                    caption,
                    imageUrl,
                    timestamp: serverTimestamp(),
                    likes: [],
                    comments: []
                });
            } catch (err) {
                console.error("publishPost error:", err);
                alert("Failed to publish post: " + err.message);
            }
        }

        // Messages
        function loadMessagesList() {
            if (!currentUser) return;
            const list = document.getElementById('messages-list');
            if (!list) return;
            list.innerHTML = '<div class="loading-spinner"></div>';
            if (unsubscribers['messages']) unsubscribers['messages']();
            const q = query(collection(db, 'conversations'), where('participants', 'array-contains', currentUser.uid), orderBy('timestamp', 'desc'));
            unsubscribers['messages'] = onSnapshot(q, snapshot => {
                list.innerHTML = '';
                snapshot.forEach(convDoc => {
                    const conv = convDoc.data();
                    conv.id = convDoc.id;
                    const otherUid = (conv.participants || []).find(u => u !== currentUser.uid);
                    if (!otherUid) return;
                    getUserData(otherUid).then(user => {
                        if (!user) return;
                        const thread = document.createElement('div');
                        thread.className = 'message-thread';
                        thread.innerHTML = `
                            <div class="message-avatar"><img src="${user.avatarUrl || 'https://via.placeholder.com/50'}" alt="${user.name || 'avatar'}"></div>
                            <div class="message-info">
                                <span class="message-username">${user.name}</span>
                                <span class="message-preview">${conv.lastMessage || 'No messages yet'}</span>
                            </div>
                        `;
                        thread.onclick = () => openMessageThread(conv.id, user);
                        list.appendChild(thread);
                    }).catch(err => console.error("getUserData in messages list:", err));
                });
            }, err => console.error("Messages snapshot error:", err));
        }

        function openMessageThread(convId, user) {
            activeMessageThread = convId;
            const title = document.getElementById('message-title');
            if (title) title.innerText = user.name || 'Conversation';
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('message-view').classList.remove('hidden');
            loadMessages(convId);
        }

        function backToMessagesList() {
            document.getElementById('messages-list').classList.remove('hidden');
            document.getElementById('message-view').classList.add('hidden');
            if (unsubscribers['thread']) unsubscribers['thread']();
            const input = document.getElementById('message-input-text');
            if (input) input.value = '';
            activeMessageThread = null;
        }

        function loadMessages(convId) {
            const viewport = document.getElementById('message-viewport');
            if (!viewport) return;
            viewport.innerHTML = '';
            const q = query(collection(db, 'conversations', convId, 'messages'), orderBy('timestamp'));
            if (unsubscribers['thread']) unsubscribers['thread']();
            unsubscribers['thread'] = onSnapshot(q, snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const msg = change.doc.data();
                        renderMessage(msg, viewport);
                        viewport.scrollTop = viewport.scrollHeight;
                    }
                });
            }, err => console.error("Thread snapshot error:", err));
        }

        async function renderMessage(msg, viewport) {
            try {
                const user = await getUserData(msg.userId);
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${msg.userId === currentUser?.uid ? 'msg-sent' : 'msg-received'}`;
                bubble.innerHTML = `
                    <div>${msg.text}</div>
                    <div class="msg-time">${msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString() : 'Just now'}</div>
                `;
                viewport.appendChild(bubble);
            } catch (err) {
                console.error("renderMessage error:", err);
            }
        }

        async function sendMessage() {
            if (!currentUser || !activeMessageThread) return;
            const input = document.getElementById('message-input-text');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const convRef = doc(db, 'conversations', activeMessageThread);
            try {
                await runTransaction(db, async (transaction) => {
                    const messagesCol = collection(convRef, 'messages');
                    const newMsgRef = doc(messagesCol); // auto-id
                    transaction.set(newMsgRef, {
                        userId: currentUser.uid,
                        text,
                        timestamp: serverTimestamp()
                    });
                    transaction.update(convRef, {
                        lastMessage: text,
                        timestamp: serverTimestamp()
                    });
                });
            } catch (err) {
                console.error("sendMessage error:", err);
            }
        }

        async function startMessage(uid) {
            if (!currentUser || uid === currentUser.uid) return;
            const participants = [currentUser.uid, uid].sort();
            const convId = participants.join('-');
            const convRef = doc(db, 'conversations', convId);
            try {
                const convDoc = await getDoc(convRef);
                if (!convDoc.exists()) {
                    await setDoc(convRef, {
                        participants,
                        lastMessage: '',
                        timestamp: serverTimestamp()
                    });
                }
                const user = await getUserData(uid);
                openMessageThread(convId, user || { name: 'User' });
            } catch (err) {
                console.error("startMessage error:", err);
            }
        }

        // Search
        function loadSearchResults() {
            if (!currentUser) return;
            const input = document.getElementById('search-input');
            if (!input) return;
            input.oninput = debounce(async () => {
                const queryStr = input.value.trim().toLowerCase();
                if (!queryStr) return;
                const results = document.getElementById('search-results');
                if (!results) return;
                results.innerHTML = '';
                try {
                    const q = query(collection(db, 'users'), where('name', '>=', queryStr), where('name', '<=', queryStr + '\uf8ff'), limit(10));
                    const snapshot = await getDocs(q);
                    const myData = await getUserData(currentUser.uid);
                    const following = myData?.following || [];
                    snapshot.forEach(userDoc => {
                        if (userDoc.id === currentUser.uid) return;
                        const user = userDoc.data();
                        user.uid = userDoc.id;
                        const div = document.createElement('div');
                        div.className = 'search-user';
                        div.onclick = () => viewUserProfile(user.uid);
                        div.innerHTML = `
                            <div class="search-avatar"><img src="${user.avatarUrl || 'https://via.placeholder.com/50'}" alt="${user.name || 'avatar'}"></div>
                            <span class="search-name">${user.name}</span>
                            <span class="search-bio">${user.bio || ''}</span>
                            <button class="follow-btn" onclick="toggleFollow('${user.uid}'); event.stopPropagation();">${following.includes(user.uid) ? 'Unfollow' : 'Follow'}</button>
                            <i class="fas fa-message" style="margin-left:10px; color:var(--theme-comment); cursor:pointer;" onclick="startMessage('${user.uid}'); event.stopPropagation();"></i>
                        `;
                        results.appendChild(div);
                    });
                } catch (err) {
                    console.error("search error:", err);
                }
            }, 300);
        }

        async function toggleFollow(uid) {
            if (!currentUser || uid === currentUser.uid) return;
            const myRef = doc(db, 'users', currentUser.uid);
            const otherRef = doc(db, 'users', uid);
            try {
                await runTransaction(db, async (transaction) => {
                    const myDoc = await transaction.get(myRef);
                    const otherDoc = await transaction.get(otherRef);
                    let myFollowing = myDoc.data()?.following || [];
                    let otherFollowers = otherDoc.data()?.followers || [];
                    if (myFollowing.includes(uid)) {
                        myFollowing = myFollowing.filter(u => u !== uid);
                        otherFollowers = otherFollowers.filter(u => u !== currentUser.uid);
                    } else {
                        myFollowing.push(uid);
                        otherFollowers.push(currentUser.uid);
                    }
                    transaction.update(myRef, { following: myFollowing });
                    transaction.update(otherRef, { followers: otherFollowers });
                });
                userCache.delete(currentUser.uid);
                userCache.delete(uid);
                if (activeView === 'search') loadSearchResults();
                if (activeView === 'profile') loadProfile();
            } catch (err) {
                console.error("toggleFollow error:", err);
            }
        }

        function viewUserProfile(uid) { alert(`Viewing profile of ${uid} coming soon`); }

        // Profile
        async function loadProfile() {
            if (!currentUser) return;
            try {
                const user = await getUserData(currentUser.uid);
                const postCountQuery = query(collection(db, 'posts'), where('userId', '==', currentUser.uid));
                const postCount = (await getDocs(postCountQuery)).size;
                const header = document.getElementById('profile-header');
                if (!header) return;
                header.innerHTML = `
                    <div class="profile-avatar"><img src="${user?.avatarUrl || 'https://via.placeholder.com/120'}" alt="${user?.name || 'avatar'}"></div>
                    <span class="profile-name">${user?.name || ''}</span>
                    <span class="profile-bio">${user?.bio || ''}</span>
                    <div class="profile-stats">
                        <div class="stat">
                            <span class="stat-number">${(user?.followers || []).length}</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number">${(user?.following || []).length}</span>
                            <span class="stat-label">Following</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number">${postCount}</span>
                            <span class="stat-label">Posts</span>
                        </div>
                    </div>
                `;
                loadProfilePosts(currentUser.uid);
            } catch (err) {
                console.error("loadProfile error:", err);
            }
        }

        async function loadProfilePosts(uid) {
            const postsDiv = document.getElementById('profile-posts');
            if (!postsDiv) return;
            postsDiv.innerHTML = '';
            try {
                const q = query(collection(db, 'posts'), where('userId', '==', uid), orderBy('timestamp', 'desc'));
                const snapshot = await getDocs(q);
                snapshot.forEach(postDoc => {
                    const post = postDoc.data();
                    if (post.imageUrl) {
                        const img = document.createElement('img');
                        img.className = 'profile-post-img';
                        img.src = post.imageUrl;
                        img.alt = post.caption || 'post';
                        postsDiv.appendChild(img);
                    }
                });
            } catch (err) {
                console.error("loadProfilePosts error:", err);
            }
        }

        // Star canvas
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
        let stars = [];
        function initStars() {
            if (!canvas || !ctx) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = Array.from({ length: 500 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.5,
                opacity: Math.random() * 0.5 + 0.5,
                speed: Math.random() * 0.1 + 0.05
            }));
        }
        function renderStars() {
            if (!ctx) return;
            if (document.hidden) return requestAnimationFrame(renderStars);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.x -= s.speed;
                if (s.x < 0) s.x = canvas.width;
                ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(renderStars);
        }
        window.addEventListener('resize', initStars);
        initStars();
        renderStars();

        // Close modal outside click
        const publishModal = document.getElementById('publish-modal');
        if (publishModal) {
            publishModal.addEventListener('click', e => {
                if (e.target === publishModal) publishModal.style.display = 'none';
            });
        }
    </script>
</body>
</html>
