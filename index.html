<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Notes</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #000;
  color: #fff;
}
.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}
h1 { text-align: center; }
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}
input { background: #fff; }
button {
  background: #7b5cff;
  color: white;
  cursor: pointer;
}
.google {
  background: #db4437;
}
.note {
  background: #111;
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.hidden { display: none; }
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="login" class="container">
  <h1>🌌 Cosmic Notes</h1>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="emailLogin()">Login / Signup</button>
  <button class="google" onclick="googleLogin()">Google Login</button>
</div>

<!-- APP SCREEN -->
<div id="app" class="container hidden">

  <div class="top">
    <h3>Feed</h3>
    <button onclick="logout()" style="width:auto;">Logout</button>
  </div>

  <input id="noteText" placeholder="Write a cosmic note...">
  <button onclick="postNote()">Post</button>

  <div id="feed"></div>

</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
/* 🔥 YOUR FIREBASE CONFIG */
var firebaseConfig = {
  apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
  authDomain: "cosmic-notes-f7648.firebaseapp.com",
  projectId: "cosmic-notes-f7648",
  storageBucket: "cosmic-notes-f7648.appspot.com",
  messagingSenderId: "70656136344",
  appId: "1:70656136344:web:640193b83f63cac569aced"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* AUTH STATE */
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    loadNotes();
  } else {
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
});

/* EMAIL LOGIN / SIGNUP */
function emailLogin() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .catch(() => {
      auth.createUserWithEmailAndPassword(email, password)
        .catch(err => alert(err.message));
    });
}

/* GOOGLE LOGIN */
function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
    .then(result => {
      console.log("Logged in:", result.user.email);
    })
    .catch(error => {
      alert(error.code + "\n" + error.message);
      console.error(error);
    });
}

/* LOGOUT */
function logout() {
  auth.signOut();
}

/* POST NOTE */
function postNote() {
  const text = document.getElementById("noteText").value;
  if (!text) return;

  db.collection("notes").add({
    text: text,
    uid: auth.currentUser.uid,
    time: Date.now()
  });

  document.getElementById("noteText").value = "";
}

/* LOAD FEED */
function loadNotes() {
  db.collection("notes")
    .orderBy("time", "desc")
    .onSnapshot(snapshot => {
      const feed = document.getElementById("feed");
      feed.innerHTML = "";
      snapshot.forEach(doc => {
        const d = document.createElement("div");
        d.className = "note";
        d.innerText = doc.data().text;
        feed.appendChild(d);
      });
    });
}
</script>

</body>
</html>
