<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Gram | Cosmic Social Network</title>
  
    <!-- Firebase Scripts (Updated to v9 modular for better performance and tree-shaking) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, query, where, orderBy, limit, runTransaction, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        window.firebaseModules = { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, query, where, orderBy, limit, runTransaction, serverTimestamp, getDocs, getStorage, ref, uploadBytes, getDownloadURL };
    </script>
   
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <style>
        /* Root Variables - Enhanced with more colors and sizes */
        :root {
            --theme-bg: #03030b;
            --theme-panel: rgba(10, 10, 18, 0.98);
            --theme-text: #f0f0f0;
            --theme-text-dim: #a0a0a0;
            --theme-border: rgba(0, 210, 255, 0.15);
            --theme-accent: #00d2ff;
            --theme-accent-dark: #00b2df;
            --theme-accent-glow: rgba(0, 210, 255, 0.4);
            --theme-wa-sent: #005c4b;
            --theme-wa-received: #202c33;
            --theme-danger: #ff3b3b;
            --theme-online: #00ff88;
            --theme-away: #ffbb00;
            --theme-offline: #555;
            --theme-like: #ff4081;
            --theme-comment: #2196f3;
            --theme-share: #4caf50;
            --theme-story-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --theme-shadow: 0 4px 12px rgba(0,0,0,0.1);
            --theme-font-size-base: 16px;
            --theme-font-size-small: 0.875rem;
            --theme-font-size-large: 1.25rem;
            --theme-spacing-small: 8px;
            --theme-spacing-medium: 16px;
            --theme-spacing-large: 24px;
        }
       
        /* Light Theme - Improved contrast */
        .light-theme {
            --theme-bg: #f8f9fa;
            --theme-panel: #ffffff;
            --theme-text: #111111;
            --theme-text-dim: #666666;
            --theme-border: rgba(0, 150, 255, 0.2);
            --theme-accent: #0077cc;
            --theme-accent-dark: #005fa3;
            --theme-accent-glow: rgba(0, 119, 204, 0.3);
            --theme-wa-sent: #dcf8c6;
            --theme-wa-received: #ffffff;
            --theme-danger: #e53935;
            --theme-online: #4caf50;
            --theme-away: #ff9800;
            --theme-offline: #999999;
            --theme-like: #e91e63;
            --theme-comment: #1976d2;
            --theme-share: #388e3c;
            --theme-story-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --theme-shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
       
        /* Global Styles - Enhanced reset and typography */
        * {
            box-sizing: border-box;
            outline: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: var(--theme-font-size-base);
            line-height: 1.5;
        }
       
        body, html {
            background: var(--theme-bg);
            color: var(--theme-text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: background 0.3s ease;
            position: relative;
        }
       
        /* Star Canvas - Improved with more stars and animation */
        #star-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            display: block;
        }
        .light-theme #star-canvas { display: none; }
       
        /* Progress Bar - Animated */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--theme-accent), transparent);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1);
            z-index: 5000;
            box-shadow: 0 0 10px var(--theme-accent);
        }
       
        /* Animations - Added more for smoothness */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
       
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
       
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
       
        @keyframes likeAnimation {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
       
        @keyframes storyRing {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
       
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
       
        /* Auth Gate - Improved centering and animation */
        #auth-gate {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: var(--theme-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
       
        .gate-logo {
            font-size: 3rem;
            font-weight: 900;
            color: var(--theme-accent);
            letter-spacing: 20px;
            text-shadow: 0 0 30px var(--theme-accent);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
       
        /* Identity Lock - Enhanced form fields */
        #identity-lock {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
       
        .lock-box {
            background: var(--theme-panel);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--theme-border);
            max-width: 500px;
            width: 100%;
            box-shadow: var(--theme-shadow);
            animation: slideUp 0.5s ease;
            color: var(--theme-text);
        }
       
        /* App Wrapper - Flex for better layout */
        .nexus-wrapper {
            display: none;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
            flex-direction: column;
            animation: fadeIn 1s ease;
        }
       
        /* Header for PC - Sticky with shadow */
        .app-header {
            height: 60px;
            background: var(--theme-panel);
            border-bottom: 1px solid var(--theme-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--theme-spacing-medium);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: var(--theme-shadow);
        }
       
        .header-logo {
            font-size: var(--theme-font-size-large);
            font-weight: bold;
            color: var(--theme-accent);
        }
       
        .header-icons {
            display: flex;
            gap: var(--theme-spacing-medium);
        }
       
        .header-icon {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }
       
        .header-icon:hover {
            color: var(--theme-accent);
            transform: scale(1.1);
        }
       
        /* Bottom Nav for Mobile - Improved icons */
        .bottom-nav {
            height: 60px;
            background: var(--theme-panel);
            border-top: 1px solid var(--theme-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: var(--theme-shadow);
        }
       
        .nav-icon {
            font-size: 1.4rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            position: relative;
        }
       
        .nav-icon.active {
            color: var(--theme-accent);
            transform: scale(1.1);
        }
       
        /* Main Content - Centered with max-width */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-top: 60px;
            padding-bottom: 60px;
            max-width: 935px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }
       
        /* Stories Bar - Scrollable with gradients */
        .stories-bar {
            display: flex;
            overflow-x: auto;
            padding: var(--theme-spacing-medium) 0;
            gap: var(--theme-spacing-small);
            border-bottom: 1px solid var(--theme-border);
            animation: fadeIn 0.5s ease;
            scrollbar-width: none;
        }
       
        .stories-bar::-webkit-scrollbar {
            display: none;
        }
       
        .story-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--theme-story-gradient);
            background-size: 400% 400%;
            animation: storyRing 3s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
       
        .story-circle:hover {
            transform: scale(1.05);
            box-shadow: var(--theme-shadow);
        }
       
        .story-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--theme-panel);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
       
        .story-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
       
        /* Post Card - Enhanced with shadows and transitions */
        .post-card {
            background: var(--theme-panel);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            margin-bottom: var(--theme-spacing-large);
            overflow: hidden;
            animation: scaleIn 0.3s ease;
            box-shadow: var(--theme-shadow);
            transition: box-shadow 0.2s;
        }
       
        .post-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
       
        .post-header {
            display: flex;
            align-items: center;
            padding: var(--theme-spacing-medium);
            gap: var(--theme-spacing-small);
        }
       
        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--theme-accent-glow);
            overflow: hidden;
        }
       
        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
       
        .post-username {
            font-weight: bold;
            color: var(--theme-accent);
        }
       
        .post-time {
            font-size: var(--theme-font-size-small);
            color: var(--theme-text-dim);
            margin-left: auto;
        }
       
        .post-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            transition: transform 0.3s;
        }
       
        .post-image:hover {
            transform: scale(1.05);
        }
       
        .post-actions {
            display: flex;
            gap: var(--theme-spacing-medium);
            padding: var(--theme-spacing-small) var(--theme-spacing-medium);
        }
       
        .action-btn {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }
       
        .action-btn:hover {
            color: var(--theme-accent);
            transform: scale(1.1);
        }
       
        .action-btn.liked {
            color: var(--theme-like);
            animation: likeAnimation 0.3s ease;
        }
       
        .post-caption {
            padding: 0 var(--theme-spacing-medium) var(--theme-spacing-medium);
            font-size: var(--theme-font-size-small);
            line-height: 1.4;
        }
       
        .post-comments {
            padding: 0 var(--theme-spacing-medium) var(--theme-spacing-medium);
            border-top: 1px solid var(--theme-border);
            margin-top: var(--theme-spacing-small);
        }
       
        .comment {
            display: flex;
            gap: var(--theme-spacing-small);
            margin-bottom: var(--theme-spacing-small);
        }
       
        .comment-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            overflow: hidden;
        }
       
        .comment-content {
            flex: 1;
        }
       
        .comment-username {
            font-weight: bold;
            color: var(--theme-comment);
        }
       
        .comment-text {
            font-size: var(--theme-font-size-small);
        }
       
        .comment-input {
            display: flex;
            gap: var(--theme-spacing-small);
            margin-top: var(--theme-spacing-small);
        }
       
        .comment-input input {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 20px;
            padding: var(--theme-spacing-small) var(--theme-spacing-medium);
            color: var(--theme-text);
            font-size: var(--theme-font-size-small);
        }
       
        .comment-send {
            color: var(--theme-accent);
            cursor: pointer;
            font-size: 1.2rem;
        }
       
        /* Publish Modal - Improved with preview and drag-drop */
        #publish-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            animation: fadeIn 0.3s ease;
        }
       
        .publish-box {
            background: var(--theme-panel);
            padding: var(--theme-spacing-large);
            border-radius: 20px;
            border: 1px solid var(--theme-border);
            max-width: 600px;
            width: 90%;
            box-shadow: var(--theme-shadow);
            animation: slideUp 0.3s ease;
        }
       
        .publish-header {
            font-size: var(--theme-font-size-large);
            font-weight: bold;
            margin-bottom: var(--theme-spacing-medium);
            color: var(--theme-accent);
        }
       
        .publish-textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            padding: var(--theme-spacing-medium);
            color: var(--theme-text);
            resize: vertical;
            margin-bottom: var(--theme-spacing-medium);
            font-size: var(--theme-font-size-small);
        }
       
        .publish-image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: var(--theme-spacing-medium);
            display: none;
            box-shadow: var(--theme-shadow);
        }
       
        .publish-actions {
            display: flex;
            gap: var(--theme-spacing-medium);
            justify-content: flex-end;
        }
       
        .publish-btn {
            background: var(--theme-accent);
            color: #fff;
            padding: var(--theme-spacing-small) var(--theme-spacing-medium);
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }
       
        .publish-btn:hover {
            background: var(--theme-accent-dark);
            transform: translateY(-2px);
        }
       
        /* Profile Page - Improved layout with editable bio */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--theme-spacing-large);
            border-bottom: 1px solid var(--theme-border);
            animation: fadeIn 0.5s ease;
        }
       
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--theme-accent-glow);
            margin-bottom: var(--theme-spacing-medium);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s;
        }
       
        .profile-avatar:hover {
            transform: scale(1.05);
        }
       
        .profile-name {
            font-size: var(--theme-font-size-large);
            font-weight: bold;
            color: var(--theme-accent);
            margin-bottom: var(--theme-spacing-small);
        }
       
        .profile-bio {
            font-size: var(--theme-font-size-small);
            color: var(--theme-text-dim);
            text-align: center;
            margin: var(--theme-spacing-small) 0;
            max-width: 80%;
        }
       
        .profile-stats {
            display: flex;
            gap: var(--theme-spacing-large);
            margin-top: var(--theme-spacing-small);
        }
       
        .stat {
            text-align: center;
        }
       
        .stat-number {
            font-weight: bold;
            font-size: var(--theme-font-size-large);
        }
       
        .stat-label {
            font-size: var(--theme-font-size-small);
            color: var(--theme-text-dim);
        }
       
        .profile-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--theme-spacing-small);
            padding: var(--theme-spacing-small);
        }
       
        .profile-post-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            transition: transform 0.3s;
        }
       
        .profile-post-img:hover {
            transform: scale(1.05);
        }
       
        /* Messages/DMs - Improved with search */
        .messages-list {
            padding: var(--theme-spacing-medium);
        }
       
        .message-thread {
            display: flex;
            align-items: center;
            padding: var(--theme-spacing-small);
            border-bottom: 1px solid var(--theme-border);
            cursor: pointer;
            transition: background 0.2s;
        }
       
        .message-thread:hover {
            background: var(--theme-accent-glow);
        }
       
        .message-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
        }
       
        .message-info {
            margin-left: var(--theme-spacing-medium);
            flex: 1;
        }
       
        .message-username {
            font-weight: bold;
            font-size: var(--theme-font-size-small);
        }
       
        .message-preview {
            font-size: var(--theme-font-size-small);
            color: var(--theme-text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
       
        /* Message View - Enhanced scrolling */
        .message-view {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
        }
       
        .message-header {
            padding: var(--theme-spacing-medium);
            border-bottom: 1px solid var(--theme-border);
            display: flex;
            align-items: center;
            gap: var(--theme-spacing-medium);
        }
       
        .message-back {
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }
       
        .message-back:hover {
            color: var(--theme-accent);
        }
       
        .message-title {
            font-weight: bold;
            font-size: var(--theme-font-size-medium);
        }
       
        .message-viewport {
            flex: 1;
            overflow-y: auto;
            padding: var(--theme-spacing-medium);
            display: flex;
            flex-direction: column;
            gap: var(--theme-spacing-small);
            scroll-behavior: smooth;
        }
       
        .msg-bubble {
            max-width: 70%;
            padding: var(--theme-spacing-small) var(--theme-spacing-medium);
            border-radius: 20px;
            font-size: var(--theme-font-size-small);
            position: relative;
            box-shadow: var(--theme-shadow);
        }
       
        .msg-received {
            background: var(--theme-wa-received);
            align-self: flex-start;
        }
       
        .msg-sent {
            background: var(--theme-wa-sent);
            align-self: flex-end;
            color: #fff;
        }
       
        .msg-time {
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: right;
            margin-top: var(--theme-spacing-small);
        }
       
        .message-input {
            display: flex;
            padding: var(--theme-spacing-medium);
            border-top: 1px solid var(--theme-border);
        }
       
        .message-input input {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border: none;
            padding: var(--theme-spacing-small) var(--theme-spacing-medium);
            border-radius: 25px;
            color: var(--theme-text);
            font-size: var(--theme-font-size-small);
        }
       
        .message-send {
            margin-left: var(--theme-spacing-small);
            color: var(--theme-accent);
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
       
        .message-send:hover {
            transform: scale(1.1);
        }
       
        /* Search Page - Improved with filters */
        .search-input {
            width: 100%;
            padding: var(--theme-spacing-small);
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 25px;
            margin: var(--theme-spacing-medium) 0;
            color: var(--theme-text);
            font-size: var(--theme-font-size-small);
        }
       
        .search-results {
            display: flex;
            flex-direction: column;
            gap: var(--theme-spacing-medium);
        }
       
        .search-user {
            display: flex;
            align-items: center;
            padding: var(--theme-spacing-small);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
       
        .search-user:hover {
            background: var(--theme-accent-glow);
            box-shadow: var(--theme-shadow);
        }
       
        .search-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
        }
       
        .search-name {
            margin-left: var(--theme-spacing-medium);
            font-weight: bold;
            font-size: var(--theme-font-size-small);
        }
       
        .search-bio {
            font-size: var(--theme-font-size-small);
            color: var(--theme-text-dim);
            margin-left: var(--theme-spacing-small);
        }
       
        .follow-btn {
            margin-left: auto;
            background: var(--theme-accent);
            color: #fff;
            padding: var(--theme-spacing-small) var(--theme-spacing-medium);
            border-radius: 20px;
            font-size: var(--theme-font-size-small);
            cursor: pointer;
            transition: background 0.2s;
            border: none;
        }

<body>

                    <div class="message-viewport" id="message-viewport"></div>
                    <div class="message-input">
                        <input type="text" id="message-input-text" placeholder="Type a message...">

            <!-- Profile View -->

    <!-- Publish Modal -->
    <div id="publish-modal">
        <div class="publish-box">
            <div class="publish-header">Create Post</div>
            <textarea class="publish-textarea" id="post-caption" placeholder="What's on your mind?"></textarea>
            <img id="post-image-preview" class="publish-image-preview">
            <div class="publish-actions">
                <label for="post-image-upload" class="action-icon"><i class="fas fa-image"></i></label>
                <input type="file" id="post-image-upload" accept="image/*" style="display:none" onchange="previewPostImage(this)">
                <button class="publish-btn" onclick="publishPost()">Post</button>
            </div>
        </div>
    </div>
   
    <script type="module">
        const { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } = window.firebaseModules;
        const { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, query, where, orderBy, limit, runTransaction, serverTimestamp, getDocs } = window.firebaseModules;
        const { getStorage, ref: storageRef, uploadBytes, getDownloadURL } = window.firebaseModules;

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
            authDomain: "cosmic-notes-f7648.firebaseapp.com",
            projectId: "cosmic-notes-f7648",
            storageBucket: "cosmic-notes-f7648.appspot.com",
            messagingSenderId: "70656136344",
            appId: "1:70656136344:web:640193b83f63cac569aced"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
       
        let currentUser = null;
        let activeView = 'home';
        let activeMessageThread = null;
        let unsubscribers = {};
        let userCache = new Map();
        let postCache = new Map();
       
        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        }
       
        // Auth Functions - Improved error handling
        async function handleLogin() {
            const btn = document.querySelector('#auth-gate .btn-primary');
            btn.innerHTML = 'CONNECTING...';
            btn.disabled = true;
            try {
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await signInWithPopup(auth, provider);
                console.log("Login success:", result.user.email);
            } catch (err) {
                let msg = "Login failed";
                if (err.code === 'auth/popup-blocked') msg = "Popup blocked - allow popups!";
                else if (err.code === 'auth/unauthorized-domain') msg = "Domain not authorized - add cosmicnotes.vercel.app in Firebase Console!";
                else if (err.code) msg += `: ${err.code} - ${err.message}`;
                else msg += `: ${err.message}`;
                alert(msg);
                console.error("Full error:", err);
            } finally {
                btn.innerHTML = 'INITIALIZE SYNC';
                btn.disabled = false;
            }
        }
       
        onAuthStateChanged(auth, async user => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (!userDoc.exists() || !userDoc.data().name) {
                    document.getElementById('auth-gate').style.display = 'none';
                    document.getElementById('identity-lock').style.display = 'flex';
                    document.getElementById('app').style.display = 'none';
                } else {
                    document.getElementById('auth-gate').style.display = 'none';
                    document.getElementById('identity-lock').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    loadApp();
                }
            } else {
                document.getElementById('auth-gate').style.display = 'flex';
                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').style.display = 'none';
            }
        });
       
        async function submitIdentity() {
            const name = document.getElementById('pilot-name').value.trim();
            const status = document.getElementById('pilot-status').value;
            const bio = document.getElementById('pilot-bio').value.trim() || 'No bio yet';
            if (name.length < 3) return alert("Callsign too short.");
            try {
                await setDoc(doc(db, 'users', currentUser.uid), {
                    uid: currentUser.uid,
                    name,
                    status,
                    bio,
                    avatarUrl: currentUser.photoURL || null,
                    followers: [],
                    following: [],
                    lastSeen: serverTimestamp()
                }, { merge: true });
                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                loadApp();
            } catch (err) {
                alert("Error: " + err.message);
            }
        }
       
        function handleLogout() {
            signOut(auth);
        }
       
        // Load App
        function loadApp() {
            loadStories();
            loadFeed();
            loadMessagesList();
            loadProfile();
            navigate('home');
        }
       
        // Navigation
        function navigate(view) {
            activeView = view;
            document.querySelectorAll('.content-view').forEach(el => el.classList.remove('active'));
            document.getElementById(`${view}-view`).classList.add('active');
            document.querySelectorAll('.nav-icon, .sidebar-icon').forEach(el => el.classList.remove('active'));
            const icons = document.querySelectorAll(`[onclick*="navigate('${view}'"]`);
            icons.forEach(icon => icon.classList.add('active'));
            if (view === 'search') loadSearchResults();
            if (view === 'messages') backToMessagesList();
            if (view === 'profile') loadProfile();
        }
       
        // Utility: Debounce
        function debounce(func, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => func(...args), delay);
            };
        }
       
        // User Data Cache
        async function getUserData(uid) {
            if (userCache.has(uid)) return userCache.get(uid);
            const userDoc = await getDoc(doc(db, 'users', uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                userCache.set(uid, data);
                return data;
            }
            return null;
        }
       
        // Stories
        async function loadStories() {
            const bar = document.getElementById('stories-bar');
            bar.innerHTML = '';
            // My story
            const myStory = document.createElement('div');
            myStory.className = 'story-circle';
            myStory.innerHTML = `<div class="story-avatar"><i class="fas fa-plus"></i></div>`;
            myStory.onclick = () => alert('Add story coming soon');
            bar.appendChild(myStory);
            // Others
            const user = await getUserData(currentUser.uid);
            const following = user.following || [];
            for (let uid of following) {
                const followedUser = await getUserData(uid);
                if (followedUser) {
                    const story = document.createElement('div');
                    story.className = 'story-circle';
                    story.innerHTML = `<div class="story-avatar"><img src="${followedUser.avatarUrl || 'https://via.placeholder.com/54'}"></div>`;
                    story.onclick = () => alert('View story coming soon');
                    bar.appendChild(story);
                }
            }
        }
       
        // Feed
        let posts = [];
        function loadFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '<div class="loading-spinner"></div>';
            if (unsubscribers['feed']) unsubscribers['feed']();
            const q = query(collection(db, 'posts'), orderBy('timestamp', 'desc'), limit(20));
            unsubscribers['feed'] = onSnapshot(q, snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const post = change.doc.data();
                        post.id = change.doc.id;
                        posts.unshift(post);
                    } else if (change.type === 'modified') {
                        const index = posts.findIndex(p => p.id === change.doc.id);
                        if (index > -1) posts[index] = { ...change.doc.data(), id: change.doc.id };
                    } else if (change.type === 'removed') {
                        posts = posts.filter(p => p.id !== change.doc.id);
                    }
                });
                renderAllPosts();
            });
        }
       
        function renderAllPosts() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            posts.forEach(renderPost);
        }
       
        async function renderPost(post) {
            const user = await getUserData(post.userId);
            if (!user) return;
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `
                <div class="post-header">
                    <div class="post-avatar"><img src="${user.avatarUrl || 'https://via.placeholder.com/40'}"></div>
                    <span class="post-username">${user.name}</span>
                    <span class="post-time">${post.timestamp ? new Date(post.timestamp.toDate()).toLocaleString() : 'Just now'}</span>

                    <i class="fas fa-comment action-btn" onclick="focusComment('${post.id}')"></i>
                    <i class="fas fa-share action-btn" onclick="sharePost('${post.id}')"></i>
                </div>
                <div class="post-caption">${post.caption || ''}</div>
                <div class="post-comments" id="comments-${post.id}"></div>
                <div class="comment-input">
                    <input type="text" placeholder="Add a comment..." id="comment-input-${post.id}">
                    <i class="fas fa-paper-plane comment-send" onclick="addComment('${post.id}')"></i>
                </div>
            `;
            document.getElementById('feed').appendChild(card);
            // Render comments
            const commentsContainer = document.getElementById(`comments-${post.id}`);
            for (let c of post.comments || []) {
                const commentUser = await getUserData(c.userId);
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment';
                commentDiv.innerHTML = `
                    <div class="comment-avatar"><img src="${commentUser?.avatarUrl || 'https://via.placeholder.com/30'}"></div>
                    <div class="comment-content">
                        <span class="comment-username">${commentUser?.name || 'Anonymous'}</span>
                        <span class="comment-text">${c.text}</span>
                    </div>
                `;
                commentsContainer.appendChild(commentDiv);
            }
        }
       
        async function toggleLike(postId) {
            const postRef = doc(db, 'posts', postId);
            await runTransaction(db, async (transaction) => {
                const postDoc = await transaction.get(postRef);
                if (!postDoc.exists()) throw "Post does not exist!";
                let likes = postDoc.data().likes || [];
                if (likes.includes(currentUser.uid)) {
                    likes = likes.filter(id => id !== currentUser.uid);
                } else {
                    likes.push(currentUser.uid);
                }
                transaction.update(postRef, { likes });
            });
        }
       
        async function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await updateDoc(doc(db, 'posts', postId), {
                comments: arrayUnion({
                    userId: currentUser.uid,
                    text,
                    timestamp: serverTimestamp()
                })
            });
        }
       
        function focusComment(postId) {
            document.getElementById(`comment-input-${postId}`).focus();
        }
       
        function sharePost(postId) {
            alert('Share coming soon');
        }
       
        // Publish Post
        function openPublishModal() {
            document.getElementById('post-caption').value = '';
            document.getElementById('post-image-preview').style.display = 'none';
            document.getElementById('post-image-preview').src = '';
            document.getElementById('publish-modal').style.display = 'flex';
        }
       
        function previewPostImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('post-image-preview').src = e.target.result;
                    document.getElementById('post-image-preview').style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
       
        async function publishPost() {
            const caption = document.getElementById('post-caption').value.trim();
            const file = document.getElementById('post-image-upload').files[0];
            if (!caption && !file) return alert('Add caption or image');
            document.getElementById('publish-modal').style.display = 'none';
            let imageUrl = null;
            if (file) {
                const storageReference = storageRef(storage, `posts/${currentUser.uid}/${Date.now()}`);
                await uploadBytes(storageReference, file);
                imageUrl = await getDownloadURL(storageReference);
            }
            await addDoc(collection(db, 'posts'), {
                userId: currentUser.uid,
                caption,
                imageUrl,
                timestamp: serverTimestamp(),
                likes: [],
                comments: []
            });
        }
       
        // Messages
        function loadMessagesList() {
            const list = document.getElementById('messages-list');
            list.innerHTML = '<div class="loading-spinner"></div>';
            if (unsubscribers['messages']) unsubscribers['messages']();
            const q = query(collection(db, 'conversations'), where('participants', 'array-contains', currentUser.uid), orderBy('timestamp', 'desc'));
            unsubscribers['messages'] = onSnapshot(q, snapshot => {
                list.innerHTML = '';
                snapshot.forEach(convDoc => {
                    const conv = convDoc.data();
                    conv.id = convDoc.id;
                    const otherUid = conv.participants.find(u => u !== currentUser.uid);
                    getUserData(otherUid).then(user => {
                        if (user) {
                            const thread = document.createElement('div');
                            thread.className = 'message-thread';
                            thread.innerHTML = `
                                <div class="message-avatar"><img src="${user.avatarUrl || 'https://via.placeholder.com/50'}"></div>
                                <div class="message-info">
                                    <span class="message-username">${user.name}</span>
                                    <span class="message-preview">${conv.lastMessage || 'No messages yet'}</span>
                                </div>
                            `;
                            thread.onclick = () => openMessageThread(conv.id, user);
                            list.appendChild(thread);
                        }
                    });
                });
            });
        }
       
        function openMessageThread(convId, user) {
            activeMessageThread = convId;
            document.getElementById('message-title').innerText = user.name;
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('message-view').classList.remove('hidden');
            loadMessages(convId);
        }
       
        function backToMessagesList() {
            document.getElementById('messages-list').classList.remove('hidden');
            document.getElementById('message-view').classList.add('hidden');
            if (unsubscribers['thread']) unsubscribers['thread']();
            document.getElementById('message-input-text').value = '';
            activeMessageThread = null;
        }
       
        function loadMessages(convId) {
            const viewport = document.getElementById('message-viewport');
            viewport.innerHTML = '';
            const q = query(collection(db, 'conversations', convId, 'messages'), orderBy('timestamp'));
            unsubscribers['thread'] = onSnapshot(q, snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const msg = change.doc.data();
                        renderMessage(msg, viewport);
                        viewport.scrollTop = viewport.scrollHeight;
                    }
                });
            });
        }
       
        async function renderMessage(msg, viewport) {
            const user = await getUserData(msg.userId);
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${msg.userId === currentUser.uid ? 'msg-sent' : 'msg-received'}`;
            bubble.innerHTML = `
                <div>${msg.text}</div>
                <div class="msg-time">${msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString() : 'Just now'}</div>
            `;
            viewport.appendChild(bubble);
        }
       
        async function sendMessage() {
            const text = document.getElementById('message-input-text').value.trim();
            if (!text || !activeMessageThread) return;
            document.getElementById('message-input-text').value = '';
            const convRef = doc(db, 'conversations', activeMessageThread);
            await runTransaction(db, async (transaction) => {
                await transaction.set(doc(collection(convRef, 'messages')), {
                    userId: currentUser.uid,
                    text,
                    timestamp: serverTimestamp()
                });
                transaction.update(convRef, {
                    lastMessage: text,
                    timestamp: serverTimestamp()
                });
            });
        }
       
        async function startMessage(uid) {
            if (uid === currentUser.uid) return;
            const participants = [currentUser.uid, uid].sort();
            const convId = participants.join('-');
            const convRef = doc(db, 'conversations', convId);
            const convDoc = await getDoc(convRef);
            if (!convDoc.exists()) {
                await setDoc(convRef, {
                    participants,
                    lastMessage: '',
                    timestamp: serverTimestamp()
                });
            }
            const user = await getUserData(uid);
            openMessageThread(convId, user);
        }
       
        // Search
        function loadSearchResults() {
            const input = document.getElementById('search-input');
            input.oninput = debounce(async () => {
                const queryStr = input.value.trim().toLowerCase();
                if (!queryStr) return;
                const results = document.getElementById('search-results');
                results.innerHTML = '';
                const q = query(collection(db, 'users'), where('name', '>=', queryStr), where('name', '<=', queryStr + '\uf8ff'), limit(10));
                const snapshot = await getDocs(q);
                const myData = await getUserData(currentUser.uid);
                const following = myData.following || [];
                snapshot.forEach(userDoc => {
                    if (userDoc.id === currentUser.uid) return;
                    const user = userDoc.data();
                    user.uid = userDoc.id;
                    const div = document.createElement('div');
                    div.className = 'search-user';
                    div.onclick = () => viewUserProfile(user.uid);
                    div.innerHTML = `
                        <div class="search-avatar"><img src="${user.avatarUrl || 'https://via.placeholder.com/50'}"></div>
                        <span class="search-name">${user.name}</span>
                        <span class="search-bio">${user.bio || ''}</span>
                        <button class="follow-btn" onclick="toggleFollow('${user.uid}'); event.stopPropagation();">${following.includes(user.uid) ? 'Unfollow' : 'Follow'}</button>
                        <i class="fas fa-message" style="margin-left:10px; color:var(--theme-comment); cursor:pointer;" onclick="startMessage('${user.uid}'); event.stopPropagation();"></i>
                    `;
                    results.appendChild(div);
                });
            }, 300);
        }
       
        async function toggleFollow(uid) {
            if (uid === currentUser.uid) return;
            const myRef = doc(db, 'users', currentUser.uid);
            const otherRef = doc(db, 'users', uid);
            await runTransaction(db, async (transaction) => {
                const myDoc = await transaction.get(myRef);
                const otherDoc = await transaction.get(otherRef);
                let myFollowing = myDoc.data().following || [];
                let otherFollowers = otherDoc.data().followers || [];
                if (myFollowing.includes(uid)) {
                    myFollowing = myFollowing.filter(u => u !== uid);
                    otherFollowers = otherFollowers.filter(u => u !== currentUser.uid);
                } else {
                    myFollowing.push(uid);
                    otherFollowers.push(currentUser.uid);
                }
                transaction.update(myRef, { following: myFollowing });
                transaction.update(otherRef, { followers: otherFollowers });
            });
            userCache.delete(currentUser.uid);
            userCache.delete(uid);
            // Reload relevant views
            if (activeView === 'search') loadSearchResults();
            if (activeView === 'profile') loadProfile();
        }
       
        function viewUserProfile(uid) {
            alert(`Viewing profile of ${uid} coming soon`);
        }
       
        // Profile
        async function loadProfile() {
            const user = await getUserData(currentUser.uid);
            const postCountQuery = query(collection(db, 'posts'), where('userId', '==', currentUser.uid));
            const postCount = (await getDocs(postCountQuery)).size;
            const header = document.getElementById('profile-header');
            header.innerHTML = `
                <div class="profile-avatar"><img src="${user.avatarUrl || 'https://via.placeholder.com/120'}"></div>
                <span class="profile-name">${user.name}</span>
                <span class="profile-bio">${user.bio}</span>
                <div class="profile-stats">
                    <div class="stat">
                        <span class="stat-number">${(user.followers || []).length}</span>
                        <span class="stat-label">Followers</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">${(user.following || []).length}</span>
                        <span class="stat-label">Following</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">${postCount}</span>
                        <span class="stat-label">Posts</span>
                    </div>
                </div>
            `;
            loadProfilePosts(currentUser.uid);
        }
       
        async function loadProfilePosts(uid) {
            const postsDiv = document.getElementById('profile-posts');
            postsDiv.innerHTML = '';
            const q = query(collection(db, 'posts'), where('userId', '==', uid), orderBy('timestamp', 'desc'));
            const snapshot = await getDocs(q);
            snapshot.forEach(postDoc => {
                const post = postDoc.data();
                if (post.imageUrl) {
                    const img = document.createElement('img');
                    img.className = 'profile-post-img';
                    img.src = post.imageUrl;
                    postsDiv.appendChild(img);
                }
            });
        }
       
        // Star Canvas
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = Array.from({length: 500}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.5,
                opacity: Math.random() * 0.5 + 0.5,
                speed: Math.random() * 0.1 + 0.05
            }));
        }
        function renderStars() {
            if (document.hidden) return requestAnimationFrame(renderStars);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.x -= s.speed;
                if (s.x < 0) s.x = canvas.width;
                ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(renderStars);
        }
        window.addEventListener('resize', initStars);
        initStars();
        renderStars();
       
        // Close modals on outside click
        document.getElementById('publish-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('publish-modal')) {
                document.getElementById('publish-modal').style.display = 'none';
            }
        });
    </script>
</body>
</html>
