<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gram | Cosmic Social Network</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d2ff;
            --primary-dark: #00b2df;
            --bg-dark: #03030b;
            --bg-panel: rgba(10, 10, 18, 0.98);
            --text: #f0f0f0;
            --text-dim: #a0a0a0;
            --border: rgba(0, 210, 255, 0.15);
            --danger: #ff3b3b;
            --success: #00ff88;
            --like: #ff4081;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        body.light-theme {
            --bg-dark: #f8f9fa;
            --bg-panel: #ffffff;
            --text: #111111;
            --text-dim: #666666;
            --border: rgba(0, 150, 255, 0.2);
            --primary: #0077cc;
            --primary-dark: #005fa3;
        }

        /* Canvas */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body.light-theme #star-canvas {
            display: none;
        }

        /* Auth Screen */
        .auth-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            z-index: 5000;
            flex-direction: column;
            gap: 20px;
        }

        .auth-screen.hidden {
            display: none;
        }

        .auth-logo {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 30px var(--primary);
            letter-spacing: 10px;
            animation: pulse 2s infinite;
        }

        .auth-subtitle {
            color: var(--text-dim);
            letter-spacing: 3px;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Setup Form */
        .setup-form {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 4999;
        }

        .setup-form.hidden {
            display: none;
        }

        .form-box {
            background: var(--bg-panel);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow);
        }

        .form-box h2 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .form-box p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: var(--primary);
            font-size: 0.8rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Main App */
        .app-container {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            flex-direction: row;
        }

        .app-container.active {
            display: flex;
        }

        /* Header (Mobile) */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 200;
            box-shadow: var(--shadow);
        }

        @media (min-width: 768px) {
            .header {
                display: none;
            }
        }

        .header-logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .header-icon {
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
        }

        .header-icon:hover {
            color: var(--primary);
            transform: scale(1.1);
        }

        /* Sidebar (Desktop) */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 72px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            transition: width 0.3s;
            z-index: 150;
        }

        @media (max-width: 767px) {
            .sidebar {
                display: none;
            }
        }

        .sidebar:hover {
            width: 250px;
        }

        .sidebar-item {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
            position: relative;
        }

        .sidebar-item:hover {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
        }

        .sidebar-item.active {
            color: var(--primary);
            background: rgba(0, 210, 255, 0.2);
        }

        .sidebar-label {
            display: none;
            margin-left: 15px;
            font-size: 0.95rem;
        }

        .sidebar:hover .sidebar-label {
            display: inline;
        }

        .sidebar-spacer {
            flex: 1;
        }

        .sidebar-theme {
            margin: 20px 0;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-left: 0;
            margin-top: 60px;
            margin-bottom: 60px;
        }

        @media (min-width: 768px) {
            .content-area {
                margin-left: 72px;
                margin-top: 0;
                margin-bottom: 0;
            }
        }

        .content-view {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .content-view.active {
            display: flex;
            flex-direction: column;
        }

        /* Feed */
        .feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .stories-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .story-item {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .story-item:hover {
            transform: scale(1.05);
        }

        .story-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .story-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Post Card */
        .post-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .post-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-username {
            font-weight: bold;
            color: var(--primary);
            flex: 1;
        }

        .post-time {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .post-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
        }

        .post-actions {
            display: flex;
            gap: 15px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        .action-btn {
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
            background: none;
            border: none;
            flex: 1;
            text-align: left;
        }

        .action-btn:hover {
            color: var(--primary);
            transform: scale(1.1);
        }

        .action-btn.liked {
            color: var(--like);
        }

        .post-caption {
            padding: 12px 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            border-bottom: 1px solid var(--border);
        }

        .post-comments {
            max-height: 150px;
            overflow-y: auto;
            padding: 10px 15px;
        }

        .comment {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-text {
            flex: 1;
        }

        .comment-username {
            font-weight: bold;
            color: var(--primary);
            margin-right: 5px;
        }

        .comment-input {
            display: flex;
            gap: 8px;
            padding: 12px 15px;
            border-top: 1px solid var(--border);
        }

        .comment-input input {
            flex: 1;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        .comment-send {
            cursor: pointer;
            color: var(--primary);
            font-size: 1rem;
            background: none;
            border: none;
        }

        /* Search */
        .search-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .search-results {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-card:hover {
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.1);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            color: var(--primary);
        }

        .user-bio {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .follow-btn, .msg-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .follow-btn:hover, .msg-btn:hover {
            background: var(--primary-dark);
        }

        /* Messages */
        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 350px;
        }

        .message-item {
            display: flex;
            align-items: center;
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .message-item:hover {
            background: rgba(0, 210, 255, 0.1);
        }

        .message-item.active {
            background: rgba(0, 210, 255, 0.2);
        }

        .message-preview-text {
            font-size: 0.9rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            border-left: 1px solid var(--border);
        }

        .message-view.hidden {
            display: none;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .message-back {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .message-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .message-sent {
            background: #005c4b;
            color: white;
            align-self: flex-end;
        }

        .message-received {
            background: #202c33;
            color: white;
            align-self: flex-start;
        }

        .message-input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid var(--border);
        }

        .message-input-area input {
            flex: 1;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 10px 15px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .message-send-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Profile */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            border-bottom: 1px solid var(--border);
            gap: 15px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .profile-bio {
            color: var(--text-dim);
            text-align: center;
            max-width: 300px;
        }

        .profile-stats {
            display: flex;
            gap: 30px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .profile-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            padding: 15px;
        }

        .profile-post {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .profile-post:hover {
            transform: scale(1.05);
        }

        .profile-post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bottom Nav (Mobile) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
        }

        @media (min-width: 768px) {
            .bottom-nav {
                display: none;
            }
        }

        .nav-icon {
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
        }

        .nav-icon.active {
            color: var(--primary);
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .modal-textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text);
            resize: vertical;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .modal-image-preview {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-cancel, .modal-submit {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .modal-cancel {
            background: var(--text-dim);
            color: white;
        }

        .modal-submit {
            background: var(--primary);
            color: white;
        }

        .modal-submit:hover {
            background: var(--primary-dark);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <canvas id="star-canvas"></canvas>

    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-logo">NEXUS GRAM</div>
        <p class="auth-subtitle">COSMIC SOCIAL PROTOCOL</p>
        <button class="btn-primary" onclick="handleLogin()">INITIALIZE SYNC</button>
    </div>

    <!-- Setup Form -->
    <div class="setup-form" id="setupForm">
        <div class="form-box">
            <h2>PILOT CREDENTIALS</h2>
            <p>Set up your cosmic identity</p>
            <div class="form-group">
                <label>CALLSIGN</label>
                <input type="text" id="username" placeholder="Your username">
            </div>
            <div class="form-group">
                <label>STATUS</label>
                <select id="status">
                    <option value="online">🟢 Online</option>
                    <option value="away">🟡 Away</option>
                    <option value="offline">⚪ Offline</option>
                </select>
            </div>
            <div class="form-group">
                <label>BIO</label>
                <textarea id="bio" placeholder="Your cosmic journey..." maxlength="160"></textarea>
            </div>
            <button class="btn-primary" onclick="submitSetup()" style="width: 100%; margin-top: 15px;">LAUNCH PROFILE</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-item" onclick="navigate('home')" data-page="home">
                <i class="fas fa-home"></i>
                <span class="sidebar-label">Home</span>
            </div>
            <div class="sidebar-item" onclick="navigate('search')" data-page="search">
                <i class="fas fa-search"></i>
                <span class="sidebar-label">Search</span>
            </div>
            <div class="sidebar-item" onclick="openPostModal()">
                <i class="fas fa-plus-square"></i>
                <span class="sidebar-label">Post</span>
            </div>
            <div class="sidebar-item" onclick="navigate('messages')" data-page="messages">
                <i class="fas fa-comment-dots"></i>
                <span class="sidebar-label">Messages</span>
            </div>
            <div class="sidebar-item" onclick="navigate('profile')" data-page="profile">
                <i class="fas fa-user"></i>
                <span class="sidebar-label">Profile</span>
            </div>
            <div class="sidebar-spacer"></div>
            <div class="sidebar-item sidebar-theme" onclick="toggleTheme()">
                <i class="fas fa-moon"></i>
                <span class="sidebar-label">Theme</span>
            </div>
            <div class="sidebar-item" onclick="logout()" style="color: var(--danger);">
                <i class="fas fa-sign-out-alt"></i>
                <span class="sidebar-label">Logout</span>
            </div>
        </aside>

        <!-- Header (Mobile) -->
        <header class="header">
            <div class="header-logo">Nexus Gram</div>
            <div class="header-actions">
                <i class="header-icon fas fa-moon" onclick="toggleTheme()"></i>
                <i class="header-icon fas fa-sign-out-alt" onclick="logout()"></i>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Home -->
            <div class="content-view active" id="homeView">
                <div class="stories-container" id="storiesContainer"></div>
                <div class="feed" id="feedContainer"></div>
            </div>

            <!-- Search -->
            <div class="content-view" id="searchView">
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search users...">
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <!-- Messages -->
            <div class="content-view" id="messagesView" style="flex-direction: row;">
                <div class="messages-list" id="messagesList"></div>
                <div class="message-view hidden" id="messageView">
                    <div class="message-header">
                        <i class="message-back fas fa-arrow-left" onclick="backToMessages()"></i>
                        <span id="messageTitle"></span>
                    </div>
                    <div class="message-viewport" id="messageViewport"></div>
                    <div class="message-input-area">
                        <input type="text" id="messageInput" placeholder="Type a message...">
                        <button class="message-send-btn" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Profile -->
            <div class="content-view" id="profileView">
                <div class="profile-header" id="profileHeader"></div>
                <div class="profile-posts" id="profilePosts"></div>
            </div>
        </div>

        <!-- Bottom Nav (Mobile) -->
        <nav class="bottom-nav">
            <i class="nav-icon fas fa-home active" onclick="navigate('home')" data-page="home"></i>
            <i class="nav-icon fas fa-search" onclick="navigate('search')" data-page="search"></i>
            <i class="nav-icon fas fa-plus-square" onclick="openPostModal()"></i>
            <i class="nav-icon fas fa-comment-dots" onclick="navigate('messages')" data-page="messages"></i>
            <i class="nav-icon fas fa-user" onclick="navigate('profile')" data-page="profile"></i>
        </nav>
    </div>

    <!-- Post Modal -->
    <div class="modal" id="postModal">
        <div class="modal-box">
            <div class="modal-header">Create Post</div>
            <textarea class="modal-textarea" id="postCaption" placeholder="What's on your mind?"></textarea>
            <img id="imagePreview" class="modal-image-preview">
            <div style="margin-bottom: 15px;">
                <label for="imageUpload" style="cursor: pointer; color: var(--primary);">
                    <i class="fas fa-image"></i> Add Image
                </label>
                <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="previewImage(this)">
            </div>
            <div class="modal-actions">
                <button class="modal-cancel" onclick="closePostModal()">Cancel</button>
                <button class="modal-submit" onclick="submitPost()">Post</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
            authDomain: "cosmic-notes-f7648.firebaseapp.com",
            projectId: "cosmic-notes-f7648",
            storageBucket: "cosmic-notes-f7648.appspot.com",
            messagingSenderId: "70656136344",
            appId: "1:70656136344:web:640193b83f63cac569aced"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentUser = null;
        let currentPage = 'home';
        let selectedConversation = null;
        let userCache = new Map();

        // Auth Functions
        async function handleLogin() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                currentUser = result.user;
                checkUserSetup();
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        }

        async function checkUserSetup() {
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            if (!userDoc.exists || !userDoc.data().username) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('setupForm').style.display = 'flex';
            } else {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('setupForm').style.display = 'none';
                document.getElementById('appContainer').classList.add('active');
                initializeApp();
            }
        }

        async function submitSetup() {
            const username = document.getElementById('username').value.trim();
            const status = document.getElementById('status').value;
            const bio = document.getElementById('bio').value.trim();

            if (!username) return alert('Please enter a username');

            try {
                await db.collection('users').doc(currentUser.uid).set({
                    username,
                    status,
                    bio,
                    avatar: currentUser.photoURL || 'https://via.placeholder.com/100',
                    followers: [],
                    following: [],
                    createdAt: new Date()
                }, { merge: true });

                document.getElementById('setupForm').style.display = 'none';
                document.getElementById('appContainer').classList.add('active');
                initializeApp();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function logout() {
            auth.signOut();
            currentUser = null;
            document.getElementById('appContainer').classList.remove('active');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        auth.onAuthStateChanged(user => {
            if (user && !currentUser) {
                currentUser = user;
                checkUserSetup();
            }
        });

        // UI Functions
        function navigate(page) {
            currentPage = page;
            document.querySelectorAll('.content-view').forEach(el => el.classList.remove('active'));
            document.getElementById(page + 'View').classList.add('active');

            document.querySelectorAll('[data-page]').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`[data-page="${page}"]`).forEach(el => el.classList.add('active'));

            if (page === 'home') loadFeed();
            if (page === 'search') loadSearch();
            if (page === 'messages') loadMessages();
            if (page === 'profile') loadProfile();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        }

        // Star Canvas
        function initStarCanvas() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    opacity: Math.random() * 0.5 + 0.5
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }

            animate();
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        // Feed
        async function loadFeed() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';

            try {
                const posts = await db.collection('posts').orderBy('createdAt', 'desc').limit(20).get();
                
                if (posts.empty) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-dim);">No posts yet</p>';
                    return;
                }

                for (const doc of posts.docs) {
                    const post = doc.data();
                    post.id = doc.id;
                    const user = await getUser(post.userId);
                    renderPost(post, user);
                }
            } catch (error) {
                console.error('Error loading feed:', error);
            }
        }

        async function renderPost(post, user) {
            const container = document.getElementById('feedContainer');
            const card = document.createElement('div');
            card.className = 'post-card';

            const timeAgo = getTimeAgo(post.createdAt);

            card.innerHTML = `
                <div class="post-header">
                    <div class="post-avatar"><img src="${user.avatar}"></div>
                    <div>
                        <div class="post-username">${user.username}</div>
                        <div class="post-time">${timeAgo}</div>
                    </div>
                </div>
                ${post.image ? `<img class="post-image" src="${post.image}">` : ''}
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleLike('${post.id}')">
                        <i class="fas fa-heart ${post.likes?.includes(currentUser.uid) ? 'liked' : ''}"></i>
                    </button>
                    <button class="action-btn" onclick="focusComment('${post.id}')">
                        <i class="fas fa-comment"></i>
                    </button>
                    <button class="action-btn" onclick="sharePost('${post.id}')">
                        <i class="fas fa-share"></i>
                    </button>
                </div>
                <div class="post-caption">${post.caption}</div>
                <div class="post-comments" id="comments-${post.id}"></div>
                <div class="comment-input">
                    <input type="text" placeholder="Add comment..." id="comment-input-${post.id}">
                    <button class="comment-send" onclick="addComment('${post.id}')">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            `;

            container.appendChild(card);

            // Load comments
            if (post.comments && post.comments.length > 0) {
                const commentsDiv = document.getElementById(`comments-${post.id}`);
                for (const comment of post.comments) {
                    const commentUser = await getUser(comment.userId);
                    const commentEl = document.createElement('div');
                    commentEl.className = 'comment';
                    commentEl.innerHTML = `
                        <div class="comment-avatar"><img src="${commentUser.avatar}"></div>
                        <div class="comment-text">
                            <span class="comment-username">${commentUser.username}</span> ${comment.text}
                        </div>
                    `;
                    commentsDiv.appendChild(commentEl);
                }
            }
        }

        async function toggleLike(postId) {
            try {
                const post = await db.collection('posts').doc(postId).get();
                const likes = post.data().likes || [];
                const index = likes.indexOf(currentUser.uid);

                if (index > -1) {
                    likes.splice(index, 1);
                } else {
                    likes.push(currentUser.uid);
                }

                await db.collection('posts').doc(postId).update({ likes });
                loadFeed();
            } catch (error) {
                console.error('Error toggling like:', error);
            }
        }

        async function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            try {
                const post = await db.collection('posts').doc(postId).get();
                const comments = post.data().comments || [];
                comments.push({
                    userId: currentUser.uid,
                    text,
                    createdAt: new Date()
                });

                await db.collection('posts').doc(postId).update({ comments });
                input.value = '';
                loadFeed();
            } catch (error) {
                console.error('Error adding comment:', error);
            }
        }

        function focusComment(postId) {
            document.getElementById(`comment-input-${postId}`).focus();
        }

        function sharePost(postId) {
            alert('Share feature coming soon!');
        }

        // Post Modal
        function openPostModal() {
            document.getElementById('postModal').classList.add('active');
        }

        function closePostModal() {
            document.getElementById('postModal').classList.remove('active');
            document.getElementById('postCaption').value = '';
            document.getElementById('imagePreview').style.display = 'none';
        }

        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function submitPost() {
            const caption = document.getElementById('postCaption').value.trim();
            const file = document.getElementById('imageUpload').files[0];

            if (!caption && !file) return alert('Please add content');

            try {
                let imageUrl = null;

                if (file) {
                    const ref = storage.ref(`posts/${currentUser.uid}/${Date.now()}`);
                    await ref.put(file);
                    imageUrl = await ref.getDownloadURL();
                }

                await db.collection('posts').add({
                    userId: currentUser.uid,
                    caption,
                    image: imageUrl,
                    likes: [],
                    comments: [],
                    createdAt: new Date()
                });

                closePostModal();
                loadFeed();
            } catch (error) {
                alert('Error posting: ' + error.message);
            }
        }

        // Search
        async function loadSearch() {
            const input = document.getElementById('searchInput');
            input.addEventListener('input', debounce(performSearch, 300));
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const results = document.getElementById('searchResults');

            if (!query) {
                results.innerHTML = '';
                return;
            }

            try {
                const users = await db.collection('users').get();
                results.innerHTML = '';

                users.forEach(doc => {
                    const user = doc.data();
                    if (doc.id !== currentUser.uid && user.username.toLowerCase().includes(query)) {
                        const userCard = document.createElement('div');
                        userCard.className = 'user-card';
                        userCard.innerHTML = `
                            <div class="user-avatar"><img src="${user.avatar}"></div>
                            <div class="user-info">
                                <div class="user-name">${user.username}</div>
                                <div class="user-bio">${user.bio || 'No bio'}</div>
                            </div>
                            <button class="follow-btn" onclick="toggleFollow('${doc.id}')">${
                                user.followers?.includes(currentUser.uid) ? 'Unfollow' : 'Follow'
                            }</button>
                            <button class="msg-btn" onclick="startMessage('${doc.id}')">
                                <i class="fas fa-message"></i>
                            </button>
                        `;
                        results.appendChild(userCard);
                    }
                });
            } catch (error) {
                console.error('Error searching:', error);
            }
        }

        async function toggleFollow(userId) {
            try {
                const userRef = db.collection('users').doc(currentUser.uid);
                const targetRef = db.collection('users').doc(userId);

                const user = await userRef.get();
                const target = await targetRef.get();

                let following = user.data().following || [];
                let followers = target.data().followers || [];

                if (following.includes(userId)) {
                    following = following.filter(id => id !== userId);
                    followers = followers.filter(id => id !== currentUser.uid);
                } else {
                    following.push(userId);
                    followers.push(currentUser.uid);
                }

                await userRef.update({ following });
                await targetRef.update({ followers });

                performSearch();
            } catch (error) {
                console.error('Error toggling follow:', error);
            }
        }

        // Messages
        async function loadMessages() {
            const list = document.getElementById('messagesList');
            list.innerHTML = '';

            try {
                const conversations = await db.collection('conversations')
                    .where('participants', 'array-contains', currentUser.uid)
                    .orderBy('lastMessageTime', 'desc')
                    .get();

                for (const doc of conversations.docs) {
                    const conv = doc.data();
                    const otherUserId = conv.participants.find(id => id !== currentUser.uid);
                    const user = await getUser(otherUserId);

                    const item = document.createElement('div');
                    item.className = 'message-item';
                    item.innerHTML = `
                        <div class="user-avatar"><img src="${user.avatar}"></div>
                        <div style="flex: 1;">
                            <div class="user-name">${user.username}</div>
                            <div class="message-preview-text">${conv.lastMessage || 'No messages'}</div>
                        </div>
                    `;
                    item.onclick = () => openConversation(doc.id, user);
                    list.appendChild(item);
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function startMessage(userId) {
            const user = await getUser(userId);
            const participants = [currentUser.uid, userId].sort();
            const convId = participants.join('-');

            try {
                const conv = await db.collection('conversations').doc(convId).get();
                if (!conv.exists) {
                    await db.collection('conversations').doc(convId).set({
                        participants,
                        lastMessage: '',
                        lastMessageTime: new Date()
                    });
                }
                openConversation(convId, user);
            } catch (error) {
                console.error('Error starting message:', error);
            }
        }

        async function openConversation(convId, user) {
            selectedConversation = convId;
            document.getElementById('messagesList').style.display = 'none';
            document.getElementById('messageView').classList.remove('hidden');
            document.getElementById('messageTitle').textContent = user.username;

            const viewport = document.getElementById('messageViewport');
            viewport.innerHTML = '';

            try {
                const messages = await db.collection('conversations').doc(convId).collection('messages')
                    .orderBy('createdAt', 'asc').get();

                for (const doc of messages.docs) {
                    const msg = doc.data();
                    const bubble = document.createElement('div');
                    bubble.className = `message-bubble ${msg.senderId === currentUser.uid ? 'message-sent' : 'message-received'}`;
                    bubble.textContent = msg.text;
                    viewport.appendChild(bubble);
                }

                viewport.scrollTop = viewport.scrollHeight;
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !selectedConversation) return;

            try {
                await db.collection('conversations').doc(selectedConversation).collection('messages').add({
                    senderId: currentUser.uid,
                    text,
                    createdAt: new Date()
                });

                await db.collection('conversations').doc(selectedConversation).update({
                    lastMessage: text,
                    lastMessageTime: new Date()
                });

                input.value = '';
                openConversation(selectedConversation, { username: document.getElementById('messageTitle').textContent });
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }

        function backToMessages() {
            document.getElementById('messagesList').style.display = 'flex';
            document.getElementById('messageView').classList.add('hidden');
            selectedConversation = null;
            document.getElementById('messageInput').value = '';
        }

        // Profile
        async function loadProfile() {
            const user = await getUser(currentUser.uid);
            const header = document.getElementById('profileHeader');
            const posts = await db.collection('posts').where('userId', '==', currentUser.uid).get();

            header.innerHTML = `
                <div class="profile-avatar"><img src="${user.avatar}"></div>
                <div class="profile-name">${user.username}</div>
                <div class="profile-bio">${user.bio || 'No bio'}</div>
                <div class="profile-stats">
                    <div class="stat">
                        <span class="stat-number">${user.followers?.length || 0}</span>
                        <span class="stat-label">Followers</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">${user.following?.length || 0}</span>
                        <span class="stat-label">Following</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">${posts.size}</span>
                        <span class="stat-label">Posts</span>
                    </div>
                </div>
            `;

            const postsDiv = document.getElementById('profilePosts');
            postsDiv.innerHTML = '';

            posts.forEach(doc => {
                const post = doc.data();
                if (post.image) {
                    const postEl = document.createElement('div');
                    postEl.className = 'profile-post';
                    postEl.innerHTML = `<img src="${post.image}">`;
                    postsDiv.appendChild(postEl);
                }
            });
        }

        // Utility Functions
        async function getUser(uid) {
            if (userCache.has(uid)) return userCache.get(uid);

            const doc = await db.collection('users').doc(uid).get();
            if (doc.exists) {
                userCache.set(uid, doc.data());
                return doc.data();
            }
            return null;
        }

        function debounce(func, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => func(...args), delay);
            };
        }

        function getTimeAgo(date) {
            const now = new Date();
            const seconds = Math.floor((now - date.toDate()) / 1000);

            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            return Math.floor(seconds / 86400) + 'd ago';
        }

        // Initialize
        function initializeApp() {
            initStarCanvas();
            navigate('home');
            loadStories();
        }

        async function loadStories() {
            const container = document.getElementById('storiesContainer');
            container.innerHTML = '';

            try {
                const user = await getUser(currentUser.uid);
                const story = document.createElement('div');
                story.className = 'story-item';
                story.innerHTML = `<i class="fas fa-plus" style="font-size: 1.5rem;"></i>`;
                container.appendChild(story);

                if (user.following && user.following.length > 0) {
                    for (const userId of user.following.slice(0, 10)) {
                        const followedUser = await getUser(userId);
                        if (followedUser) {
                            const storyEl = document.createElement('div');
                            storyEl.className = 'story-item';
                            storyEl.innerHTML = `<div class="story-avatar"><img src="${followedUser.avatar}"></div>`;
                            container.appendChild(storyEl);
                        }
                    }
                }
            } catch (error) {
                console.error('Error loading stories:', error);
            }
        }
    </script>
</body>
</html>
