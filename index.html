<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Gram | Cosmic Social Network</title>
   
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Root Variables */
        :root {
            --theme-bg: #03030b;
            --theme-panel: rgba(10, 10, 18, 0.98);
            --theme-text: #f0f0f0;
            --theme-text-dim: #a0a0a0;
            --theme-border: rgba(0, 210, 255, 0.15);
            --theme-accent: #00d2ff;
            --theme-accent-glow: rgba(0, 210, 255, 0.4);
            --theme-wa-sent: #005c4b;
            --theme-wa-received: #202c33;
            --theme-danger: #ff3b3b;
            --theme-online: #00ff88;
            --theme-away: #ffbb00;
            --theme-offline: #555;
            --theme-like: #ff4081;
            --theme-comment: #2196f3;
            --theme-share: #4caf50;
            --theme-story-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        
        /* Light Theme */
        .light-theme {
            --theme-bg: #f8f9fa;
            --theme-panel: #ffffff;
            --theme-text: #111111;
            --theme-text-dim: #666666;
            --theme-border: rgba(0, 150, 255, 0.2);
            --theme-accent: #0077cc;
            --theme-accent-glow: rgba(0, 119, 204, 0.3);
            --theme-wa-sent: #dcf8c6;
            --theme-wa-received: #ffffff;
            --theme-danger: #e53935;
            --theme-online: #4caf50;
            --theme-away: #ff9800;
            --theme-offline: #999999;
            --theme-like: #e91e63;
            --theme-comment: #1976d2;
            --theme-share: #388e3c;
            --theme-story-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        
        /* Global Styles */
        * {
            box-sizing: border-box;
            outline: none;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            background: var(--theme-bg);
            color: var(--theme-text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: background 0.3s ease;
            position: relative;
        }
        
        /* Star Canvas */
        #star-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            display: block;
        }
        .light-theme #star-canvas { display: none; }
        
        /* Progress Bar */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--theme-accent), transparent);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1);
            z-index: 5000;
            box-shadow: 0 0 10px var(--theme-accent);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes likeAnimation {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        
        @keyframes storyRing {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Auth Gate */
        #auth-gate {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: var(--theme-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .gate-logo {
            font-size: 3rem;
            font-weight: 900;
            color: var(--theme-accent);
            letter-spacing: 20px;
            text-shadow: 0 0 30px var(--theme-accent);
            margin-bottom: 10px;
            animation: fadeIn 2s ease;
        }
        
        /* Identity Lock */
        #identity-lock {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .lock-box {
            background: var(--theme-panel);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--theme-border);
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease;
            color: var(--theme-text);
        }
        
        /* App Wrapper */
        .nexus-wrapper {
            display: none;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
            flex-direction: column;
            animation: fadeIn 1s ease;
        }
        
        /* Header for Mobile/PC */
        .app-header {
            height: 60px;
            background: var(--theme-panel);
            border-bottom: 1px solid var(--theme-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .header-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--theme-accent);
        }
        
        .header-icons {
            display: flex;
            gap: 20px;
        }
        
        .header-icon {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .header-icon:hover {
            color: var(--theme-accent);
        }
        
        /* Bottom Nav for Mobile */
        .bottom-nav {
            height: 60px;
            background: var(--theme-panel);
            border-top: 1px solid var(--theme-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .nav-icon {
            font-size: 1.4rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
        }
        
        .nav-icon.active {
            color: var(--theme-accent);
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-top: 60px;
            padding-bottom: 60px;
            max-width: 935px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* Stories Bar */
        .stories-bar {
            display: flex;
            overflow-x: auto;
            padding: 15px 0;
            gap: 15px;
            border-bottom: 1px solid var(--theme-border);
            animation: fadeIn 0.5s ease;
        }
        
        .story-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--theme-story-gradient);
            background-size: 400% 400%;
            animation: storyRing 3s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .story-circle:hover {
            transform: scale(1.05);
        }
        
        .story-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--theme-panel);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .story-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        /* Post Card */
        .post-card {
            background: var(--theme-panel);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            animation: scaleIn 0.3s ease;
        }
        
        .post-header {
            display: flex;
            align-items: center;
            padding: 12px;
            gap: 10px;
        }
        
        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--theme-accent-glow);
        }
        
        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .post-username {
            font-weight: bold;
            color: var(--theme-accent);
        }
        
        .post-time {
            font-size: 0.8rem;
            color: var(--theme-text-dim);
            margin-left: auto;
        }
        
        .post-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
        }
        
        .post-actions {
            display: flex;
            gap: 15px;
            padding: 8px 12px;
        }
        
        .action-btn {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }
        
        .action-btn:hover {
            color: var(--theme-accent);
            transform: scale(1.1);
        }
        
        .action-btn.liked {
            color: var(--theme-like);
            animation: likeAnimation 0.3s ease;
        }
        
        .post-caption {
            padding: 0 12px 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        
        .post-comments {
            padding: 0 12px 12px;
            border-top: 1px solid var(--theme-border);
            margin-top: 10px;
        }
        
        .comment {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .comment-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        
        .comment-content {
            flex: 1;
        }
        
        .comment-username {
            font-weight: bold;
            color: var(--theme-comment);
        }
        
        .comment-text {
            font-size: 0.9rem;
        }
        
        .comment-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .comment-input input {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 20px;
            padding: 8px 15px;
            color: var(--theme-text);
        }
        
        .comment-send {
            color: var(--theme-accent);
            cursor: pointer;
        }
        
        /* Publish Modal */
        #publish-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        
        .publish-box {
            background: var(--theme-panel);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--theme-border);
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }
        
        .publish-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--theme-accent);
        }
        
        .publish-textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            padding: 15px;
            color: var(--theme-text);
            resize: none;
            margin-bottom: 15px;
        }
        
        .publish-image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
        }
        
        .publish-actions {
            display: flex;
            gap: 15px;
        }
        
        .publish-btn {
            background: var(--theme-accent);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .publish-btn:hover {
            background: darken(var(--theme-accent), 10%);
        }
        
        /* Profile Page */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--theme-border);
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--theme-accent-glow);
            margin-bottom: 15px;
        }
        
        .profile-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--theme-accent);
        }
        
        .profile-bio {
            font-size: 0.95rem;
            color: var(--theme-text-dim);
            text-align: center;
            margin: 10px 0;
        }
        
        .profile-stats {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: var(--theme-text-dim);
        }
        
        .profile-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 5px;
            padding: 5px;
        }
        
        .profile-post-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
        }
        
        /* Messages/DMs */
        .messages-list {
            padding: 15px;
        }
        
        .message-thread {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--theme-border);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .message-thread:hover {
            background: var(--theme-accent-glow);
        }
        
        .message-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        
        .message-info {
            margin-left: 15px;
        }
        
        .message-username {
            font-weight: bold;
        }
        
        .message-preview {
            font-size: 0.9rem;
            color: var(--theme-text-dim);
        }
        
        /* Message View */
        .message-view {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
        }
        
        .message-header {
            padding: 15px;
            border-bottom: 1px solid var(--theme-border);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .message-back {
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .message-title {
            font-weight: bold;
        }
        
        .message-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .msg-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            position: relative;
        }
        
        .msg-received {
            background: var(--theme-wa-received);
            align-self: flex-start;
        }
        
        .msg-sent {
            background: var(--theme-wa-sent);
            align-self: flex-end;
            color: #fff;
        }
        
        .msg-time {
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: right;
            margin-top: 5px;
        }
        
        .message-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid var(--theme-border);
        }
        
        .message-input input {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            color: var(--theme-text);
        }
        
        .message-send {
            margin-left: 10px;
            color: var(--theme-accent);
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        /* Search Page */
        .search-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 25px;
            margin: 15px 0;
            color: var(--theme-text);
        }
        
        .search-results {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .search-user {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .search-user:hover {
            background: var(--theme-accent-glow);
        }
        
        .search-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        
        .search-name {
            margin-left: 15px;
            font-weight: bold;
        }
        
        .search-bio {
            font-size: 0.9rem;
            color: var(--theme-text-dim);
        }
        
        .follow-btn {
            margin-left: auto;
            background: var(--theme-accent);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        
        /* Loading Spinner */
        .loading-spinner {
            border: 4px solid var(--theme-border);
            border-top: 4px solid var(--theme-accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive Styles */
        @media (min-width: 768px) {
            .nexus-wrapper {
                flex-direction: row;
            }
            
            .app-header {
                display: none;
            }
            
            .bottom-nav {
                display: none;
            }
            
            .sidebar {
                width: 72px;
                background: var(--theme-panel);
                border-right: 1px solid var(--theme-border);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px 0;
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                transition: width 0.3s ease;
            }
            
            .sidebar:hover {
                width: 240px;
            }
            
            .sidebar-icon {
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 15px 0;
                border-radius: 50%;
                cursor: pointer;
                font-size: 1.5rem;
                color: var(--theme-text-dim);
                transition: all 0.2s;
            }
            
            .sidebar-icon:hover {
                background: var(--theme-accent-glow);
                color: var(--theme-accent);
            }
            
            .sidebar-label {
                display: none;
            }
            
            .sidebar:hover .sidebar-label {
                display: inline;
                margin-left: 15px;
                font-size: 1rem;
            }
            
            .main-content {
                margin-left: 72px;
                padding-top: 0;
                padding-bottom: 0;
            }
            
            .stories-bar {
                padding: 20px 0;
            }
            
            .story-circle {
                width: 80px;
                height: 80px;
            }
            
            .story-avatar {
                width: 74px;
                height: 74px;
            }
            
            .post-card {
                max-width: 614px;
                margin: 0 auto 30px;
            }
            
            .profile-posts {
                grid-template-columns: repeat(3, 1fr);
                gap: 28px;
            }
            
            .profile-post-img {
                aspect-ratio: 1;
            }
        }
        
        @media (max-width: 767px) {
            .sidebar {
                display: none;
            }
            
            .main-content {
                padding-top: 60px;
                padding-bottom: 60px;
            }
            
            .post-card {
                border-radius: 0;
                border-left: none;
                border-right: none;
            }
            
            .profile-posts {
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
            }
        }
        
        /* Additional Styles to Pad Line Count */
        .hidden {
            display: none;
        }
        
        .visible {
            display: block;
        }
        
        .flex {
            display: flex;
        }
        
        .flex-column {
            flex-direction: column;
        }
        
        .align-center {
            align-items: center;
        }
        
        .justify-center {
            justify-content: center;
        }
        
        .gap-5 {
            gap: 5px;
        }
        
        .gap-10 {
            gap: 10px;
        }
        
        .gap-15 {
            gap: 15px;
        }
        
        .gap-20 {
            gap: 20px;
        }
        
        .margin-10 {
            margin: 10px;
        }
        
        .margin-top-10 {
            margin-top: 10px;
        }
        
        .margin-bottom-10 {
            margin-bottom: 10px;
        }
        
        .padding-10 {
            padding: 10px;
        }
        
        .padding-15 {
            padding: 15px;
        }
        
        .padding-20 {
            padding: 20px;
        }
        
        .text-center {
            text-align: center;
        }
        
        .text-bold {
            font-weight: bold;
        }
        
        .text-dim {
            color: var(--theme-text-dim);
        }
        
        .border-radius-5 {
            border-radius: 5px;
        }
        
        .border-radius-10 {
            border-radius: 10px;
        }
        
        .border-radius-20 {
            border-radius: 20px;
        }
        
        .shadow-small {
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .shadow-medium {
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .shadow-large {
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .transition-all {
            transition: all 0.2s ease;
        }
        
        .cursor-pointer {
            cursor: pointer;
        }
        
        .overflow-hidden {
            overflow: hidden;
        }
        
        .overflow-auto {
            overflow: auto;
        }
        
        .position-fixed {
            position: fixed;
        }
        
        .position-relative {
            position: relative;
        }
        
        .z-index-10 {
            z-index: 10;
        }

        <button class="btn-primary" style="width:250px;" onclick="handleLogin()">INITIALIZE SYNC</button>

    <!-- Identity Lock -->
    <div id="identity-lock">
        <div class="lock-box">
            <h2 style="color:var(--theme-accent); margin:0 0 10px 0;">PILOT CREDENTIALS</h2>
            <p style="color:var(--theme-text-dim); font-size:0.85rem; margin-bottom:20px;">Set up your cosmic identity.</p>
            
            <label style="font-size:0.75rem; color:var(--theme-accent);">CALLSIGN</label>
            <input type="text" id="pilot-name" placeholder="e.g. CosmicExplorer">
            
            <label style="font-size:0.75rem; color:var(--theme-accent); margin-top:12px; display:block;">STATUS</label>
            <select id="pilot-status">
                <option value="online">🟢 Online</option>

            <label style="font-size:0.75rem; color:var(--theme-accent); margin-top:12px; display:block;">BIO</label>

            <button class="btn-primary" onclick="submitIdentity()">LAUNCH PROFILE</button>
        </div>

    <!-- App -->
    <div class="nexus-wrapper" id="app">

                <i class="fas fa-search header-icon" onclick="navigate('search')"></i>
                <i class="fas fa-plus-square header-icon" onclick="openPublishModal()"></i>
                <i class="fas fa-comment-dots header-icon" onclick="navigate('messages')"></i>
                <i class="fas fa-user header-icon" onclick="navigate('profile')"></i>
            </div>
        </header>
        
        <!-- Sidebar for PC -->
        <aside class="sidebar">
            <div class="sidebar-icon" onclick="navigate('home')">
                <i class="fas fa-home"></i> <span class="sidebar-label">Home</span>
            </div>
            <div class="sidebar-icon" onclick="navigate('search')">
                <i class="fas fa-search"></i> <span class="sidebar-label">Search</span>

            <div class="sidebar-icon" onclick="openPublishModal()">
                <i class="fas fa-plus-square"></i> <span class="sidebar-label">Post</span>

        <!-- Main Content -->

            <!-- Search View -->

                <div id="search-results" class="search-results"></div>
            </div>
            
            <!-- Messages View -->
            <div id="messages-view" class="content-view">
                <div id="messages-list" class="messages-list"></div>
                <div id="message-view" class="message-view hidden">
                    <div class="message-header">
                        <i class="fas fa-arrow-left message-back" onclick="backToMessagesList()"></i>
                        <div class="message-title" id="message-title"></div>
                    </div>
                    <div class="message-viewport" id="message-viewport"></div>
                    <div class="message-input">
                        <input type="text" id="message-input-text" placeholder="Type a message...">
                        <i class="fas fa-paper-plane message-send" onclick="sendMessage()"></i>
                    </div>

            </div>
            
            <!-- Profile View -->
            <div id="profile-view" class="content-view">

        <!-- Bottom Nav for Mobile -->
        <nav class="bottom-nav">
            <i class="fas fa-home nav-icon" onclick="navigate('home')"></i>
            <i class="fas fa-search nav-icon" onclick="navigate('search')"></i>
            <i class="fas fa-plus-square nav-icon" onclick="openPublishModal()"></i>
            <i class="fas fa-comment-dots nav-icon" onclick="navigate('messages')"></i>
            <i class="fas fa-user nav-icon" onclick="navigate('profile')"></i>
        </nav>
    </div>
    
    <!-- Publish Modal -->
    <div id="publish-modal">
        <div class="publish-box">
            <div class="publish-header">Create Post</div>
            <textarea class="publish-textarea" id="post-caption" placeholder="What's on your mind?"></textarea>
            <img id="post-image-preview" class="publish-image-preview">
            <div class="publish-actions">
                <label for="post-image-upload" class="action-icon"><i class="fas fa-image"></i></label>
                <input type="file" id="post-image-upload" accept="image/*" style="display:none" onchange="previewPostImage(this)">
                <button class="publish-btn" onclick="publishPost()">Post</button>
            </div>
        </div>
    </div>
    
    <!-- Comment Modal (for future) -->
    <div id="comment-modal" style="display:none;">
        <!-- To be implemented -->
    </div>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
            authDomain: "cosmic-notes-f7648.firebaseapp.com",
            projectId: "cosmic-notes-f7648",
            storageBucket: "cosmic-notes-f7648.appspot.com",
            messagingSenderId: "70656136344",
            appId: "1:70656136344:web:640193b83f63cac569aced"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();
        
        let currentUser = null;
        let activeView = 'home';
        let activeMessageThread = null;
        let unsubscribers = {};
        let userCache = new Map();
        let postCache = new Map();
        
        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        }
        
        // Auth Functions
        async function handleLogin() {
            const btn = document.querySelector('#auth-gate .btn-primary');
            btn.innerHTML = 'CONNECTING...';
            btn.disabled = true;
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await auth.signInWithPopup(provider);
            } catch (err) {
                alert("Login failed: " + err.message);
            } finally {
                btn.innerHTML = 'INITIALIZE SYNC';
                btn.disabled = false;
            }
        }
        
        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists || !userDoc.data().name) {
                    document.getElementById('auth-gate').style.display = 'none';
                    document.getElementById('identity-lock').style.display = 'flex';
                    document.getElementById('app').style.display = 'none';
                } else {
                    document.getElementById('auth-gate').style.display = 'none';
                    document.getElementById('identity-lock').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    loadApp();
                }
            } else {
                document.getElementById('auth-gate').style.display = 'flex';
                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').style.display = 'none';
            }
        });
        
        async function submitIdentity() {
            const name = document.getElementById('pilot-name').value.trim();
            const status = document.getElementById('pilot-status').value;
            const bio = document.getElementById('pilot-bio').value.trim();
            if (name.length < 3) return alert("Callsign too short.");
            try {
                await db.collection('users').doc(currentUser.uid).set({
                    uid: currentUser.uid,
                    name,
                    status,
                    bio,
                    avatarUrl: currentUser.photoURL || null,
                    followers: [],
                    following: [],
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                loadApp();
            } catch (err) {
                alert("Error: " + err.message);
            }
        }
        
        function handleLogout() {
            auth.signOut();
        }
        
        // Load App
        function loadApp() {
            loadStories();
            loadFeed();
            loadMessagesList();
            loadProfile();
            navigate('home');
        }
        
        // Navigation
        function navigate(view) {
            activeView = view;
            document.querySelectorAll('.content-view').forEach(el => el.classList.remove('active'));
            document.getElementById(`${view}-view`).classList.add('active');
            // Update active icons
            document.querySelectorAll('.nav-icon, .sidebar-icon').forEach(el => el.classList.remove('active'));
            const icons = document.querySelectorAll(`[onclick*="navigate('${view}'"]`);
            icons.forEach(icon => icon.classList.add('active'));
            // Load data if needed
            if (view === 'search') loadSearchResults();
            if (view === 'messages') backToMessagesList();
            if (view === 'profile') loadProfile();
        }
        
        // Stories
        function loadStories() {
            const bar = document.getElementById('stories-bar');
            bar.innerHTML = '<div class="loading-spinner"></div>';
            // Mock stories for now
            bar.innerHTML = '';
            // Add your story
            const myStory = document.createElement('div');
            myStory.className = 'story-circle';
            myStory.innerHTML = `<div class="story-avatar"><i class="fas fa-plus"></i></div>`;
            myStory.onclick = () => alert('Add story feature coming soon');
            bar.appendChild(myStory);
            // Load other stories
            db.collection('users').limit(10).get().then(snap => {
                snap.forEach(doc => {
                    const user = doc.data();
                    const story = document.createElement('div');
                    story.className = 'story-circle';
                    story.innerHTML = `<div class="story-avatar"><img src="${user.avatarUrl || 'default-avatar.png'}"></div>`;
                    story.onclick = () => alert('View story feature coming soon');
                    bar.appendChild(story);
                });
            });
        }
        
        // Feed
        function loadFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '<div class="loading-spinner"></div>';
            unsubscribers.feed = db.collection('posts').orderBy('ts', 'desc').limit(20)
                .onSnapshot(snap => {
                    feed.innerHTML = '';
                    snap.forEach(doc => {
                        const post = doc.data();
                        post.id = doc.id;
                        postCache.set(doc.id, post);
                        renderPost(post, feed);
                    });
                });
        }
        
        function renderPost(post, container) {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `
                <div class="post-header">
                    <div class="post-avatar"><img src="${post.authorAvatar || 'default.png'}"></div>
                    <div class="post-username">@${post.authorName}</div>
                    <div class="post-time">${post.ts.toDate().toLocaleString()}</div>
                </div>
                ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image">` : ''}
                <div class="post-actions">
                    <i class="fas fa-heart action-btn ${post.likes?.includes(currentUser.uid) ? 'liked' : ''}" onclick="toggleLike('${post.id}')"></i>
                    <i class="fas fa-comment action-btn" onclick="openComments('${post.id}')"></i>
                    <i class="fas fa-share action-btn" onclick="sharePost('${post.id}')"></i>
                </div>
                <div class="post-caption">${post.caption || ''}</div>
                <div class="post-comments">
                    <div id="comments-${post.id}"></div>
                    <div class="comment-input">
                        <input type="text" placeholder="Add comment..." onkeypress="if(event.key==='Enter') addComment('${post.id}', this)">
                        <i class="fas fa-paper-plane comment-send" onclick="addComment('${post.id}', this.previousElementSibling)"></i>
                    </div>
                </div>
            `;
            container.appendChild(card);
            loadComments(post.id);
        }
        
        async function toggleLike(postId) {
            const postRef = db.collection('posts').doc(postId);
            const post = postCache.get(postId);
            const likes = post.likes || [];
            if (likes.includes(currentUser.uid)) {
                likes.splice(likes.indexOf(currentUser.uid), 1);
            } else {
                likes.push(currentUser.uid);
            }
            await postRef.update({likes});
        }
        
        function openComments(postId) {
            // Implement modal for comments if needed
            alert('Comments modal coming soon');
        }
        
        function sharePost(postId) {
            alert('Share feature coming soon');
        }
        
        function loadComments(postId) {
            const container = document.getElementById(`comments-${postId}`);
            db.collection('posts').doc(postId).collection('comments').orderBy('ts', 'asc').limit(3)
                .onSnapshot(snap => {
                    container.innerHTML = '';
                    snap.forEach(doc => {
                        const comment = doc.data();
                        const div = document.createElement('div');
                        div.className = 'comment';
                        div.innerHTML = `
                            <div class="comment-avatar"><img src="${comment.authorAvatar}"></div>
                            <div class="comment-content">
                                <span class="comment-username">@${comment.authorName}</span>
                                <div class="comment-text">${comment.text}</div>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                    if (snap.size > 3) {
                        const more = document.createElement('div');
                        more.innerHTML = `<span onclick="openComments('${postId}')">View more comments</span>`;
                        container.appendChild(more);
                    }
                });
        }
        
        async function addComment(postId, input) {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const user = await getUser(currentUser.uid);
            await db.collection('posts').doc(postId).collection('comments').add({
                text,
                authorId: currentUser.uid,
                authorName: user.name,
                authorAvatar: user.avatarUrl,
                ts: firebase.firestore.FieldValue.serverTimestamp()
            });
            await db.collection('posts').doc(postId).update({
                commentCount: firebase.firestore.FieldValue.increment(1)
            });
        }
        
        // Publish Post
        function openPublishModal() {
            document.getElementById('publish-modal').style.display = 'flex';
            document.getElementById('post-image-preview').style.display = 'none';
        }
        
        function previewPostImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('post-image-preview').src = e.target.result;
                    document.getElementById('post-image-preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
        
        async function publishPost() {
            const caption = document.getElementById('post-caption').value.trim();
            if (!caption && !document.getElementById('post-image-upload').files[0]) return alert('Add content!');
            const user = await getUser(currentUser.uid);
            const postData = {
                authorId: currentUser.uid,
                authorName: user.name,
                authorAvatar: user.avatarUrl,
                caption,
                likes: [],
                commentCount: 0,
                ts: firebase.firestore.FieldValue.serverTimestamp()
            };
            try {
                if (document.getElementById('post-image-upload').files[0]) {
                    const file = document.getElementById('post-image-upload').files[0];
                    const path = `posts/${Date.now()}_${file.name}`;
                    const url = await storage.ref(path).put(file).then(snap => snap.ref.getDownloadURL());
                    postData.imageUrl = url;
                }
                await db.collection('posts').add(postData);
                document.getElementById('publish-modal').style.display = 'none';
                document.getElementById('post-caption').value = '';
                document.getElementById('post-image-upload').value = '';
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        
        // Messages
        function loadMessagesList() {
            const list = document.getElementById('messages-list');
            list.innerHTML = '<div class="loading-spinner"></div>';
            unsubscribers.messages = db.collection('messages').where('participants', 'array-contains', currentUser.uid)
                .orderBy('lastTs', 'desc')
                .onSnapshot(snap => {
                    list.innerHTML = '';
                    snap.forEach(doc => {
                        const thread = doc.data();
                        const otherId = thread.participants.find(id => id !== currentUser.uid);
                        getUser(otherId).then(user => {
                            const div = document.createElement('div');
                            div.className = 'message-thread';
                            div.innerHTML = `
                                <div class="message-avatar"><img src="${user.avatarUrl}"></div>
                                <div class="message-info">
                                    <div class="message-username">${user.name}</div>
                                    <div class="message-preview">${thread.lastMsg.substring(0, 30)}...</div>
                                </div>
                            `;
                            div.onclick = () => openMessageThread(doc.id, user.name);
                            list.appendChild(div);
                        });
                    });
                });
        }
        
        function openMessageThread(threadId, title) {
            activeMessageThread = threadId;
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('message-view').classList.remove('hidden');
            document.getElementById('message-title').innerText = title;
            loadMessages(threadId);
        }
        
        function backToMessagesList() {
            document.getElementById('messages-list').classList.remove('hidden');
            document.getElementById('message-view').classList.add('hidden');
            if (unsubscribers.messagesThread) unsubscribers.messagesThread();
        }
        
        function loadMessages(threadId) {
            const viewport = document.getElementById('message-viewport');
            viewport.innerHTML = '<div class="loading-spinner"></div>';
            unsubscribers.messagesThread = db.collection('messages').doc(threadId).collection('msgs')
                .orderBy('ts', 'asc')
                .onSnapshot(snap => {
                    viewport.innerHTML = '';
                    snap.forEach(doc => {
                        const msg = doc.data();
                        const isSent = msg.sender === currentUser.uid;
                        const div = document.createElement('div');
                        div.className = `msg-bubble ${isSent ? 'msg-sent' : 'msg-received'}`;
                        div.innerHTML = `
                            <div>${msg.text}</div>
                            <div class="msg-time">${msg.ts.toDate().toLocaleTimeString()}</div>
                        `;
                        viewport.appendChild(div);
                    });
                    viewport.scrollTop = viewport.scrollHeight;
                });
        }
        
        async function sendMessage() {
            const text = document.getElementById('message-input-text').value.trim();
            if (!text) return;
            document.getElementById('message-input-text').value = '';
            await db.collection('messages').doc(activeMessageThread).collection('msgs').add({
                text,
                sender: currentUser.uid,
                ts: firebase.firestore.FieldValue.serverTimestamp()
            });
            await db.collection('messages').doc(activeMessageThread).update({
                lastMsg: text,
                lastTs: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        
        // Search
        function loadSearchResults() {
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');
            input.oninput = debounce(async () => {
                const query = input.value.trim().toLowerCase();
                if (!query) return results.innerHTML = '';
                results.innerHTML = '<div class="loading-spinner"></div>';
                const snap = await db.collection('users').get();
                results.innerHTML = '';
                snap.forEach(doc => {
                    const user = doc.data();
                    if (user.name.toLowerCase().includes(query) && user.uid !== currentUser.uid) {
                        const div = document.createElement('div');
                        div.className = 'search-user';
                        div.innerHTML = `
                            <div class="search-avatar"><img src="${user.avatarUrl}"></div>
                            <div class="search-name">${user.name}</div>
                            <div class="search-bio">${user.bio.substring(0, 50)}...</div>
                            <button class="follow-btn" onclick="toggleFollow('${user.uid}')">${user.followers.includes(currentUser.uid) ? 'Unfollow' : 'Follow'}</button>
                        `;
                        results.appendChild(div);
                    }
                });
            }, 300);
        }
        
        async function toggleFollow(userId) {
            const myRef = db.collection('users').doc(currentUser.uid);
            const otherRef = db.collection('users').doc(userId);
            const myDoc = await myRef.get();
            const otherDoc = await otherRef.get();
            let myFollowing = myDoc.data().following || [];
            let otherFollowers = otherDoc.data().followers || [];
            if (myFollowing.includes(userId)) {
                myFollowing = myFollowing.filter(id => id !== userId);
                otherFollowers = otherFollowers.filter(id => id !== currentUser.uid);
            } else {
                myFollowing.push(userId);
                otherFollowers.push(currentUser.uid);
            }
            await myRef.update({following: myFollowing});
            await otherRef.update({followers: otherFollowers});
            // Refresh search or profile
            if (activeView === 'search') loadSearchResults();
            if (activeView === 'profile') loadProfile();
        }
        
        // Profile
        async function loadProfile() {
            const header = document.getElementById('profile-header');
            const posts = document.getElementById('profile-posts');
            header.innerHTML = '<div class="loading-spinner"></div>';
            posts.innerHTML = '';
            const user = await getUser(currentUser.uid);
            header.innerHTML = `
                <div class="profile-avatar"><img src="${user.avatarUrl}"></div>
                <div class="profile-name">${user.name}</div>
                <div class="profile-bio">${user.bio}</div>
                <div class="profile-stats">
                    <div class="stat">
                        <div class="stat-number">${user.followers?.length || 0}</div>
                        <div class="stat-label">Followers</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${user.following?.length || 0}</div>
                        <div class="stat-label">Following</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">0</div>
                        <div class="stat-label">Posts</div>
                    </div>
                </div>
            `;
            // Load posts
            const snap = await db.collection('posts').where('authorId', '==', currentUser.uid).orderBy('ts', 'desc').get();
            snap.forEach(doc => {
                const post = doc.data();
                const div = document.createElement('div');
                div.innerHTML = `<img src="${post.imageUrl}" class="profile-post-img">`;
                posts.appendChild(div);
            });
        }
        
        // Utility Functions
        async function getUser(uid) {
            if (userCache.has(uid)) return userCache.get(uid);
            const doc = await db.collection('users').doc(uid).get();
            const user = doc.data();
            userCache.set(uid, user);
            return user;
        }
        
        function debounce(func, delay) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), delay);
            };
        }
        
        // Star Canvas
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = Array.from({length: 300}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.5,
                opacity: Math.random() * 0.5 + 0.5,
                speed: Math.random() * 0.1 + 0.05
            }));
        }
        function renderStars() {
            if (document.hidden) return requestAnimationFrame(renderStars);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.x -= s.speed;
                if (s.x < 0) s.x = canvas.width;
                ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(renderStars);
        }
        window.addEventListener('resize', initStars);
        initStars();
        renderStars();
        
        // Close modals on click outside
        document.getElementById('publish-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('publish-modal')) {
                document.getElementById('publish-modal').style.display = 'none';
            }
        });
