                    if (matches.length === 0) {
                        results.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No users found</p></div>';
                        return;
                    }
                    
                    matches.forEach(user => {
                        const isFollowing = (user.followers || []).includes(currentUser.uid);
                        const card = document.createElement('div');
                        card.className = 'search-user';
                        card.innerHTML = `
                            <div class="search-avatar"><img src="${user.avatar}" alt="${user.name}"></div>
                            <div class="search-user-info">
                                <span class="search-name">${user.name}</span>
                                <span class="search-bio">${user.bio || 'No bio'}</span>
                            </div>
                            <button class="follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${user.id}')">${isFollowing ? 'Following' : 'Follow'}</button>
                            <i class="fas fa-message message-action" onclick="startMessage('${user.id}')" title="Message"></i>
                        `;
                        results.appendChild(card);
                    });
                } catch (err) {
                    console.error('Search error:', err);
                    results.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error searching</p></div>';
                }
            }, 300));
        }
        
        async function toggleFollow(uid) {
            try {
                const userRef = db.collection('users').doc(currentUser.uid);
                const otherRef = db.collection('users').doc(uid);
                
                const userDoc = await userRef.get();
                const otherDoc = await otherRef.get();
                
                if (!userDoc.exists || !otherDoc.exists) return;
                
                let following = userDoc.data().following || [];
                let followers = otherDoc.data().followers || [];
                
                if (following.includes(uid)) {
                    following = following.filter(id => id !== uid);
                    followers = followers.filter(id => id !== currentUser.uid);
                } else {
                    following.push(uid);
                    followers.push(currentUser.uid);
                }
                
                await userRef.update({ following });
                await otherRef.update({ followers });
                userCache.clear();
                
                document.querySelectorAll('.search-user').forEach(el => {
                    if (el.innerHTML.includes(`toggleFollow('${uid}')`)) {
                        const btn = el.querySelector('.follow-btn');
                        if (btn) {
                            btn.textContent = following.includes(uid) ? 'Following' : 'Follow';
                            btn.classList.toggle('following');
                        }
                    }
                });
                
                loadStories();
            } catch (err) {
                console.error('Error toggling follow:', err);
                showError('Error updating follow');
            }
        }
        
        // ==================== MESSAGES ====================
        
        let messagesUnsubscribe = null;
        let messageUnsubscribe = null;
        
        async function loadMessages() {
            try {
                const list = document.getElementById('messages-list');
                list.innerHTML = '<div class="loading-spinner"></div>';
                
                if (messagesUnsubscribe) messagesUnsubscribe();
                
                messagesUnsubscribe = db.collection('conversations')
                    .where('participants', 'array-contains', currentUser.uid)
                    .orderBy('lastMessageTime', 'desc')
                    .onSnapshot(
                        snapshot => {
                            list.innerHTML = '';
                            if (snapshot.empty) {
                                list.innerHTML = '<div class="messages-empty"><i class="fas fa-inbox"></i><p>No conversations yet</p></div>';
                                return;
                            }
                            snapshot.forEach(doc => {
                                const conv = doc.data();
                                const otherUid = conv.participants.find(id => id !== currentUser.uid);
                                getUser(otherUid).then(user => {
                                    if (user) {
                                        const thread = document.createElement('div');
                                        thread.className = 'message-thread';
                                        thread.innerHTML = `
                                            <div class="message-avatar"><img src="${user.avatar}" alt="${user.name}"></div>
                                            <div class="message-info">
                                                <span class="message-username">${user.name}</span>
                                                <span class="message-preview">${conv.lastMessage || 'No messages yet'}</span>
                                            </div>
                                        `;
                                        thread.onclick = () => openMessageThread(doc.id, user);
                                        list.appendChild(thread);
                                    }
                                }).catch(err => console.error('Error getting user:', err));
                            });
                        },
                        err => {
                            console.error('Messages error:', err);
                            list.innerHTML = '<div class="messages-empty"><i class="fas fa-exclamation-triangle"></i><p>Error loading messages</p></div>';
                        }
                    );
            } catch (err) {
                console.error('Error in loadMessages:', err);
            }
        }
        
        function openMessageThread(convId, user) {
            try {
                activeMessageThread = convId;
                currentMessageUser = user;
                document.getElementById('messages-list').classList.add('hidden');
                document.getElementById('message-view').classList.remove('hidden');
                document.getElementById('message-title').textContent = user.name;
                document.getElementById('message-input-text').value = '';
                
                const viewport = document.getElementById('message-viewport');
                viewport.innerHTML = '<div class="loading-spinner"></div>';
                
                if (messageUnsubscribe) messageUnsubscribe();
                
                messageUnsubscribe = db.collection('conversations')
                    .doc(convId)
                    .collection('messages')
                    .orderBy('createdAt', 'asc')
                    .onSnapshot(
                        snapshot => {
                            if (viewport.querySelector('.loading-spinner')) {
                                viewport.innerHTML = '';
                            }
                            
                            snapshot.docChanges().forEach(change => {
                                if (change.type === 'added') {
                                    const msg = change.doc.data();
                                    const bubble = document.createElement('div');
                                    bubble.className = `msg-bubble ${msg.userId === currentUser.uid ? 'msg-sent' : 'msg-received'}`;
                                    bubble.innerHTML = `
                                        ${msg.text}
                                        <div class="msg-time">${formatTime(msg.createdAt)}</div>
                                    `;
                                    viewport.appendChild(bubble);
                                }
                            });
                            
                            viewport.scrollTop = viewport.scrollHeight;
                        },
                        err => {
                            console.error('Message thread error:', err);
                            viewport.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading messages</p></div>';
                        }
                    );
            } catch (err) {
                console.error('Error opening message thread:', err);
                showError('Error opening conversation');
            }
        }
        
        function backToMessagesList() {
            document.getElementById('messages-list').classList.remove('hidden');
            document.getElementById('message-view').classList.add('hidden');
            activeMessageThread = null;
            currentMessageUser = null;
            if (messageUnsubscribe) messageUnsubscribe();
        }
        
        async function sendMessage() {
            try {
                const input = document.getElementById('message-input-text');
                const text = input.value.trim();
                if (!text || !activeMessageThread) return;
                
                const convRef = db.collection('conversations').doc(activeMessageThread);
                await convRef.collection('messages').add({
                    userId: currentUser.uid,
                    text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                await convRef.update({
                    lastMessage: text,
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                input.value = '';
            } catch (err) {
                console.error('Error sending message:', err);
                showError('Error sending message');
            }
        }
        
        async function startMessage(uid) {
            try {
                navigate('messages');
                
                const participants = [currentUser.uid, uid].sort();
                const convId = participants.join('-');
                
                const convRef = db.collection('conversations').doc(convId);
                const convDoc = await convRef.get();
                
                if (!convDoc.exists) {
                    await convRef.set({
                        participants,
                        lastMessage: '',
                        lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                const user = await getUser(uid);
                if (user) {
                    setTimeout(() => openMessageThread(convId, user), 100);
                }
            } catch (err) {
                console.error('Error starting message:', err);
                showError('Error starting conversation');
            }
        }
        
        // ==================== PROFILE ====================
        
        async function loadProfile() {
            try {
                const user = await getUser(currentUser.uid);
                if (!user) return;
                
                const postCount = (await db.collection('posts').where('userId', '==', currentUser.uid).get()).size;
                
                const header = document.getElementById('profile-header');
                header.innerHTML = `
                    <div class="profile-avatar"><img src="${user.avatar}" alt="${user.name}"></div>
                    <span class="profile-name">${user.name}</span>
                    <span class="profile-bio">${user.bio}</span>
                    <div class="profile-stats">
                        <div class="stat"><span class="stat-number">${(user.followers || []).length}</span><span class="stat-label">Followers</span></div>
                        <div class="stat"><span class="stat-number">${(user.following || []).length}</span><span class="stat-label">Following</span></div>
                        <div class="stat"><span class="stat-number">${postCount}</span><span class="stat-label">Posts</span></div>
                    </div>
                `;
                
                const postsDiv = document.getElementById('profile-posts');
                postsDiv.innerHTML = '';
                
                const snapshot = await db.collection('posts')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();
                
                if (snapshot.empty) {
                    postsDiv.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;"><i class="fas fa-images"></i><p>No posts yet</p></div>';
                    return;
                }
                
                snapshot.forEach(doc => {
                    const post = doc.data();
                    if (post.image) {
                        const img = document.createElement('img');
                        img.className = 'profile-post-img';
                        img.src = post.image;
                        img.alt = 'post';
                        postsDiv.appendChild(img);
                    }
                });
            } catch (err) {
                console.error('Error loading profile:', err);
                showError('Error loading profile');
            }
        }
        
        // ==================== STAR CANVAS ====================
        
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        
        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = Array.from({ length: 100 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                opacity: Math.random() * 0.5 + 0.5
            }));
        }
        
        function renderStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(renderStars);
        }
        
        window.addEventListener('resize', initStars);
        initStars();
        renderStars();
        
        // ==================== APP INITIALIZATION ====================
        
        function loadApp() {
            loadStories();
            loadFeed();
        }
        
        // Prevent double tap zoom on mobile
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        });
    </script>
</body>
</html>
