
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Gram | Cosmic Social Network</title>
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==================== ROOT VARIABLES ==================== */
        :root {
            --theme-bg: #03030b;
            --theme-panel: rgba(10, 10, 18, 0.98);
            --theme-panel-hover: rgba(15, 15, 25, 0.99);
            --theme-text: #f0f0f0;
            --theme-text-dim: #a0a0a0;
            --theme-text-lighter: #d0d0d0;
            --theme-border: rgba(0, 210, 255, 0.15);
            --theme-border-light: rgba(0, 210, 255, 0.08);
            --theme-accent: #00d2ff;
            --theme-accent-dark: #00b2df;
            --theme-accent-darker: #0096b8;
            --theme-accent-glow: rgba(0, 210, 255, 0.4);
            --theme-danger: #ff3b3b;
            --theme-success: #00ff88;
            --theme-warning: #ffbb00;
            --theme-like: #ff4081;
            --theme-comment: #2196f3;
            --theme-share: #4caf50;
            --theme-story-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --theme-gradient-accent: linear-gradient(135deg, #00d2ff, #0096b8);
            --theme-gradient-danger: linear-gradient(135deg, #ff3b3b, #ff1744);
            --theme-shadow: 0 4px 12px rgba(0,0,0,0.3);
            --theme-shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
            --theme-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .light-theme {
            --theme-bg: #f8f9fa;
            --theme-panel: #ffffff;
            --theme-panel-hover: #f5f5f5;
            --theme-text: #111111;
            --theme-text-dim: #666666;
            --theme-text-lighter: #444444;
            --theme-border: rgba(0, 150, 255, 0.2);
            --theme-border-light: rgba(0, 150, 255, 0.1);
            --theme-accent: #0077cc;
            --theme-accent-dark: #005fa3;
            --theme-accent-darker: #004080;
            --theme-accent-glow: rgba(0, 119, 204, 0.3);
            --theme-gradient-accent: linear-gradient(135deg, #0077cc, #004080);
        }
        
        /* ==================== GLOBAL STYLES ==================== */
        * {
            box-sizing: border-box;
            outline: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body, html {
            background: var(--theme-bg);
            color: var(--theme-text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        
        body {
            position: relative;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--theme-border);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--theme-accent);
        }
        
        /* ==================== ANIMATIONS ==================== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes slideLeft {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1.1); }
        }
        
        /* ==================== CANVAS BACKGROUND ==================== */
        #star-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        
        .light-theme #star-canvas {
            display: none;
        }
        
        /* ==================== AUTH GATE ==================== */
        #auth-gate {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: var(--theme-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            padding: 20px;
        }
        
        .gate-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        .gate-logo {
            font-size: 4rem;
            font-weight: 900;
            color: var(--theme-accent);
            letter-spacing: 20px;
            text-shadow: 0 0 30px var(--theme-accent), 0 0 60px rgba(0, 210, 255, 0.3);
            animation: pulse 2s infinite;
            text-transform: uppercase;
        }
        
        .gate-subtitle {
            color: var(--theme-text-dim);
            letter-spacing: 3px;
            font-size: 0.9rem;
            animation: slideUp 1s ease 0.2s both;
        }
        
        .gate-description {
            font-size: 1rem;
            color: var(--theme-text-lighter);
            max-width: 400px;
            line-height: 1.6;
            animation: slideUp 1s ease 0.4s both;
        }
        
        #login-btn {
            animation: slideUp 1s ease 0.6s both;
            min-width: 200px;
        }
        
        .error-msg {
            color: var(--theme-danger);
            font-size: 0.875rem;
            animation: slideUp 0.3s ease;
            max-width: 400px;
        }
        
        /* ==================== IDENTITY LOCK (SETUP) ==================== */
        #identity-lock {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .lock-box {
            background: var(--theme-panel);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--theme-border);
            max-width: 450px;
            width: 100%;
            box-shadow: var(--theme-shadow-lg);
            animation: slideUp 0.5s ease;
        }
        
        .lock-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .lock-header h2 {
            color: var(--theme-accent);
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }
        
        .lock-header p {
            color: var(--theme-text-dim);
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-label {
            font-size: 0.75rem;
            color: var(--theme-accent);
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0,0,0,0.05);
            border: 1.5px solid var(--theme-border);
            border-radius: 10px;
            color: var(--theme-text);
            font-size: 0.95rem;
            transition: var(--theme-transition);
        }
        
        .form-input:focus {
            border-color: var(--theme-accent);
            background: rgba(0, 210, 255, 0.03);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }
        
        .form-input::placeholder {
            color: var(--theme-text-dim);
        }
        
        /* ==================== MAIN APP WRAPPER ==================== */
        .nexus-wrapper {
            display: none;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
            flex-direction: row;
            animation: fadeIn 1s ease;
        }
        
        .nexus-wrapper.active {
            display: flex;
        }
        
        /* ==================== SIDEBAR ==================== */
        .sidebar {
            width: 72px;
            background: var(--theme-panel);
            border-right: 1px solid var(--theme-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 99;
            transition: var(--theme-transition);
            overflow-y: auto;
        }
        
        .sidebar:hover {
            width: 260px;
        }
        
        .sidebar-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.4rem;
            color: var(--theme-text-dim);
            transition: var(--theme-transition);
            position: relative;
            white-space: nowrap;
        }
        
        .sidebar-icon:hover, .sidebar-icon.active {
            background: var(--theme-accent-glow);
            color: var(--theme-accent);
            transform: translateX(3px);
        }
        
        .sidebar-icon.active::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 30px;
            background: var(--theme-accent);
            border-radius: 2px;
        }
        
        .sidebar-label {
            display: none;
            margin-left: 16px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .sidebar:hover .sidebar-label {
            display: inline;
        }
        
        .sidebar-divider {
            width: 80%;
            height: 1px;
            background: var(--theme-border);
            margin: 15px 0;
        }
        
        .sidebar-spacer {
            flex: 1;
        }
        
        /* ==================== HEADER (MOBILE) ==================== */
        .app-header {
            display: none;
            height: 60px;
            background: var(--theme-panel);
            border-bottom: 1px solid var(--theme-border);
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: var(--theme-shadow);
        }
        
        .header-logo {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--theme-gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        
        .header-icons {
            display: flex;
            gap: 16px;
        }
        
        .header-icon {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: var(--theme-transition);
            position: relative;
        }
        
        .header-icon:hover,
        .header-icon.active {
            color: var(--theme-accent);
            transform: scale(1.15);
        }
        
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--theme-danger);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-top: 0;
            padding-bottom: 0;
            margin-left: 72px;
            display: flex;
            flex-direction: column;
            background: var(--theme-bg);
        }
        
        .content-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 0;
        }
        
        .content-view {
            display: none;
            flex-direction: column;
            flex: 1;
            gap: 0;
            animation: fadeIn 0.3s ease;
        }
        
        .content-view.active {
            display: flex;
        }
        
        /* ==================== BOTTOM NAV (MOBILE) ==================== */
        .bottom-nav {
            display: none;
            height: 60px;
            background: var(--theme-panel);
            border-top: 1px solid var(--theme-border);
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .nav-icon {
            font-size: 1.3rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: var(--theme-transition);
            position: relative;
        }
        
        .nav-icon:hover,
        .nav-icon.active {
            color: var(--theme-accent);
            transform: scale(1.1);
        }
        
        /* ==================== HOME VIEW ==================== */
        #home-view {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        
        .stories-bar {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 16px 0;
            gap: 12px;
            border-bottom: 1px solid var(--theme-border);
            margin-bottom: 20px;
            scroll-behavior: smooth;
        }
        
        .stories-bar::-webkit-scrollbar {
            height: 4px;
        }
        
        .story-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--theme-story-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: var(--theme-transition);
            border: 2px solid transparent;
            box-shadow: var(--theme-shadow);
            position: relative;
            overflow: hidden;
        }
        
        .story-circle:hover {
            transform: scale(1.08);
            border-color: var(--theme-accent);
        }
        
        .story-circle.has-story::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid var(--theme-accent);
            animation: pulse 2s infinite;
        }
        
        .story-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--theme-panel);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .story-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        
        /* ==================== POST CARD ==================== */
        .post-card {
            background: var(--theme-panel);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            overflow: hidden;
            animation: scaleIn 0.3s ease;
            box-shadow: var(--theme-shadow);
            transition: var(--theme-transition);
        }
        
        .post-card:hover {
            border-color: var(--theme-accent);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
        }
        
        .post-header {
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 12px;
            border-bottom: 1px solid var(--theme-border-light);
        }
        
        .post-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--theme-accent);
            cursor: pointer;
            transition: var(--theme-transition);
        }
        
        .post-avatar:hover {
            transform: scale(1.05);
        }
        
        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .post-user-info {
            flex: 1;
            min-width: 0;
        }
        
        .post-username {
            font-weight: 600;
            color: var(--theme-accent);
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--theme-transition);
        }
        
        .post-username:hover {
            text-decoration: underline;
        }
        
        .post-time {
            font-size: 0.8rem;
            color: var(--theme-text-dim);
        }
        
        .post-menu {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: var(--theme-transition);
            padding: 8px;
            border-radius: 6px;
        }
        
        .post-menu:hover {
            color: var(--theme-accent);
            background: var(--theme-accent-glow);
        }
        
        .post-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            display: block;
        }
        
        .post-actions {
            display: flex;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--theme-border-light);
        }
        
        .action-btn {
            font-size: 1.2rem;
            color: var(--theme-text-dim);
            cursor: pointer;
            transition: var(--theme-transition);
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        .action-btn:hover {
            color: var(--theme-accent);
            background: var(--theme-accent-glow);
            transform: scale(1.05);
        }
        
        .action-btn.liked {
            color: var(--theme-like);
            animation: heartBeat 0.3s ease;
        }
        
        .action-count {
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .post-stats {
            padding: 8px 16px;
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--theme-text-dim);
            border-bottom: 1px solid var(--theme-border-light);
        }
        
        .stat-item {
            cursor: pointer;
            transition: var(--theme-transition);
        }
        
        .stat-item:hover {
            color: var(--theme-accent);
        }
        
        .post-caption {
            padding: 12px 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--theme-text);
        }
        
        .caption-user {
            font-weight: 600;
            color: var(--theme-accent);
        }
        
        .post-comments {
            padding: 8px 16px;
            max-height: 200px;
            overflow-y: auto;
            border-bottom: 1px solid var(--theme-border-light);
        }
        
        .post-comments.empty {
            display: none;
        }
        
        .comment {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            animation: slideUp 0.3s ease;
        }
        
        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .comment-content {
            flex: 1;
            background: rgba(0,0,0,0.1);
            border-radius: 12px;
            padding: 8px 12px;
        }
        
        .comment-header {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .comment-username {
            font-weight: 600;
            color: var(--theme-accent);
            font-size: 0.8rem;
        }
        
        .comment-text {
            font-size: 0.8rem;
            line-height: 1.4;
        }
        
        .comment-action {
            font-size: 0.75rem;
            color: var(--theme-text-dim);
            margin-top: 4px;
            cursor: pointer;
        }
        
        .comment-input {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            align-items: flex-end;
        }
        
        .comment-input-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .comment-input-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .comment-input-field {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .comment-input input {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border: 1px solid var(--theme-border);
            border-radius: 20px;
            padding: 8px 14px;
            color: var(--theme-text);
            font-size: 0.85rem;
            transition: var(--theme-transition);
        }
        
        .comment-input input:focus {
            border-color: var(--theme-accent);
            background: rgba(0, 210, 255, 0.02);
        }
        
        .comment-send {
            color: var(--theme-accent);
            cursor: pointer;
            font-size: 1.1rem;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            transition: var(--theme-transition);
        }
        
        .comment-send:hover {
            transform: scale(1.15);
            color: var(--theme-accent-dark);
        }
        
        /* ==================== PUBLISH MODAL ==================== */
        #publish-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }
        
        .publish-box {
            background: var(--theme-panel);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--theme-border);
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--theme-shadow-lg);
        }
        
        .publish-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .publish-header {
            font-size: 1.4rem;
            font-weight: 700;
            background: var(--theme-gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: var(--theme-text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--theme-transition);
            width: 40px;
            height: 40px;
            border-radius: 8px;
        }
        
        .close-btn:hover {
            color: var(--theme-accent);
            background: var(--theme-accent-glow);
        }
        
        .publish-textarea {
            width: 100%;
            height: 140px;
            background: rgba(0,0,0,0.05);
            border: 1.5px solid var(--theme-border);
            border-radius: 12px;
            padding: 16px;
            color: var(--theme-text);
            resize: vertical;
            margin-bottom: 16px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--theme-transition);
        }
        
        .publish-textarea:focus {
            border-color: var(--theme-accent);
            background: rgba(0, 210, 255, 0.02);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
        }
        
        .publish-textarea::placeholder {
            color: var(--theme-text-dim);
        }
        
        .publish-image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid var(--theme-border);
        }
        
        .publish-preview-container {
            margin-bottom: 16px;
        }
        
        .publish-actions {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .publish-file-label {
            cursor: pointer;
            color: var(--theme-accent);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--theme-transition);
            padding: 8px 12px;
            border-radius: 8px;
        }
        
        .publish-file-label:hover {
            color: var(--theme-accent-dark);
            background: var(--theme-accent-glow);
        }
        
        .publish-btn {
            background: var(--theme-gradient-accent);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--theme-transition);
            font-size: 0.95rem;
        }
        
        .publish-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .publish-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }
        
        /* ==================== SEARCH VIEW ==================== */
        #search-view {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        
        .search-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.05);
            border: 1.5px solid var(--theme-border);
            border-radius: 25px;
            margin-bottom: 24px;
            color: var(--theme-text);
            font-size: 1rem;
            transition: var(--theme-transition);
        }
        
        .search-input:focus {
            border-color: var(--theme-accent);
            background: rgba(0, 210, 255, 0.02);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
        }
        
        .search-input::placeholder {
            color: var(--theme-text-dim);
        }
        
        .search-results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .search-user {
            display: flex;
            align-items: center;
            padding: 14px;
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--theme-transition);
            background: var(--theme-panel);
        }
        
        .search-user:hover {
            background: var(--theme-panel-hover);
            border-color: var(--theme-accent);
            transform: translateX(3px);
        }
        
        .search-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 14px;
            flex-shrink: 0;
            border: 2px solid var(--theme-accent);
        }
        
        .search-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .search-user-info {
            flex: 1;
            min-width: 0;
        }
        
        .search-name {
            font-weight: 600;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 4px;
        }
        
        .search-bio {
            font-size: 0.8rem;
            color: var(--theme-text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .follow-btn {
            background: var(--theme-gradient-accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--theme-transition);
            border: none;
            margin-left: auto;
            margin-right: 8px;
            font-weight: 600;
        }
        
        .follow-btn.following {
            background: transparent;
            border: 1.5px solid var(--theme-accent);
            color: var(--theme-accent);
        }
        
        .follow-btn:hover {
            transform: scale(1.05);
        }
        
        .follow-btn.following:hover {
            background: var(--theme-accent);
            color: #fff;
        }
        
        .message-action {
            cursor: pointer;
            color: var(--theme-comment);
            display: flex;
            align-items: center;
            margin-left: 8px;
            transition: var(--theme-transition);
            font-size: 1.1rem;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            justify-content: center;
        }
        
        .message-action:hover {
            color: var(--theme-accent);
            background: var(--theme-accent-glow);
        }
        
        /* ==================== MESSAGES VIEW ==================== */
        #messages-view {
            flex-direction: row;
            gap: 0;
        }
        
        .messages-list {
            width: 300px;
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid var(--theme-border);
            background: var(--theme-panel);
        }
        
        .message-thread {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--theme-border-light);
            cursor: pointer;
            transition: var(--theme-transition);
            border-radius: 8px;
            margin-bottom: 4px;
        }
        
        .message-thread:hover {
            background: var(--theme-panel-hover);
        }
        
        .message-thread.active {
            background: var(--theme-accent-glow);
            border-color: var(--theme-accent);
        }
        
        .message-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 12px;
            flex-shrink: 0;
            border: 2px solid var(--theme-accent);
        }
        
        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .message-info {
            flex: 1;
            min-width: 0;
        }
        
        .message-username {
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 4px;
        }
        
        .message-preview {
            font-size: 0.8rem;
            color: var(--theme-text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .messages-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--theme-text-dim);
            text-align: center;
            flex-direction: column;
            gap: 10px;
        }
        
        .messages-empty i {
            font-size: 2.5rem;
            opacity: 0.5;
        }
        
        .message-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            flex: 1;
            background: var(--theme-bg);
        }
        
        .message-view.hidden {
            display: none;
        }
        
        .message-header {
            padding: 16px;
            border-bottom: 1px solid var(--theme-border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--theme-panel);
        }
        
        .message-back {
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--theme-transition);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        
        .message-back:hover {
            color: var(--theme-accent);
            background: var(--theme-accent-glow);
        }
        
        .message-title {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .message-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }
        
        .msg-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.9rem;
            word-break: break-word;
            animation: slideUp 0.2s ease;
        }
        
        .msg-received {
            background: var(--theme-panel);
            align-self: flex-start;
            border: 1px solid var(--theme-border);
        }
        
        .msg-sent {
            background: var(--theme-gradient-accent);
            align-self: flex-end;
            color: #fff;
        }
        
        .msg-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
            margin-left: 10px;
        }
        
        .message-input {
            display: flex;
            padding: 16px;
            border-top: 1px solid var(--theme-border);
            gap: 8px;
            background: var(--theme-panel);
            align-items: flex-end;
        }
        
        .message-input input {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border: 1.5px solid var(--theme-border);
            border-radius: 20px;
            padding: 10px 14px;
            color: var(--theme-text);
            font-size: 0.9rem;
            transition: var(--theme-transition);
        }
        
        .message-input input:focus {
            border-color: var(--theme-accent);
            background: rgba(0, 210, 255, 0.02);
        }
        
        .message-send {
            color: var(--theme-accent);
            cursor: pointer;
            font-size: 1.2rem;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            width: 40px;
            height: 40px;
            justify-content: center;
            border-radius: 8px;
            transition: var(--theme-transition);
        }
        
        .message-send:hover {
            background: var(--theme-accent-glow);
            color: var(--theme-accent-dark);
            transform: scale(1.1);
        }
        
        /* ==================== PROFILE VIEW ==================== */
        #profile-view {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            background: var(--theme-panel);
            border: 1px solid var(--theme-border);
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: var(--theme-shadow);
        }
        
        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin-bottom: 20px;
            overflow: hidden;
            border: 4px solid var(--theme-gradient-accent);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
            animation: scaleIn 0.4s ease;
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--theme-accent);
            margin-bottom: 8px;
        }
        
        .profile-bio {
            font-size: 0.95rem;
            color: var(--theme-text-lighter);
            text-align: center;
            margin-bottom: 20px;
            max-width: 500px;
            line-height: 1.5;
        }
        
        .profile-stats {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--theme-accent);
            display: block;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--theme-text-dim);
            margin-top: 5px;
        }
        
        .profile-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            padding: 0;
        }
        
        .profile-post-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--theme-transition);
            border: 1px solid var(--theme-border);
        }
        
        .profile-post-img:hover {
            transform: scale(1.05);
            border-color: var(--theme-accent);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--theme-text-dim);
            animation: slideUp 0.4s ease;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .empty-state p {
            font-size: 1rem;
            line-height: 1.6;
        }
        
        /* ==================== UTILITY CLASSES ==================== */
        .loading-spinner {
            border: 3px solid var(--theme-border);
            border-top: 3px solid var(--theme-accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        
        .hidden {
            display: none !important;
        }
        
        .btn-primary {
            background: var(--theme-gradient-accent);
            color: #fff;
            padding: 12px 28px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--theme-transition);
            font-size: 0.95rem;
            width: 100%;
            max-width: 250px;
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }
        
        .tooltip {
            position: absolute;
            background: var(--theme-panel);
            border: 1px solid var(--theme-border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            white-space: nowrap;
            z-index: 1000;
            pointer-events: none;
            animation: slideUp 0.2s ease;
        }
        
        /* ==================== RESPONSIVE DESIGN ==================== */
        @media (max-width: 1200px) {
            .sidebar {
                width: 60px;
            }
            
            .sidebar:hover {
                width: 220px;
            }
            
            #home-view,
            #search-view,
            #profile-view {
                max-width: 100%;
            }
            
            .post-card {
                border-radius: 8px;
            }
            
            .profile-posts {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            .app-header {
                display: flex;
            }
            
            .bottom-nav {
                display: flex;
            }
            
            .main-content {
                margin-left: 0;
                padding-top: 60px;
                padding-bottom: 60px;
            }
            
            .sidebar {
                display: none !important;
            }
            
            #home-view,
            #search-view,
            #profile-view {
                padding: 16px;
            }
            
            .messages-list {
                width: 100%;
                border-right: none;
                max-height: none;
                border-bottom: 1px solid var(--theme-border);
            }
            
            .message-view {
                display: none;
            }
            
            .message-view.active {
                display: flex;
            }
            
            .messages-list.hidden {
                display: none;
            }
            
            .profile-posts {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            
            .profile-avatar {
                width: 100px;
                height: 100px;
            }
            
            .publish-box {
                width: 95%;
                padding: 20px;
            }
            
            .post-actions {
                justify-content: space-around;
            }
            
            .action-btn {
                flex: 1;
                justify-content: center;
            }
            
            .msg-bubble {
                max-width: 85%;
            }
        }
        
        @media (max-width: 500px) {
            .gate-logo {
                font-size: 2.5rem;
                letter-spacing: 10px;
            }
            
            .post-card {
                border-radius: 0;
                margin: 0 -16px;
                width: calc(100% + 32px);
            }
            
            .profile-posts {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            
            .publish-box {
                width: 100%;
                padding: 16px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Star Canvas Background -->
    <canvas id="star-canvas"></canvas>
    
    <!-- Auth Gate Screen -->
    <div id="auth-gate">
        <div class="gate-container">
            <div class="gate-logo">NEXUS</div>
            <p class="gate-subtitle">COSMIC SOCIAL PROTOCOL</p>
            <p class="gate-description">Connect with the cosmos. Share moments. Build communities across the universe.</p>
            <button class="btn-primary" onclick="handleLogin()" id="login-btn">
                <i class="fas fa-rocket" style="margin-right: 8px;"></i>INITIALIZE SYNC
            </button>
            <div class="error-msg" id="auth-error" style="display:none;"></div>
        </div>
    </div>
    
    <!-- Identity Setup Screen -->
    <div id="identity-lock">
        <div class="lock-box">
            <div class="lock-header">
                <h2><i class="fas fa-star" style="margin-right: 8px;"></i>PILOT CREDENTIALS</h2>
                <p>Create your cosmic identity</p>
            </div>
            
            <div class="form-group">
                <label class="form-label">CALLSIGN</label>
                <input type="text" id="pilot-name" class="form-input" placeholder="e.g., CosmicExplorer" maxlength="30">
            </div>
            
            <div class="form-group">
                <label class="form-label">STATUS</label>
                <select id="pilot-status" class="form-input">
                    <option value="online">🟢 Online</option>
                    <option value="away">🟡 Away</option>
                    <option value="offline">⚪ Offline</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">BIO</label>
                <textarea id="pilot-bio" class="form-input" maxlength="160" placeholder="Your cosmic journey..." style="height: 80px; resize: vertical;"></textarea>
            </div>
            
            <button class="btn-primary" onclick="submitIdentity()" id="setup-btn" style="margin-bottom: 12px;">
                <i class="fas fa-star" style="margin-right: 8px;"></i>LAUNCH PROFILE
            </button>
            <div class="error-msg" id="setup-error" style="display:none;"></div>
        </div>
    </div>
    
    <!-- Main App -->
    <div class="nexus-wrapper" id="app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-icon" onclick="navigate('home')" title="Home">
                <i class="fas fa-home"></i>
                <span class="sidebar-label">Home</span>
            </div>
            <div class="sidebar-icon" onclick="navigate('search')" title="Search">
                <i class="fas fa-search"></i>
                <span class="sidebar-label">Search</span>
            </div>
            <div class="sidebar-icon" onclick="openPublishModal()" title="Create Post">
                <i class="fas fa-feather"></i>
                <span class="sidebar-label">Create</span>
            </div>
            <div class="sidebar-icon" onclick="navigate('messages')" title="Messages">
                <i class="fas fa-envelope"></i>
                <span class="sidebar-label">Messages</span>
            </div>
            <div class="sidebar-icon" onclick="navigate('profile')" title="Profile">
                <i class="fas fa-user"></i>
                <span class="sidebar-label">Profile</span>
            </div>
            
            <div class="sidebar-spacer"></div>
            
            <div class="sidebar-divider"></div>
            
            <div class="sidebar-icon" onclick="toggleTheme()" title="Toggle Theme">
                <i class="fas fa-moon"></i>
                <span class="sidebar-label">Theme</span>
            </div>
            <div class="sidebar-icon" onclick="handleLogout()" style="color: var(--theme-danger);" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
                <span class="sidebar-label">Logout</span>
            </div>
        </aside>
        
        <!-- Mobile Header -->
        <header class="app-header">
            <div class="header-logo">NEXUS</div>
            <div class="header-icons">
                <i class="fas fa-home header-icon" onclick="navigate('home')" title="Home"></i>
                <i class="fas fa-search header-icon" onclick="navigate('search')" title="Search"></i>
                <i class="fas fa-feather header-icon" onclick="openPublishModal()" title="Create"></i>
                <i class="fas fa-envelope header-icon" onclick="navigate('messages')" title="Messages"></i>
                <i class="fas fa-user header-icon" onclick="navigate('profile')" title="Profile"></i>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Home View -->
            <div id="home-view" class="content-view active">
                <div class="stories-bar" id="stories-bar"></div>
                <div class="feed" id="feed"></div>
            </div>
            
            <!-- Search View -->
            <div id="search-view" class="content-view">
                <input type="text" class="search-input" id="search-input" placeholder="🔍 Search users by name or bio..." autocomplete="off">
                <div class="search-results" id="search-results"></div>
            </div>
            
            <!-- Messages View -->
            <div id="messages-view" class="content-view">
                <div class="messages-list" id="messages-list">
                    <div class="messages-empty">
                        <i class="fas fa-inbox"></i>
                        <p>No conversations yet</p>
                    </div>
                </div>
                <div class="message-view hidden" id="message-view">
                    <div class="message-header">
                        <i class="fas fa-arrow-left message-back" onclick="backToMessagesList()"></i>
                        <span class="message-title" id="message-title"></span>
                    </div>
                    <div class="message-viewport" id="message-viewport"></div>
                    <div class="message-input">
                        <input type="text" id="message-input-text" placeholder="Type a message..." maxlength="500">
                        <button class="message-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
            
            <!-- Profile View -->
            <div id="profile-view" class="content-view">
                <div class="profile-header" id="profile-header"></div>
                <div class="profile-posts" id="profile-posts"></div>
            </div>
        </main>
        
        <!-- Mobile Bottom Navigation -->
        <nav class="bottom-nav">
            <i class="fas fa-home nav-icon active" onclick="navigate('home')" title="Home"></i>
            <i class="fas fa-search nav-icon" onclick="navigate('search')" title="Search"></i>
            <i class="fas fa-feather nav-icon" onclick="openPublishModal()" title="Create"></i>
            <i class="fas fa-envelope nav-icon" onclick="navigate('messages')" title="Messages"></i>
            <i class="fas fa-user nav-icon" onclick="navigate('profile')" title="Profile"></i>
        </nav>
    </div>
    
    <!-- Publish Modal -->
    <div id="publish-modal">
        <div class="publish-box">
            <div class="publish-header-row">
                <div class="publish-header">
                    <i class="fas fa-feather" style="margin-right: 8px;"></i>Create Post
                </div>
                <button class="close-btn" onclick="closePublishModal()"><i class="fas fa-times"></i></button>
            </div>
            
            <textarea class="publish-textarea" id="post-caption" placeholder="What's on your mind today?" maxlength="2000"></textarea>
            
            <div class="publish-preview-container">
                <img id="post-image-preview" class="publish-image-preview">
            </div>
            
            <div class="publish-actions">
                <label class="publish-file-label" for="post-image-upload" title="Add image">
                    <i class="fas fa-image"></i> Add Image
                </label>
                <input type="file" id="post-image-upload" accept="image/*" style="display:none" onchange="previewPostImage(this)">
                <button class="publish-btn" onclick="publishPost()" id="post-btn">
                    <i class="fas fa-paper-plane" style="margin-right: 6px;"></i>Post
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
            authDomain: "cosmic-notes-f7648.firebaseapp.com",
            projectId: "cosmic-notes-f7648",
            storageBucket: "cosmic-notes-f7648.appspot.com",
            messagingSenderId: "70656136344",
            appId: "1:70656136344:web:640193b83f63cac569aced"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        
        // ==================== APP STATE ====================
        let currentUser = null;
        let activeView = 'home';
        let activeMessageThread = null;
        let currentMessageUser = null;
        let userCache = new Map();
        let posts = [];
        
        // ==================== UTILITY FUNCTIONS ====================
        
        function showError(msg, elementId = null) {
            if (elementId) {
                const el = document.getElementById(elementId);
                if (el) {
                    el.textContent = msg;
                    el.style.display = 'block';
                    setTimeout(() => { el.style.display = 'none'; }, 5000);
                }
            } else {
                alert(msg);
            }
        }
        
        function clearError(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.display = 'none';
                el.textContent = '';
            }
        }
        
        function debounce(func, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => func(...args), delay);
            };
        }
        
        function formatTime(timestamp) {
            if (!timestamp) return 'now';
            try {
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                const now = new Date();
                const diff = now - date;
                const mins = Math.floor(diff / 60000);
                const hours = Math.floor(diff / 3600000);
                const days = Math.floor(diff / 86400000);
                
                if (mins < 1) return 'now';
                if (mins < 60) return `${mins}m`;
                if (hours < 24) return `${hours}h`;
                if (days < 7) return `${days}d`;
                return date.toLocaleDateString();
            } catch (e) {
                return 'now';
            }
        }
        
        function getRandomColor() {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // ==================== THEME MANAGEMENT ====================
        
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }
        
        function initTheme() {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-theme');
            }
        }
        
        initTheme();
        
        // ==================== AUTHENTICATION ====================
        
        async function handleLogin() {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i>SYNCING...';
            clearError('auth-error');
            
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                await auth.signInWithPopup(provider);
            } catch (error) {
                showError('Login failed: ' + error.message, 'auth-error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-rocket" style="margin-right: 8px;"></i>INITIALIZE SYNC';
            }
        }
        
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                db.collection('users').doc(user.uid).get().then(doc => {
                    if (!doc.exists || !doc.data().name) {
                        document.getElementById('auth-gate').style.display = 'none';
                        document.getElementById('identity-lock').style.display = 'flex';
                    } else {
                        showApp();
                    }
                }).catch(err => {
                    console.error('Error fetching user:', err);
                    showError('Error loading user data');
                });
            } else {
                document.getElementById('auth-gate').style.display = 'flex';
                document.getElementById('identity-lock').style.display = 'none';
                document.getElementById('app').classList.remove('active');
            }
        });
        
        async function submitIdentity() {
            const name = document.getElementById('pilot-name').value.trim();
            const status = document.getElementById('pilot-status').value;
            const bio = document.getElementById('pilot-bio').value.trim() || 'Cosmic Traveler';
            const btn = document.getElementById('setup-btn');
            
            clearError('setup-error');
            
            if (name.length < 3) {
                showError('Name must be at least 3 characters', 'setup-error');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i>LAUNCHING...';
            
            try {
                await db.collection('users').doc(currentUser.uid).set({
                    name,
                    status,
                    bio,
                    avatar: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=${getRandomColor().slice(1)}&color=fff`,
                    followers: [],
                    following: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                
                showApp();
            } catch (err) {
                showError('Error: ' + err.message, 'setup-error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-star" style="margin-right: 8px;"></i>LAUNCH PROFILE';
            }
        }
        
        function showApp() {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('identity-lock').style.display = 'none';
            document.getElementById('app').classList.add('active');
            loadApp();
        }
        
        function handleLogout() {
            if (confirm('Logout from Nexus Gram?')) {
                auth.signOut();
            }
        }
        
        // ==================== NAVIGATION ====================
        
        function navigate(view) {
            activeView = view;
            document.querySelectorAll('.content-view').forEach(el => el.classList.remove('active'));
            document.getElementById(view + '-view').classList.add('active');
            
            document.querySelectorAll('.nav-icon, .sidebar-icon, .header-icon').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`[onclick*="navigate('${view}')"]`).forEach(el => el.classList.add('active'));
            
            if (view === 'search') loadSearch();
            if (view === 'messages') loadMessages();
            if (view === 'profile') loadProfile();
        }
        
        // ==================== USER CACHE ====================
        
        async function getUser(uid) {
            if (userCache.has(uid)) return userCache.get(uid);
            try {
                const doc = await db.collection('users').doc(uid).get();
                if (doc.exists) {
                    userCache.set(uid, doc.data());
                    return doc.data();
                }
            } catch (err) {
                console.error('Error fetching user:', err);
            }
            return null;
        }
        
        // ==================== STORIES ====================
        
        async function loadStories() {
            try {
                const bar = document.getElementById('stories-bar');
                bar.innerHTML = '';
                
                const myStory = document.createElement('div');
                myStory.className = 'story-circle';
                myStory.innerHTML = '<i class="fas fa-plus" style="font-size:1.8rem;"></i>';
                myStory.title = 'Add story (coming soon)';
                myStory.style.cursor = 'not-allowed';
                myStory.style.opacity = '0.6';
                bar.appendChild(myStory);
                
                const user = await getUser(currentUser.uid);
                if (user && user.following && user.following.length > 0) {
                    for (let uid of user.following.slice(0, 15)) {
                        try {
                            const u = await getUser(uid);
                            if (u) {
                                const story = document.createElement('div');
                                story.className = 'story-circle has-story';
                                story.title = u.name;
                                story.innerHTML = `<div class="story-avatar"><img src="${u.avatar}" alt="${u.name}"></div>`;
                                bar.appendChild(story);
                            }
                        } catch (e) {
                            console.error('Error loading story:', e);
                        }
                    }
                }
            } catch (err) {
                console.error('Error loading stories:', err);
            }
        }
        
        // ==================== FEED ====================
        
        let feedUnsubscribe = null;
        
        async function loadFeed() {
            try {
                const feed = document.getElementById('feed');
                feed.innerHTML = '<div class="loading-spinner"></div>';
                
                if (feedUnsubscribe) feedUnsubscribe();
                
                feedUnsubscribe = db.collection('posts')
                    .orderBy('createdAt', 'desc')
                    .limit(50)
                    .onSnapshot(
                        snapshot => {
                            posts = [];
                            snapshot.forEach(doc => {
                                posts.push({ ...doc.data(), id: doc.id });
                            });
                            renderFeed();
                        },
                        err => {
                            console.error('Feed error:', err);
                            feed.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Error loading feed</p></div>';
                        }
                    );
            } catch (err) {
                console.error('Error in loadFeed:', err);
            }
        }
        
        async function renderFeed() {
            const feed = document.getElementById('feed');
            if (posts.length === 0) {
                feed.innerHTML = '<div class="empty-state"><i class="fas fa-scroll"></i><p>No posts yet.<br>Follow users to see their content!</p></div>';
                return;
            }
            
            feed.innerHTML = '';
            for (let post of posts) {
                try {
                    const user = await getUser(post.userId);
                    if (!user) continue;
                    
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    
                    const likes = post.likes || [];
                    const likeCount = likes.length;
                    const isLiked = likes.includes(currentUser.uid);
                    const commentCount = (post.comments || []).length;
                    
                    let commentsHtml = '';
                    if (post.comments && post.comments.length > 0) {
                        for (let comment of post.comments.slice(0, 2)) {
                            const commentUser = await getUser(comment.userId);
                            commentsHtml += `
                                <div class="comment">
                                    <div class="comment-avatar"><img src="${commentUser?.avatar || 'https://via.placeholder.com/30'}" alt=""></div>
                                    <div class="comment-content">
                                        <div class="comment-header">
                                            <span class="comment-username">${commentUser?.name || 'User'}</span>
                                        </div>
                                        <div class="comment-text">${comment.text}</div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                    
                    card.innerHTML = `
                        <div class="post-header">
                            <div class="post-avatar"><img src="${user.avatar}" alt="${user.name}"></div>
                            <div class="post-user-info">
                                <div class="post-username">${user.name}</div>
                                <div class="post-time">${formatTime(post.createdAt)}</div>
                            </div>
                            <div class="post-menu"><i class="fas fa-ellipsis-h"></i></div>
                        </div>
                        ${post.image ? `<img class="post-image" src="${post.image}" alt="post">` : ''}
                        <div class="post-actions">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                                <i class="fas fa-heart"></i>
                                ${likeCount > 0 ? `<span class="action-count">${likeCount}</span>` : ''}
                            </button>
                            <button class="action-btn" onclick="focusComment('${post.id}')">
                                <i class="fas fa-comment"></i>
                                ${commentCount > 0 ? `<span class="action-count">${commentCount}</span>` : ''}
                            </button>
                            <button class="action-btn" onclick="sharePost('${post.id}')"><i class="fas fa-share"></i></button>
                        </div>
                        ${likeCount > 0 ? `<div class="post-stats"><div class="stat-item"><strong>${likeCount}</strong> ${likeCount === 1 ? 'like' : 'likes'}</div></div>` : ''}
                        <div class="post-caption"><span class="caption-user">${user.name}</span> ${post.caption || ''}</div>
                        ${commentsHtml ? `<div class="post-comments">${commentsHtml}</div>` : ''}
                        <div class="comment-input">
                            <div class="comment-input-avatar"><img src="${(await getUser(currentUser.uid))?.avatar}" alt=""></div>
                            <div class="comment-input-field">
                                <input type="text" id="comment-input-${post.id}" placeholder="Add comment..." maxlength="200">
                                <button class="comment-send" onclick="addComment('${post.id}')"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </div>
                    `;
                    feed.appendChild(card);
                } catch (err) {
                    console.error('Error rendering post:', err);
                }
            }
        }
        
        async function toggleLike(postId) {
            try {
                const post = posts.find(p => p.id === postId);
                if (!post) return;
                
                let likes = post.likes || [];
                if (likes.includes(currentUser.uid)) {
                    likes = likes.filter(id => id !== currentUser.uid);
                } else {
                    likes.push(currentUser.uid);
                }
                
                await db.collection('posts').doc(postId).update({ likes });
            } catch (err) {
                console.error('Error toggling like:', err);
                showError('Error updating like');
            }
        }
        
        async function addComment(postId) {
            try {
                const input = document.getElementById(`comment-input-${postId}`);
                const text = input.value.trim();
                if (!text) return;
                
                const post = posts.find(p => p.id === postId);
                if (!post) return;
                
                let comments = post.comments || [];
                comments.push({
                    userId: currentUser.uid,
                    text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                await db.collection('posts').doc(postId).update({ comments });
                input.value = '';
            } catch (err) {
                console.error('Error adding comment:', err);
                showError('Error posting comment');
            }
        }
        
        function focusComment(postId) {
            document.getElementById(`comment-input-${postId}`).focus();
        }
        
        function sharePost(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            const text = `Check out this post: "${post.caption?.substring(0, 50)}..."`;
            if (navigator.share) {
                navigator.share({ title: 'Nexus Gram', text });
            } else {
                alert('Share: ' + text);
            }
        }
        
        // ==================== PUBLISH MODAL ====================
        
        function openPublishModal() {
            clearError('publish-error');
            document.getElementById('post-caption').value = '';
            document.getElementById('post-image-preview').style.display = 'none';
            document.getElementById('post-image-upload').value = '';
            document.getElementById('publish-modal').style.display = 'flex';
        }
        
        function closePublishModal() {
            document.getElementById('publish-modal').style.display = 'none';
        }
        
        function previewPostImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                if (file.size > 5000000) {
                    showError('Image must be less than 5MB');
                    input.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('post-image-preview').src = e.target.result;
                    document.getElementById('post-image-preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
        
        async function publishPost() {
            const caption = document.getElementById('post-caption').value.trim();
            const file = document.getElementById('post-image-upload').files[0];
            const btn = document.getElementById('post-btn');
            
            if (!caption && !file) {
                showError('Add content (text or image)');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 6px;"></i>Posting...';
            
            try {
                let image = null;
                if (file) {
                    const ref = storage.ref(`posts/${currentUser.uid}/${Date.now()}`);
                    const snapshot = await ref.put(file);
                    image = await snapshot.ref.getDownloadURL();
                }
                
                await db.collection('posts').add({
                    userId: currentUser.uid,
                    caption,
                    image,
                    likes: [],
                    comments: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                closePublishModal();
                loadFeed();
            } catch (err) {
                console.error('Error publishing:', err);
                showError('Error publishing post: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right: 6px;"></i>Post';
            }
        }
        
        document.getElementById('publish-modal').addEventListener('click', e => {
            if (e.target.id === 'publish-modal') closePublishModal();
        });
        
        // ==================== SEARCH ====================
        
        async function loadSearch() {
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');
            
            input.addEventListener('input', debounce(async () => {
                const query = input.value.toLowerCase().trim();
                if (!query) {
                    results.innerHTML = '';
                    return;
                }
                
                try {
                    const snapshot = await db.collection('users').get();
                    results.innerHTML = '';
                    
                    const matches = [];
                    snapshot.forEach(doc => {
                        const user = doc.data();
                        if (doc.id !== currentUser.uid &&
                            (user.name.toLowerCase().includes(query) ||
                             user.bio.toLowerCase().includes(query))) {
                            matches.push({ id: doc.id, ...user });
                        }
                    });
