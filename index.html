<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Notes</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #000;
  color: #fff;
}
.app { max-width: 420px; margin: auto; min-height: 100vh; }
.center { text-align: center; padding: 15px; }
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
}
button { background: #6c63ff; color: white; }
.note {
  background: #111;
  margin: 10px;
  padding: 12px;
  border-radius: 12px;
}
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 1px solid #222;
}
img { border-radius: 50%; }
.nav button { width: 48%; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="app center">
  <h2>🌌 Cosmic Notes</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="emailLogin()">Login / Signup</button>
  <button onclick="googleLogin()" style="background:#db4437">Google Login</button>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none;">

  <div class="topbar">
    <span id="title">🌌 Cosmic Notes</span>
    <button onclick="logout()" style="width:auto;">Logout</button>
  </div>

  <!-- FEED -->
  <div id="feed"></div>

  <!-- PROFILE -->
  <div id="profile" class="center" style="display:none;">
    <img id="profilePic" width="120"><br>
    <input type="file" id="avatar" accept="image/*">
    <button onclick="uploadAvatar()">Upload Photo</button>
    <p id="userEmail"></p>
    <h3>My Notes</h3>
    <div id="myNotes"></div>
  </div>

  <!-- POST -->
  <div id="postBox" class="center">
    <input id="noteInput" placeholder="Write something cosmic...">
    <button onclick="postNote()">Post</button>
  </div>

  <!-- NAV -->
  <div class="center nav">
    <button onclick="showFeed()">🏠 Feed</button>
    <button onclick="showProfile()">👤 Profile</button>
  </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
  authDomain: "cosmic-notes-f7648.firebaseapp.com",
  projectId: "cosmic-notes-f7648",
  storageBucket: "cosmic-notes-f7648.appspot.com",
  messagingSenderId: "70656136344",
  appId: "1:70656136344:web:640193b83f63cac569aced"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

const loginDiv = document.getElementById("login");
const appDiv = document.getElementById("app");
const feed = document.getElementById("feed");

auth.onAuthStateChanged(user => {
  if (user) {
    loginDiv.style.display = "none";
    appDiv.style.display = "block";
    loadFeed();
    loadProfile();
  } else {
    loginDiv.style.display = "block";
    appDiv.style.display = "none";
  }
});

function emailLogin() {
  auth.signInWithEmailAndPassword(email.value, password.value)
    .catch(() => auth.createUserWithEmailAndPassword(email.value, password.value));
}

function googleLogin() {
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}

function logout() { auth.signOut(); }

function postNote() {
  if (!noteInput.value) return;
  db.collection("notes").add({
    text: noteInput.value,
    uid: auth.currentUser.uid,
    time: Date.now()
  });
  noteInput.value = "";
}

function loadFeed() {
  db.collection("notes").orderBy("time","desc")
    .onSnapshot(snap => {
      feed.innerHTML = "";
      snap.forEach(doc => {
        let d = document.createElement("div");
        d.className = "note";
        d.innerText = doc.data().text;
        feed.appendChild(d);
      });
    });
}

function showProfile() {
  title.innerText = "👤 Profile";
  feed.style.display = "none";
  postBox.style.display = "none";
  profile.style.display = "block";
}

function showFeed() {
  title.innerText = "🌌 Cosmic Notes";
  feed.style.display = "block";
  postBox.style.display = "block";
  profile.style.display = "none";
}

function loadProfile() {
  userEmail.innerText = auth.currentUser.email;
  db.collection("notes")
    .where("uid","==",auth.currentUser.uid)
    .orderBy("time","desc")
    .onSnapshot(snap => {
      myNotes.innerHTML = "";
      snap.forEach(doc => {
        let d = document.createElement("div");
        d.className = "note";
        d.innerText = doc.data().text;
        myNotes.appendChild(d);
      });
    });

  db.collection("users").doc(auth.currentUser.uid).get()
    .then(doc => {
      if (doc.exists && doc.data().photo) {
        profilePic.src = doc.data().photo;
      }
    });
}

function uploadAvatar() {
  let file = avatar.files[0];
  if (!file) return;

  let ref = storage.ref("avatars/" + auth.currentUser.uid);
  ref.put(file).then(() => {
    ref.getDownloadURL().then(url => {
      profilePic.src = url;
      db.collection("users").doc(auth.currentUser.uid).set({
        email: auth.currentUser.email,
        photo: url
      });
    });
  });
}
</script>

</body>
</html>
