<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Notes | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#000;color:#fff;font-family:system-ui;
  display:flex;justify-content:center;align-items:center;height:100vh;
}
.card{
  width:340px;background:#111;padding:20px;border-radius:16px;
}
input,button{
  width:100%;padding:12px;margin-top:10px;
  border-radius:12px;border:none;
}
button{background:#6c63ff;color:#fff;cursor:pointer;}
.google{background:#222;}
</style>
</head>

<body>
<div class="card">
  <h2>🌌 Cosmic Notes</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username (unique)">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
  <button class="google" onclick="googleLogin()">Continue with Google</button>
</div>

<script type="module" src="./auth.js"></script>
</body>
</html>
