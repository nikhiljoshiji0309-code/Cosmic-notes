<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Cosmic Notes</title>

<style>
body { margin:0; font-family: system-ui; background:#000; color:#fff; }
.app { max-width: 420px; margin:auto; min-height:100vh; }
.center { text-align:center; padding:20px; }
.note { background:#111; padding:12px; border-radius:12px; margin:10px; }
.profile { display:flex; flex-direction:column; align-items:center; margin-top:20px; }
.profile img { width:100px; height:100px; border-radius:50%; margin-bottom:10px; }
</style>
</head>
<body>

<div class="app">
  <div class="center profile">
    <img id="profilePic" src="" alt="Profile">
    <h2 id="displayName"></h2>
    <p id="bio"></p>
  </div>

  <h3 style="text-align:center;">Posts</h3>
  <div id="userPosts"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyAxbBOThZxG5W_R1i0zVmh-TxzWOE1uDhM",
  authDomain: "cosmic-notes-f7648.firebaseapp.com",
  projectId: "cosmic-notes-f7648",
  messagingSenderId: "70656136344",
  appId: "1:70656136344:web:640193b83f63cac569aced"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Get UID from URL
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');

const profilePic = document.getElementById('profilePic');
const displayName = document.getElementById('displayName');
const bio = document.getElementById('bio');
const userPosts = document.getElementById('userPosts');

// Load user info
db.collection('users').doc(uid).get().then(doc => {
  const data = doc.data();
  profilePic.src = data.photoURL;
  displayName.textContent = data.displayName;
  bio.textContent = data.bio;
});

// Load user's posts
db.collection('notes').where('uid','==',uid).orderBy('time','desc')
  .onSnapshot(snapshot => {
    userPosts.innerHTML = '';
    snapshot.forEach(doc => {
      const div = document.createElement('div');
      div.className = 'note';
      div.textContent = doc.data().text;
      userPosts.appendChild(div);
    });
  });
</script>
</body>
</html>
