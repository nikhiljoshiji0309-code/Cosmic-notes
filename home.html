<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Notes | Discover</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: system-ui;
}

.topbar {
  padding: 14px;
  text-align: center;
  border-bottom: 1px solid #222;
  font-size: 18px;
}

.feed {
  padding: 14px;
  max-width: 600px;
  margin: auto;
}

.post {
  background: #111;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.username {
  font-weight: 600;
  font-size: 14px;
  color: #6c63ff;
  margin-bottom: 6px;
}

.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #6c63ff;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="topbar">🌍 Discover</div>

<div class="feed" id="feed"></div>

<div class="fab" onclick="openPost()">+</div>

<script type="module" src="./posts.js"></script>
</body>
</html>
